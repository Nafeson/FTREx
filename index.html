<script>

/* =========================================
IN-2
HOMEPAGE INTERACTIONS / BASKET / CALCULATOR

PRICING + PHYSICAL GLASS MAKE-UP ARE
CENTRALISED IN IN-3.

IN-3 PROVIDES:
- getHomepageProductCardPrice()
- getCustomCalculatorPrice()
- getCustomSelfCleaningPrice()
- getItemTopGlassLabel()

IMPORTANT:
MASTER-DEPENDENT INITIALISATION IS DEFERRED
UNTIL THE FINAL INITIALISATION SECTION AFTER
IN-3 HAS BEEN LOADED.
========================================= */

const prefersReducedMotion =
window.matchMedia(
"(prefers-reduced-motion: reduce)"
).matches;

/* =========================================
CHANGE 7
DISABLE DOUBLE-TAP TO ZOOM

Keeps normal scrolling and pinch behaviour,
while disabling browser double-tap zoom across
the homepage and basket interface.
========================================= */

const homepageTouchActionStyle =
document.createElement(
"style"
);

homepageTouchActionStyle.textContent = `
html,
body,
header,
main,
section,
footer,
.menu-overlay,
.menu-panel,
.menu-backdrop,
.email-action,
.basket-drawer-layer,
.basket-drawer-panel,
.basket-drawer-body,
.basket-drawer-footer,
button,
a,
input,
select,
label,
details,
summary {
touch-action:manipulation;
}
`;

document.head.appendChild(
homepageTouchActionStyle
);

/* =========================================
MENU DRAWER DOM / STATE

70% DRAWER
OPENS FROM LEFT
MATCHES BASKET DRAWER BEHAVIOUR
========================================= */

const menuButton =
document.getElementById(
"menuButton"
);

const menuOverlay =
document.getElementById(
"menuOverlay"
);

const menuPanel =
document.getElementById(
"menuPanel"
);

const menuContactTeamButton =
document.getElementById(
"menuContactTeamButton"
);

let menuDrawerIsOpen =
false;

let menuDrawerScrollY =
0;

let menuDrawerPreviousBodyStyles =
null;

let lastMenuFocusedElement =
null;

/* =========================================
MENU BACKGROUND / PAGE LOCK
========================================= */

function getHomepageMenuBackgroundElements() {

if (
!menuOverlay
) {

return [];

}

const desktopBlocker =
document.getElementById(
"desktopAccessBlocker"
);

return Array.from(
document.body.children
).filter(
(element) =>
element !==
menuOverlay &&
element !==
desktopBlocker &&
element.tagName !==
"SCRIPT"
);

}

function setHomepageMenuBackgroundInert(
shouldBeInert
) {

getHomepageMenuBackgroundElements()
.forEach(
(element) => {

element.inert =
shouldBeInert;

}
);

}

function lockHomepageMenuPageScroll() {

menuDrawerScrollY =
window.scrollY ||
document.documentElement.scrollTop ||
0;

menuDrawerPreviousBodyStyles = {
position:
document.body.style.position,
top:
document.body.style.top,
left:
document.body.style.left,
right:
document.body.style.right,
width:
document.body.style.width,
overflow:
document.body.style.overflow
};

document.body.classList.add(
"menu-drawer-open"
);

document.body.style.position =
"fixed";

document.body.style.top =
`-${menuDrawerScrollY}px`;

document.body.style.left =
"0";

document.body.style.right =
"0";

document.body.style.width =
"100%";

document.body.style.overflow =
"hidden";

}

function unlockHomepageMenuPageScroll() {

document.body.classList.remove(
"menu-drawer-open"
);

if (
menuDrawerPreviousBodyStyles
) {

document.body.style.position =
menuDrawerPreviousBodyStyles.position;

document.body.style.top =
menuDrawerPreviousBodyStyles.top;

document.body.style.left =
menuDrawerPreviousBodyStyles.left;

document.body.style.right =
menuDrawerPreviousBodyStyles.right;

document.body.style.width =
menuDrawerPreviousBodyStyles.width;

document.body.style.overflow =
menuDrawerPreviousBodyStyles.overflow;

}
else {

document.body.style.position =
"";

document.body.style.top =
"";

document.body.style.left =
"";

document.body.style.right =
"";

document.body.style.width =
"";

document.body.style.overflow =
"";

}

window.scrollTo(
0,
menuDrawerScrollY
);

menuDrawerPreviousBodyStyles =
null;

}

function getHomepageMenuFocusableElements() {

if (
!menuPanel
) {

return [];

}

return Array.from(
menuPanel.querySelectorAll(
[
"button:not([disabled])",
"input:not([disabled])",
"select:not([disabled])",
"textarea:not([disabled])",
"a[href]",
"[tabindex]:not([tabindex='-1'])"
].join(
","
)
)
).filter(
(element) => {

return (
!element.hasAttribute(
"hidden"
) &&
element.offsetParent !==
null
);

}
);

}

/* =========================================
OPEN / CLOSE MENU
========================================= */

function openMenu() {

if (
!menuOverlay ||
!menuPanel ||
!menuButton
) {

return;

}

if (
menuDrawerIsOpen
) {

return;

}

if (
basketDrawerIsOpen
) {

closeBasketDrawer({
restoreFocus:false
});

}

closeWhatsappAction();

closeEmailAction();

lastMenuFocusedElement =
document.activeElement;

menuDrawerIsOpen =
true;

lockHomepageMenuPageScroll();

setHomepageMenuBackgroundInert(
true
);

menuOverlay.classList.add(
"active"
);

menuOverlay.setAttribute(
"aria-hidden",
"false"
);

menuButton.setAttribute(
"aria-expanded",
"true"
);

window.requestAnimationFrame(
() => {

const closeButton =
menuPanel.querySelector(
".close-menu"
);

if (
closeButton
) {

try {

closeButton.focus({
preventScroll:true
});

}
catch (error) {

closeButton.focus();

}

}
else {

try {

menuPanel.focus({
preventScroll:true
});

}
catch (error) {

menuPanel.focus();

}

}

}
);

}

function closeMenu(
{
restoreFocus = true
} = {}
) {

if (
!menuOverlay ||
!menuButton ||
!menuDrawerIsOpen
) {

return;

}

menuDrawerIsOpen =
false;

menuOverlay.classList.remove(
"active"
);

menuOverlay.setAttribute(
"aria-hidden",
"true"
);

menuButton.setAttribute(
"aria-expanded",
"false"
);

setHomepageMenuBackgroundInert(
false
);

unlockHomepageMenuPageScroll();

applyDesktopAccessRestriction();

if (
restoreFocus &&
lastMenuFocusedElement &&
typeof lastMenuFocusedElement.focus ===
"function"
) {

window.requestAnimationFrame(
() => {

if (
!document.contains(
lastMenuFocusedElement
)
) {

return;

}

try {

lastMenuFocusedElement.focus({
preventScroll:true
});

}
catch (error) {

lastMenuFocusedElement.focus();

}

}
);

}

lastMenuFocusedElement =
null;

}

/* =========================================
MENU KEYBOARD / FOCUS TRAP
========================================= */

document.addEventListener(
"keydown",
(event) => {

if (
!menuDrawerIsOpen
) {

return;

}

if (
event.key ===
"Escape"
) {

event.preventDefault();

closeMenu();

return;

}

if (
event.key !==
"Tab"
) {

return;

}

const focusableElements =
getHomepageMenuFocusableElements();

if (
!focusableElements.length
) {

event.preventDefault();

menuPanel?.focus({
preventScroll:true
});

return;

}

const first =
focusableElements[0];

const last =
focusableElements[
focusableElements.length -
1
];

if (
event.shiftKey &&
document.activeElement ===
first
) {

event.preventDefault();

last.focus();

return;

}

if (
!event.shiftKey &&
document.activeElement ===
last
) {

event.preventDefault();

first.focus();

}

}
);

/* =========================================
MENU CUSTOM BUILDER LINK
========================================= */

const menuBuildRooflightLink =
document.getElementById(
"menuBuildRooflightLink"
);

if (
menuBuildRooflightLink
) {

menuBuildRooflightLink.addEventListener(
"click",
() => {

closeMenu({
restoreFocus:false
});

}
);

}

/* =========================================
EMAIL HEADER ACTION
========================================= */

const emailButton =
document.getElementById(
"emailButton"
);

const emailAction =
document.getElementById(
"emailAction"
);

const footerContactUs =
document.getElementById(
"footerContactUs"
);

function closeEmailAction() {

if (
!emailButton ||
!emailAction
) {

return;

}

emailAction.classList.remove(
"is-open"
);

emailButton.classList.remove(
"is-selected"
);

emailButton.setAttribute(
"aria-expanded",
"false"
);

}

function openEmailAction() {

if (
!emailButton ||
!emailAction
) {

return;

}

closeWhatsappAction();

emailAction.classList.add(
"is-open"
);

emailButton.classList.add(
"is-selected"
);

emailButton.setAttribute(
"aria-expanded",
"true"
);

}

if (
emailButton &&
emailAction
) {

emailButton.addEventListener(
"click",
(event) => {

event.stopPropagation();

const willOpen =
!emailAction.classList.contains(
"is-open"
);

if (
willOpen
) {

closeWhatsappAction();

}

emailAction.classList.toggle(
"is-open",
willOpen
);

emailButton.classList.toggle(
"is-selected",
willOpen
);

emailButton.setAttribute(
"aria-expanded",
willOpen
? "true"
: "false"
);

}
);

emailAction.addEventListener(
"click",
() => {

closeEmailAction();

}
);

document.addEventListener(
"click",
(event) => {

if (
event.target.closest(
"#emailButton"
) ||
event.target.closest(
"#emailAction"
)
) {

return;

}

closeEmailAction();

}
);

}

/* =========================================
FOOTER CONTACT US
========================================= */

if (
footerContactUs
) {

footerContactUs.addEventListener(
"click",
(event) => {

event.preventDefault();

event.stopPropagation();

openEmailAction();

}
);

}

/* =========================================
WHATSAPP HEADER ACTION
========================================= */

const whatsappButton =
document.getElementById(
"whatsappButton"
);

const whatsappAction =
document.getElementById(
"whatsappAction"
);

function closeWhatsappAction() {

if (
!whatsappButton ||
!whatsappAction
) {

return;

}

whatsappAction.classList.remove(
"is-open"
);

whatsappButton.classList.remove(
"is-selected"
);

whatsappButton.setAttribute(
"aria-expanded",
"false"
);

}

if (
whatsappButton &&
whatsappAction
) {

whatsappButton.addEventListener(
"click",
(event) => {

event.stopPropagation();

const willOpen =
!whatsappAction.classList.contains(
"is-open"
);

if (
willOpen
) {

closeEmailAction();

}

whatsappAction.classList.toggle(
"is-open",
willOpen
);

whatsappButton.classList.toggle(
"is-selected",
willOpen
);

whatsappButton.setAttribute(
"aria-expanded",
willOpen
? "true"
: "false"
);

}
);

document.addEventListener(
"click",
(event) => {

if (
event.target.closest(
"#whatsappButton"
) ||
event.target.closest(
"#whatsappAction"
)
) {

return;

}

closeWhatsappAction();

}
);

}

/* =========================================
MENU CONTACT OUR TEAM
========================================= */

if (
menuContactTeamButton
) {

menuContactTeamButton.addEventListener(
"click",
(event) => {

event.preventDefault();

closeMenu({
restoreFocus:false
});

window.requestAnimationFrame(
() => {

openEmailAction();

}
);

}
);

}

/* =========================================
ESCAPE ALSO CLOSES SMALL CONTACT ACTIONS
========================================= */

document.addEventListener(
"keydown",
(event) => {

if (
event.key !==
"Escape"
) {

return;

}

closeEmailAction();

closeWhatsappAction();

}
);

/* =========================================
GET IN TOUCH BUTTON
========================================= */

const homepageGetInTouch =
document.getElementById(
"homepageGetInTouch"
);

if (
homepageGetInTouch
) {

homepageGetInTouch.addEventListener(
"click",
() => {

const contact =
document.getElementById(
"contact"
);

if (
contact
) {

contact.scrollIntoView({
behavior:
prefersReducedMotion
? "auto"
: "smooth",
block:"start"
});

}

}
);

}

/* =========================================
DESKTOP ACCESS RESTRICTION
========================================= */

function applyDesktopAccessRestriction() {

const blocker =
document.getElementById(
"desktopAccessBlocker"
);

if (
!blocker
) {

return;

}

const desktopPointer =
window.matchMedia(
"(hover: hover) and (pointer: fine)"
);

if (
desktopPointer.matches
) {

blocker.setAttribute(
"aria-hidden",
"false"
);

try {

blocker.focus({
preventScroll:true
});

}
catch (error) {

blocker.focus();

}

}
else {

blocker.setAttribute(
"aria-hidden",
"true"
);

}

}

applyDesktopAccessRestriction();

/* =========================================
SCROLL REVEALS
========================================= */

const revealTargets =
Array.from(
document.querySelectorAll(
".reveal"
)
);

function showRevealTarget(
target
) {

if (
!target
) {

return;

}

target.classList.add(
"is-visible"
);

}

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

revealTargets.forEach(
showRevealTarget
);

}
else {

const revealObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

showRevealTarget(
entry.target
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.12,
rootMargin:
"0px 0px -5% 0px"
}
);

revealTargets.forEach(
(target) => {

revealObserver.observe(
target
);

}
);

}

/* =========================================
ORDER TRANSITION REVEALS
========================================= */

const transitionHeadingGroups =
Array.from(
document.querySelectorAll(
".order-transition-heading-group"
)
);

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

transitionHeadingGroups.forEach(
(target) => {

target.classList.add(
"is-visible"
);

}
);

}
else {

const transitionObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"is-visible"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.2
}
);

transitionHeadingGroups.forEach(
(target) => {

transitionObserver.observe(
target
);

}
);

}

/* =========================================
DIRECT IMAGE REVEAL
========================================= */

const directImageRevealTargets =
Array.from(
document.querySelectorAll(
".direct-image-reveal"
)
);

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

directImageRevealTargets.forEach(
(target) => {

target.classList.add(
"is-visible"
);

}
);

}
else {

const directImageRevealObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"is-visible"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.13
}
);

directImageRevealTargets.forEach(
(target) => {

directImageRevealObserver.observe(
target
);

}
);

}

/* =========================================
TRUST / ENGINEERED SHIMMER
========================================= */

function initializeShimmerCards(
selector
) {

const cards =
Array.from(
document.querySelectorAll(
selector
)
);

if (
!cards.length ||
prefersReducedMotion
) {

return;

}

if (
!("IntersectionObserver" in window)
) {

return;

}

const shimmerObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

const card =
entry.target;

setTimeout(
() => {

card.classList.add(
"shimmer-play"
);

},
120
);

observer.unobserve(
card
);

}
);

},
{
threshold:.35
}
);

cards.forEach(
(card) => {

shimmerObserver.observe(
card
);

}
);

}

initializeShimmerCards(
".trust-item"
);

initializeShimmerCards(
".engineered-card"
);

/* =========================================
MOBILE FEATURE SHIMMER
========================================= */

const mobileFeatureIcons =
document.getElementById(
"mobileFeatureIcons"
);

if (
mobileFeatureIcons &&
!prefersReducedMotion &&
"IntersectionObserver" in window
) {

const mobileFeatureObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"icon-shimmer-active"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.3
}
);

mobileFeatureObserver.observe(
mobileFeatureIcons
);

}

/* =========================================
PRODUCT CARD UTILITIES
========================================= */

function normalizeHomepageFinish(
finish
) {

const value =
String(
finish ||
"clear"
)
.trim()
.toLowerCase();

if (
value.replace(
/[\s_-]/g,
""
).includes(
"solarcontrol"
)
) {

return "solarcontrol";

}

if (
value.includes(
"blue"
)
) {

return "blue";

}

if (
value.includes(
"grey"
) ||
value.includes(
"gray"
)
) {

return "grey";

}

if (
value.includes(
"satin"
)
) {

return "satin";

}

return "clear";

}

function getHomepageProductCardGlazing(
card
) {

if (
!card
) {

return "triple";

}

const activeGlazingButton =
card.querySelector(
".home-glazing-toggle button.active"
);

if (
activeGlazingButton &&
activeGlazingButton.dataset.glazing
) {

return activeGlazingButton.dataset.glazing;

}

if (
card.dataset.defaultGlazing
) {

return card.dataset.defaultGlazing;

}

return "triple";

}

function formatHomepageProductPrice(
card,
price
) {

if (
!card
) {

return;

}

const main =
card.querySelector(
".home-price-main"
);

const decimals =
card.querySelector(
".home-price-decimals"
);

if (
!main ||
!decimals
) {

return;

}

const numericPrice =
Number(
price
);

if (
!Number.isFinite(
numericPrice
)
) {

return;

}

const fixed =
numericPrice.toFixed(
2
);

const parts =
fixed.split(
"."
);

main.textContent =
`£${parts[0]}`;

decimals.textContent =
`.${parts[1]}`;

}

function buildHomepageProductOrderUrl(
card,
glazing
) {

if (
!card
) {

return "order-page.html";

}

const size =
String(
card.dataset.productSize ||
""
);

const finish =
normalizeHomepageFinish(
card.dataset.finish
);

const params =
new URLSearchParams();

params.set(
"source",
"homepage-product-card"
);

if (
size
) {

params.set(
"size",
size
);

}

params.set(
"glazing",
glazing
);

params.set(
"finish",
finish
);

return (
"order-page.html?" +
params.toString()
);

}

function updateHomepageProductCard(
card
) {

if (
!card
) {

return;

}

const glazing =
getHomepageProductCardGlazing(
card
);

const price =
getHomepageProductCardPrice(
card,
glazing
);

formatHomepageProductPrice(
card,
price
);

const glazedLabel =
card.querySelector(
".home-glazed-label"
);

if (
glazedLabel
) {

glazedLabel.classList.toggle(
"triple",
glazing ===
"triple"
);

}

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.href =
buildHomepageProductOrderUrl(
card,
glazing
);

}

}

function initializeHomepageProductPrices() {

const productCards =
Array.from(
document.querySelectorAll(
".home-product-card[data-product-size]"
)
);

productCards.forEach(
(card) => {

const glazingButtons =
Array.from(
card.querySelectorAll(
".home-glazing-toggle button[data-glazing]"
)
);

const defaultGlazing =
card.dataset.defaultGlazing ||
"triple";

let activeGlazingButton =
glazingButtons.find(
(button) =>
button.dataset.glazing ===
defaultGlazing
);

if (
!activeGlazingButton
) {

activeGlazingButton =
glazingButtons.find(
(button) =>
button.classList.contains(
"active"
)
) ||
glazingButtons.find(
(button) =>
button.dataset.glazing ===
"triple"
) ||
glazingButtons[0];

}

glazingButtons.forEach(
(button) => {

button.classList.toggle(
"active",
button ===
activeGlazingButton
);

button.addEventListener(
"click",
(event) => {

event.preventDefault();
event.stopPropagation();

glazingButtons.forEach(
(otherButton) => {

otherButton.classList.toggle(
"active",
otherButton ===
button
);

}
);

updateHomepageProductCard(
card
);

}
);

}
);

updateHomepageProductCard(
card
);

}
);

}

/* =========================================
EXISTING PRODUCT CARD TWO-STAGE CLICK
========================================= */

const homepageProductCardSelectionStyle =
document.createElement(
"style"
);

homepageProductCardSelectionStyle.textContent = `

document.head.appendChild(
homepageProductCardSelectionStyle
);

const homepageSelectableProductCards =
Array.from(
document.querySelectorAll(
".home-product-card[data-product-size]"
)
);

function clearHomepageProductCardSelection(
exceptCard = null
) {

homepageSelectableProductCards.forEach(
(card) => {

if (
card ===
exceptCard
) {

return;

function getCalendarKey(

function addCalendarDays(

const copy =
new Date(

days

function getNthWeekdayOfMonth(

const first =
makeCalendarDate(

1

const firstWeekday =
first.getUTCDay();

const offset =
(
weekday -
firstWeekday +
7
) %
7;

return makeCalendarDate(
year,

1 +

occurrence -
1
) *
7

function getLastWeekdayOfMonth(

makeCalendarDate(

month +

function getEasterSunday(
year
) {

const a =
year %
19;

const b =
Math.floor(
year /
100
);

const c =
year %
100;

const d =
Math.floor(
b /
4
);

const e =
b %
4;

const f =
Math.floor(
(
b +
8
) /
25
);

const g =
Math.floor(
(
b -
f +
1
) /
3
);

const h =
(
19 *
a +
b -
d -
g +
15
) %
30;

const i =
Math.floor(
c /
4
);

const k =
c %
4;

const l =
(
32 +
2 *
e +
2 *
i -
h -
k
) %
7;

const m =
Math.floor(
(
a +
11 *
h +
22 *
l
) /
451
);

const month =
Math.floor(
(
h +
l -
7 *
m +
114
) /
31
);

const day =
(
(
h +
l -
7 *
m +
114
) %
31
) +
1;

return makeCalendarDate(
year,
month,
day
);

/* =========================================
BASKET STORAGE HELPERS

CROSS-PAGE RULES:

1. "items" / "customItems" ARE THE CURRENT
CANONICAL ARRAYS USED BY THE ORDER PAGE.

2. LEGACY ARRAY NAMES ARE ONLY USED IF THE
CANONICAL KEY DOES NOT EXIST.

3. AN EXISTING EMPTY CANONICAL ARRAY IS
AUTHORITATIVE. WE DO NOT RESURRECT ITEMS
FROM AN OLD STALE ALIAS.

4. IF HOMEPAGE NORMALISATION CANNOT
UNDERSTAND AN OTHERWISE VALID OBJECT,
THE ORIGINAL OBJECT IS PRESERVED IN
STORAGE RATHER THAN DELETED.
========================================= */

function readHomepageOrderPayload() {

try {

const raw =
localStorage.getItem(
HOMEPAGE_ORDER_STORAGE_KEY
);

if (
!raw
) {

return {
version:6,
items:[],
customItems:[]
};

}

const parsed =
JSON.parse(
raw
);

if (
Array.isArray(
parsed
)
) {

return {
version:6,
items:parsed,
customItems:[]
};

}

if (
parsed &&
typeof parsed ===
"object"
) {

return parsed;

}

}
catch (error) {

}

return {
version:6,
items:[],
customItems:[]
};

}

function writeHomepageOrderPayload(
payload

localStorage.setItem(

JSON.stringify(
payload
)
);

catch (error) {

}

}

function getOrderItemCollection(
payload
) {

if (
!payload ||
typeof payload !==
"object"
) {

return {
items:[],
key:"items"
};

}

/*
The current canonical Order Page key wins,
even when it deliberately contains [].
*/

if (
Array.isArray(
payload.items
)
) {

return {
items:
payload.items,
key:"items"
};

}

/*
Only migrate an older alias if the current
canonical key is genuinely absent.
*/

const legacyKeys = [
"orderItems",
"confirmedUnits",
"units",
"basketItems"
];

for (
const key
of legacyKeys
) {

if (
Array.isArray(
payload[
key
]
)
) {

return {
items:
payload[
key
],
key
};

}

}

payload.items = [];

return {
items:
payload.items,
key:"items"
};

}

function getCustomOrderItemCollection(
payload
) {

if (
!payload ||
typeof payload !==
"object"
) {

return {
items:[],
key:"customItems"
};

}

/*
The current canonical Order Page custom key
wins even when deliberately empty.
*/

if (
Array.isArray(
payload.customItems
)
) {

return {
items:
payload.customItems,
key:"customItems"
};

}

/*
Compatibility with older/current variants
that may have stored custom basket items
under another array name.
*/

const legacyKeys = [
"customOrderItems",
"customUnits",
"customBasketItems"
];

for (
const key
of legacyKeys
) {

if (
Array.isArray(
payload[
key
]
)
) {

return {
items:
payload[
key
],
key
};

}

}

payload.customItems = [];

return {
items:
payload.customItems,
key:"customItems"
};

}

/* =========================================
NON-DESTRUCTIVE ITEM NORMALISATION

A page-view must never destroy a shared
basket item.

If the homepage can fully normalise it,
the normalised version is used.

If it cannot, the original stored object is
retained and given a stable ID where needed.
========================================= */

function normaliseHomepageBasketItemSafely(
item,
kind
) {

if (
!item ||
typeof item !==
"object"
) {

return null;

}

let normalisedItem =
null;

try {

normalisedItem =
kind ===
"custom"
?
normaliseCustomBasketItemForRender(
item
)
:
normaliseStandardBasketItemForRender(
item
);

}
catch (error) {

normalisedItem =
null;

}

if (
normalisedItem &&
typeof normalisedItem ===
"object"
) {

return normalisedItem;

}

/*
Do not delete an Order Page item simply
because the homepage adapter could not
fully resolve it.
*/

ensureBasketOrderItemId(
item,
kind
);

return item;

}

function normaliseHomepageBasketPayload(
payload
) {

if (
!payload ||
typeof payload !==
"object"
) {

payload = {
version:6,
items:[],
customItems:[]
};

}

const standardCollection =
getOrderItemCollection(
payload
);

const customCollection =
getCustomOrderItemCollection(
payload
);

const standardItems =
standardCollection.items
.map(
(item) =>
normaliseHomepageBasketItemSafely(
item,
"standard"
)
)
.filter(
Boolean
);

const customItems =
customCollection.items
.map(
(item) =>
normaliseHomepageBasketItemSafely(
item,
"custom"
)
)
.filter(
Boolean
);

payload.version =
6;

/*
Always expose the canonical arrays so every
current page sees the same basket.
*/

payload.items =
standardItems;

payload.customItems =
customItems;

/*
If an older alias was the source, keep that
specific alias synchronized during migration.
*/

if (
standardCollection.key &&
standardCollection.key !==
"items"
) {

payload[
standardCollection.key
] =
standardItems;

}

if (
customCollection.key &&
customCollection.key !==
"customItems"
) {

payload[
customCollection.key
] =
customItems;

}

return payload;

}

function getHomepageBasketEntries(
payload

const entries = [];

const standardCollection =
getOrderItemCollection(
payload
);

standardCollection.items.forEach(
(item,index) => {

kind:"standard",
sourceIndex:index
});

}
);

const customCollection =
getCustomOrderItemCollection(
payload
);

customCollection.items.forEach(
(item,index) => {

entries.push({
item,
kind:"custom",
sourceIndex:index
});

}
);

return entries;

}

function getHomepageBasketItems(

}

function getMutableBasketCollection(
payload,
kind
) {

return kind ===
"custom"
?
getCustomOrderItemCollection(
payload
).items
:
getOrderItemCollection(
payload
).items;

}

function getBasketItemIndexById(
payload,
kind,
itemId,
fallbackIndex = null
) {

const collection =
getMutableBasketCollection(
payload,
kind
);

const safeItemId =
String(
itemId ||
""
);

if (
safeItemId
) {

const matchedIndex =
collection.findIndex(
item =>
String(
item?.id ??
item?._id ??
""
) ===
safeItemId
);

if (
matchedIndex >=
0
) {

return matchedIndex;

}

}

if (
Number.isInteger(
fallbackIndex
) &&
fallbackIndex >=
0 &&
fallbackIndex <
collection.length
) {

return fallbackIndex;

}

return -1;

}

function degreesToRadians(

return (
Number(
degrees

function calculateStraightLineMiles(
first,
second
) {

const earthRadiusMiles =
3958.7613;

const latitudeDifference =
degreesToRadians(
second.latitude -
first.latitude
);

const longitudeDifference =
degreesToRadians(
second.longitude -
first.longitude
);

const firstLatitude =
degreesToRadians(
first.latitude
);

const secondLatitude =
degreesToRadians(
second.latitude
);

const a =
Math.sin(
latitudeDifference /
2
) **
2 +
Math.cos(
firstLatitude
) *
Math.cos(
secondLatitude
) *
Math.sin(
longitudeDifference /
2
) **
2;

const c =
2 *
Math.atan2(
Math.sqrt(
a
),
Math.sqrt(
1 -
a
)
);

return (
earthRadiusMiles *
c
);

}

========================================= */

function getBasketProductSubtotal(
items
) {

return items.reduce(
(total,item) =>
total +
getItemLineTotal(
item
),
0
);

}

function getBasketUnitCount(
items
) {

return items.reduce(
(total,item) =>
total +
getItemQuantity(
item
),
0
);

}

function getHomepageResolvedDeliveryAmount() {

if (
!currentHomepageDelivery.valid ||
currentHomepageDelivery.quote ||
!Number.isFinite(
Number(
currentHomepageDelivery.amount
)
)
) {

return 0;

}

return Math.max(
0,
Number(
currentHomepageDelivery.amount
)
);

}

function getHomepageBasketFinalTotal(
items
) {

return (
getBasketProductSubtotal(
items
) +
getHomepageResolvedDeliveryAmount()
);

}

/* =========================================
HEADER BASKET TOTAL

IMPORTANT:
THE FIRST HOMEPAGE RENDER NOW ALSO RUNS THE
EXISTING .is-updating ANIMATION.

THEREFORE:
- EMPTY BASKET LOADS £0.00 + ANIMATION
- SAVED BASKET LOADS LIVE TOTAL + ANIMATION
- LATER VALUE CHANGES ANIMATE AGAIN
========================================= */

let previousBasketHeaderTotal =
null;

let basketHeaderAnimationTimer =
null;

function updateBasketHeaderTotal(
items
) {

if (
!basketTotalText
) {

return;

}

const total =
Array.isArray(
items
) &&
items.length
?
getHomepageBasketFinalTotal(
items
)
:
0;

const formattedTotal =
formatBasketMoney(
total
);

basketTotalText.textContent =
formattedTotal;

basketTotalText.setAttribute(
"aria-label",
`Basket total ${formattedTotal}`
);

basketTotalText.classList.add(
"is-visible"
);

const shouldAnimate =
previousBasketHeaderTotal ===
null ||
Math.abs(
previousBasketHeaderTotal -
total
) >
0.001;

if (
shouldAnimate
) {

if (
basketHeaderAnimationTimer !==
null
) {

window.clearTimeout(
basketHeaderAnimationTimer
);

basketHeaderAnimationTimer =
null;

}

basketTotalText.classList.remove(
"is-updating"
);

void basketTotalText.offsetWidth;

basketTotalText.classList.add(
"is-updating"
);

basketHeaderAnimationTimer =
window.setTimeout(
() => {

basketTotalText.classList.remove(
"is-updating"
);

basketHeaderAnimationTimer =
null;

},
550
);

}

previousBasketHeaderTotal =
total;

}

/* =========================================
BASKET MUTATIONS
ID-BASED WITH INDEX FALLBACK
========================================= */

function changeBasketItemQuantity(
kind,
itemId,
fallbackIndex,
difference
) {

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

const collection =
getMutableBasketCollection(
payload,
kind
);

const index =
getBasketItemIndexById(
payload,
kind,
itemId,
fallbackIndex
);

if (
index <
0 ||
index >=
collection.length
) {

return;

}

const item =
collection[
index
];

ensureBasketOrderItemId(
item,
kind
);

const currentQuantity =
getItemQuantity(
item
);

const nextQuantity =
Math.max(
1,
Math.min(
999,
currentQuantity +
difference
)
);

if (
nextQuantity ===
currentQuantity
) {

return;

}

setItemQuantity(
item,
nextQuantity
);

if (
kind ===
"custom"
) {

payload.customItems =
collection;

}
else {

payload.items =
collection;

}

writeHomepageOrderPayload(
payload
);

invalidateHomepageDeliveryLookup();

const storedPostcode =
readStoredDeliveryPostcode(
payload
);

setHomepageDeliveryPending(
storedPostcode
);

persistHomepageDeliveryState();

renderHomepageBasket();

if (
storedPostcode &&
isCompleteUKPostcode(
storedPostcode
)
) {

calculateBasketDeliveryForPostcode(
storedPostcode,
{
animateLoading:false
}
);

}

}

function removeBasketItem(
kind,
itemId,
fallbackIndex
) {

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

const collection =
getMutableBasketCollection(
payload,
kind
);

const index =
getBasketItemIndexById(
payload,
kind,
itemId,
fallbackIndex
);

if (
index <
0 ||
index >=
collection.length
) {

return;

}

const removedItem =
collection[
index
];

const removedKey =
getHomepageBasketItemKey(
removedItem,
kind
);

basketDrawerExpandedItems.delete(
removedKey
);

collection.splice(
index,
1
);

if (
kind ===
"custom"
) {

payload.customItems =
collection;

}
else {

payload.items =
collection;

}

writeHomepageOrderPayload(
payload
);

invalidateHomepageDeliveryLookup();

const storedPostcode =
readStoredDeliveryPostcode(
payload
);

setHomepageDeliveryPending(
storedPostcode
);

persistHomepageDeliveryState();

renderHomepageBasket();

const remainingPayload =
normaliseHomepageBasketPayload(
readHomepageOrderPayload()
);

const remainingItems =
getHomepageBasketItems(
remainingPayload
);

if (
remainingItems.length &&
storedPostcode &&
isCompleteUKPostcode(
storedPostcode
)
) {

calculateBasketDeliveryForPostcode(
storedPostcode,
{
animateLoading:false
}
);

}

}

/* =========================================
POSTCODE DELIVERY LOOKUP
========================================= */

function scheduleHomepageDeliveryPostcodeLookup(
postcode
) {

if (
basketDeliveryLookupTimer !==
null
) {

window.clearTimeout(
basketDeliveryLookupTimer
);

basketDeliveryLookupTimer =
null;

}

const cleaned =
normalizePostcode(
postcode
);

if (
!isCompleteUKPostcode(
cleaned
)
) {

return;

}

basketDeliveryLookupTimer =
window.setTimeout(
() => {

basketDeliveryLookupTimer =
null;

calculateBasketDeliveryForPostcode(
cleaned
);

},
550
);

}

/* =========================================
POSTCODE DELIVERY CALCULATION
========================================= */

async function calculateBasketDeliveryForPostcode(
postcode,
{
animateLoading = true
} = {}
) {

const cleaned =
normalizePostcode(
postcode
);

if (
!isCompleteUKPostcode(
cleaned
)
) {

return;

}

invalidateHomepageDeliveryLookup();

const requestId =
++basketDeliveryRequestId;

const formattedPostcode =
formatPostcode(
cleaned
);

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:true,
valid:false,
quote:false,
amount:null,
adjustedMiles:null,
miles:null,
reason:"",
error:""
};

persistHomepageDeliveryState();

if (
animateLoading
) {

updateHomepageBasketDeliverySummaryOnly();

}

try {

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

const items =
getHomepageBasketItems(
payload
);

const [
originCoordinates,
destinationCoordinates
] =
await Promise.all([
getDeliveryOriginCoordinates(),
fetchPostcodeCoordinates(
formattedPostcode
)
]);

if (
requestId !==
basketDeliveryRequestId
) {

return;

}

const straightLineMiles =
calculateStraightLineMiles(
originCoordinates,
destinationCoordinates
);

const adjustedMiles =
straightLineMiles *
ROAD_DISTANCE_ALLOWANCE;

const chargeableMiles =
Math.ceil(
adjustedMiles
);

const delivery =
calculateHomepageDelivery(
items,
chargeableMiles
);

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:false,
valid:true,
quote:
delivery.quote,
amount:
delivery.amount,
adjustedMiles,
miles:
delivery.miles,
reason:
delivery.reason ||
"",
error:""
};

persistHomepageDeliveryState();

renderHomepageBasket();

}
catch (error) {

if (
requestId !==
basketDeliveryRequestId
) {

return;

}

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:false,
valid:false,
quote:false,
amount:null,
adjustedMiles:null,
miles:null,
reason:"",
error:
"Please check the postcode and try again."
};

persistHomepageDeliveryState();

renderHomepageBasket();

const invalidInput =
document.getElementById(
"basketDrawerPostcode"
);

if (
invalidInput
) {

invalidInput.classList.add(
"is-invalid"
);

}

}

}

/* =========================================
BASKET DRAWER DELEGATED EVENTS

Every action resolves the live basket item by
its stable ID first. The original array index is
kept only as a compatibility fallback.
========================================= */

if (
basketDrawerLayer
) {

basketDrawerLayer.addEventListener(
"click",
(event) => {

const itemToggle =
event.target.closest(
"[data-basket-item-toggle]"
);

if (
itemToggle
) {

event.preventDefault();

event.stopPropagation();

toggleHomepageBasketDrawerItem(
itemToggle
);

return;

}

const removeButton =
event.target.closest(
"[data-basket-remove]"
);

if (
removeButton
) {

event.preventDefault();

event.stopPropagation();

removeBasketItem(
String(
removeButton.dataset.basketKind ||
"standard"
),
String(
removeButton.dataset.basketItemId ||
""
),
Number(
removeButton.dataset.basketIndex
)
);

return;

}

const quantityButton =
event.target.closest(
"[data-basket-quantity-action]"
);

if (
quantityButton
) {

event.preventDefault();

event.stopPropagation();

changeBasketItemQuantity(
String(
quantityButton.dataset.basketKind ||
"standard"
),
String(
quantityButton.dataset.basketItemId ||
""
),
Number(
quantityButton.dataset.basketIndex
),
quantityButton.dataset.basketQuantityAction ===
"increase"
?
1
:
-1
);

return;

}

const checkoutButton =
event.target.closest(
"#basketDrawerCheckout"
);

if (
checkoutButton
) {

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

const items =
getHomepageBasketItems(
payload
);

if (
!homepageBasketCheckoutIsAvailable(
items
)
) {

event.preventDefault();

return;

}

event.preventDefault();

window.location.href =
"order-page.html?source=homepage-basket&focus=checkout";

}

}
);

basketDrawerLayer.addEventListener(
"input",
(event) => {

const postcodeInput =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
!postcodeInput
) {

return;

}

postcodeInput.value =
String(
postcodeInput.value ||
""
)
.toUpperCase();

postcodeInput.classList.remove(
"is-invalid"
);

invalidateHomepageDeliveryLookup();

setHomepageDeliveryPending(
postcodeInput.value
);

persistHomepageDeliveryState();

updateHomepageBasketDeliverySummaryOnly();

scheduleHomepageDeliveryPostcodeLookup(
postcodeInput.value
);

}
);

basketDrawerLayer.addEventListener(
"change",
(event) => {

const postcodeInput =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
!postcodeInput
) {

return;

}

const formatted =
formatPostcode(
postcodeInput.value
);

postcodeInput.value =
formatted;

postcodeInput.classList.remove(
"is-invalid"
);

invalidateHomepageDeliveryLookup();

if (
!formatted
) {

setHomepageDeliveryPending(
""
);

persistHomepageDeliveryState();

updateHomepageBasketDeliverySummaryOnly();

return;

}

if (
!isCompleteUKPostcode(
formatted
)
) {

setHomepageDeliveryPending(
formatted
);

persistHomepageDeliveryState();

postcodeInput.classList.add(
"is-invalid"
);

updateHomepageBasketDeliverySummaryOnly();

return;

}

calculateBasketDeliveryForPostcode(
formatted
);

}
);

basketDrawerLayer.addEventListener(
"keydown",
(event) => {

const postcodeInput =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
!postcodeInput ||
event.key !==
"Enter"
) {

return;

}

event.preventDefault();

const formatted =
formatPostcode(
postcodeInput.value
);

postcodeInput.value =
formatted;

postcodeInput.classList.remove(
"is-invalid"
);

invalidateHomepageDeliveryLookup();

if (
!formatted
) {

setHomepageDeliveryPending(
""
);

persistHomepageDeliveryState();

updateHomepageBasketDeliverySummaryOnly();

return;

}

if (
!isCompleteUKPostcode(
formatted
)
) {

setHomepageDeliveryPending(
formatted
);

persistHomepageDeliveryState();

postcodeInput.classList.add(
"is-invalid"
);

updateHomepageBasketDeliverySummaryOnly();

return;

}

calculateBasketDeliveryForPostcode(
formatted
);

}
);

}

/* =========================================
BASKET DRAWER MODAL / PAGE LOCK
========================================= */

function getHomepageBasketBackgroundElements() {

if (
!basketDrawerLayer
) {

return [];

}

const desktopBlocker =
document.getElementById(
"desktopAccessBlocker"
);

return Array.from(
document.body.children
).filter(
(element) =>
element !==
basketDrawerLayer &&
element !==
desktopBlocker &&
element.tagName !==
"SCRIPT"
);

}

function setHomepageBasketBackgroundInert(
shouldBeInert
) {

getHomepageBasketBackgroundElements()
.forEach(
(element) => {

element.inert =
shouldBeInert;

}
);

}

function lockHomepageBasketPageScroll() {

basketDrawerScrollY =
window.scrollY ||
document.documentElement.scrollTop ||
0;

basketDrawerPreviousBodyStyles = {
position:
document.body.style.position,
top:
document.body.style.top,
left:
document.body.style.left,
right:
document.body.style.right,
width:
document.body.style.width,
overflow:
document.body.style.overflow
};

document.body.classList.add(
"basket-drawer-open"
);

document.body.style.position =
"fixed";

document.body.style.top =
`-${basketDrawerScrollY}px`;

document.body.style.left =
"0";

document.body.style.right =
"0";

document.body.style.width =
"100%";

document.body.style.overflow =
"hidden";

}

function unlockHomepageBasketPageScroll() {

document.body.classList.remove(
"basket-drawer-open"
);

if (
basketDrawerPreviousBodyStyles
) {

document.body.style.position =
basketDrawerPreviousBodyStyles.position;

document.body.style.top =
basketDrawerPreviousBodyStyles.top;

document.body.style.left =
basketDrawerPreviousBodyStyles.left;

document.body.style.right =
basketDrawerPreviousBodyStyles.right;

document.body.style.width =
basketDrawerPreviousBodyStyles.width;

document.body.style.overflow =
basketDrawerPreviousBodyStyles.overflow;

}
else {

document.body.style.position =
"";

document.body.style.top =
"";

document.body.style.left =
"";

document.body.style.right =
"";

document.body.style.width =
"";

document.body.style.overflow =
"";

}

window.scrollTo(
0,
basketDrawerScrollY
);

basketDrawerPreviousBodyStyles =
null;

}

function getHomepageBasketFocusableElements() {

if (
!basketDrawerPanel
) {

return [];

}

return Array.from(
basketDrawerPanel.querySelectorAll(
[
"button:not([disabled])",
"input:not([disabled])",
"select:not([disabled])",
"textarea:not([disabled])",
"a[href]",
"[tabindex]:not([tabindex='-1'])"
].join(
","
)
)
).filter(
(element) => {

return (
!element.hasAttribute(
"hidden"
) &&
element.offsetParent !==
null
);

}
);

}

/* =========================================
OPEN / CLOSE BASKET DRAWER
========================================= */

function openBasketDrawer(
event
) {

if (
event
) {

event.preventDefault();

event.stopPropagation();

}

if (
!basketDrawerLayer ||
!basketDrawerPanel ||
!basketButton
) {

return;

}

if (
basketDrawerIsOpen
) {

return;

}

closeMenu({
restoreFocus:false
});

closeWhatsappAction();

closeEmailAction();

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

writeHomepageOrderPayload(
payload
);

loadHomepageDeliveryStateFromPayload(
payload
);

lastBasketFocusedElement =
document.activeElement;

renderHomepageBasket();

basketDrawerIsOpen =
true;

lockHomepageBasketPageScroll();

setHomepageBasketBackgroundInert(
true
);

basketDrawerLayer.classList.add(
"is-open"
);

basketDrawerLayer.setAttribute(
"aria-hidden",
"false"
);

basketButton.setAttribute(
"aria-expanded",
"true"
);

window.requestAnimationFrame(
() => {

if (
basketDrawerClose
) {

try {

basketDrawerClose.focus({
preventScroll:true
});

}
catch (error) {

basketDrawerClose.focus();

}

}
else {

basketDrawerPanel.focus({
preventScroll:true
});

}

}
);

const storedPostcode =
readStoredDeliveryPostcode(
payload
);

if (
storedPostcode &&
isCompleteUKPostcode(
storedPostcode
) &&
!(
currentHomepageDelivery.valid &&
!currentHomepageDelivery.loading
)
) {

calculateBasketDeliveryForPostcode(
storedPostcode,
{
animateLoading:false
}
);

}

}

function closeBasketDrawer(
{
restoreFocus = true
} = {}
) {

if (
!basketDrawerLayer ||
!basketButton ||
!basketDrawerIsOpen
) {

return;

}

basketDrawerIsOpen =
false;

basketDrawerLayer.classList.remove(
"is-open"
);

basketDrawerLayer.setAttribute(
"aria-hidden",
"true"
);

basketButton.setAttribute(
"aria-expanded",
"false"
);

setHomepageBasketBackgroundInert(
false
);

unlockHomepageBasketPageScroll();

applyDesktopAccessRestriction();

if (
restoreFocus &&
lastBasketFocusedElement &&
typeof lastBasketFocusedElement.focus ===
"function"
) {

window.requestAnimationFrame(
() => {

if (
!document.contains(
lastBasketFocusedElement
)
) {

return;

}

try {

lastBasketFocusedElement.focus({
preventScroll:true
});

}
catch (error) {

lastBasketFocusedElement.focus();

}

}
);

}

lastBasketFocusedElement =
null;

}

if (
basketButton
) {

basketButton.addEventListener(
"click",
openBasketDrawer
);

}

if (
basketDrawerClose
) {

basketDrawerClose.addEventListener(
"click",
(event) => {

event.preventDefault();

event.stopPropagation();

closeBasketDrawer();

}
);

}

if (
basketDrawerBackdrop
) {

basketDrawerBackdrop.addEventListener(
"click",
(event) => {

event.preventDefault();

closeBasketDrawer();

}
);

}

/* =========================================
BASKET KEYBOARD FOCUS TRAP
========================================= */

document.addEventListener(
"keydown",
(event) => {

if (
!basketDrawerIsOpen
) {

return;

}

if (
event.key ===
"Escape"
) {

event.preventDefault();

closeBasketDrawer();

return;

}

if (
event.key !==
"Tab"
) {

return;

}

const focusableElements =
getHomepageBasketFocusableElements();

if (
!focusableElements.length
) {

event.preventDefault();

basketDrawerPanel?.focus({
preventScroll:true
});

return;

}

const first =
focusableElements[0];

const last =
focusableElements[
focusableElements.length -
1
];

if (
event.shiftKey &&
document.activeElement ===
first
) {

event.preventDefault();

last.focus();

return;

}

if (
!event.shiftKey &&
document.activeElement ===
last
) {

event.preventDefault();

first.focus();

}

}
);

/* =========================================
REFRESH BASKET ACROSS NAVIGATION

THE HOMEPAGE ALWAYS READS THE SAME SHARED
LOCALSTORAGE KEY AS THE ORDER PAGE.

CURRENT CANONICAL ARRAYS:
- items
- customItems

LEGACY ALIASES ARE MIGRATED ONLY WHEN THE
CANONICAL ARRAY IS ABSENT.

NORMALISATION IS NON-DESTRUCTIVE, SO MERELY
VISITING INDEX.HTML CANNOT EMPTY AN
ORDER-PAGE BASKET.
========================================= */

function refreshHomepageBasket() {

let payload =
readHomepageOrderPayload();

payload =
normaliseHomepageBasketPayload(
payload
);

writeHomepageOrderPayload(
payload
);

loadHomepageDeliveryStateFromPayload(
payload
);

const items =
getHomepageBasketItems(
payload
);

updateBasketHeaderTotal(
items
);

if (
basketDrawerLayer &&
basketDrawerLayer.classList.contains(
"is-open"
)
) {

renderHomepageBasket();

}

}

window.addEventListener(
"storage",
(event) => {

if (
event.key ===
HOMEPAGE_ORDER_STORAGE_KEY ||
event.key ===
HOMEPAGE_DELIVERY_POSTCODE_KEY
) {

refreshHomepageBasket();

}

}
);

window.addEventListener(
"pageshow",
() => {

refreshHomepageBasket();

restoreHomepageCalculatorState();

updateExistingOpeningRecommendation();

revealHomepageCustomBuildArea();

if (
typeof getCustomCalculatorPrice ===
"function"
) {

calculatePrice();

}
else {

setCustomSelfCleaningSurchargeDisplay(
null,
false
);

hideCustomCalculatorPrice();

}

}
);

document.addEventListener(
"visibilitychange",
() => {

if (
document.visibilityState ===
"visible"
) {

refreshHomepageBasket();

}

}
);

/* =========================================
INITIAL BASKET RENDER IS DEFERRED

refreshHomepageBasket() IS CALLED FROM THE
FINAL INITIALISATION SECTION AFTER IN-3.
========================================= */

/* =========================================
HEADER HOME LINK
========================================= */

const headerHomeLink =
document.getElementById(
"headerHomeLink"
);

if (
headerHomeLink
) {

headerHomeLink.addEventListener(
"click",
() => {

closeWhatsappAction();

closeEmailAction();

if (
menuDrawerIsOpen
) {

closeMenu({
restoreFocus:false
});

}

if (
basketDrawerIsOpen
) {

closeBasketDrawer({
restoreFocus:false
});

}

}
);

}

/* =========================================
IN-3 IS PASTED IMMEDIATELY ABOVE THE
FINAL INITIALISATION SECTION BELOW.

IN-3 MUST INSTALL:

- getHomepageProductCardPrice()
- getCustomCalculatorPrice()
- getCustomSelfCleaningPrice()
- getItemTopGlassLabel()

BEFORE THE INITIALISATION BELOW EXECUTES.
========================================= */

/* =========================================
FINAL INITIALISATION

THIS IS NOW THE ONLY INITIAL START-UP POINT
FOR PRODUCT-CARD PRICING, CALCULATOR STATE /
PRICING AND THE HOMEPAGE BASKET.

IN-3 SITS DIRECTLY ABOVE THIS SECTION.
========================================= */

requestAnimationFrame(
() => {

if (
typeof getHomepageProductCardPrice ===
"function"
) {

initializeHomepageProductPrices();

}

restoreHomepageCalculatorState();

updateExistingOpeningRecommendation();

revealHomepageCustomBuildArea();

if (
typeof getCustomCalculatorPrice ===
"function"
) {

calculatePrice();

}
else {

setCustomSelfCleaningSurchargeDisplay(
null,
false
);

hideCustomCalculatorPrice();

}

refreshHomepageBasket();

}
);

</script>
