<script>

/* =========================================
IN-2
HOMEPAGE INTERACTIONS / BASKET / CALCULATOR

PRICING + PHYSICAL GLASS MAKE-UP ARE
CENTRALISED IN IN-3.

IN-3 PROVIDES:
- getHomepageProductCardPrice()
- getCustomCalculatorPrice()
- getItemTopGlassLabel()

IMPORTANT:
MASTER-DEPENDENT INITIALISATION IS DEFERRED
UNTIL THE FINAL INITIALISATION SECTION AFTER
IN-3 HAS BEEN LOADED.
========================================= */

const prefersReducedMotion =
window.matchMedia(
"(prefers-reduced-motion: reduce)"
).matches;


/* =========================================
CHANGE 7
DISABLE DOUBLE-TAP TO ZOOM

Keeps normal scrolling and pinch behaviour,
while disabling browser double-tap zoom across
the homepage and basket interface.
========================================= */

const homepageTouchActionStyle =
document.createElement(
"style"
);

homepageTouchActionStyle.textContent = `
html,
body,
header,
main,
section,
footer,
.menu-overlay,
.basket-drawer-layer,
.basket-drawer-panel,
.basket-drawer-body,
.basket-drawer-footer,
button,
a,
input,
select,
label {
touch-action:manipulation;
}
`;

document.head.appendChild(
homepageTouchActionStyle
);


/* =========================================
MENU
========================================= */

function openMenu() {

const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (!menuOverlay) {
return;
}

menuOverlay.classList.add(
"active"
);

}

function closeMenu() {

const menuOverlay =
document.getElementById(
"menuOverlay"
);

if (!menuOverlay) {
return;
}

menuOverlay.classList.remove(
"active"
);

}

document.addEventListener(
"keydown",
(event) => {

if (
event.key ===
"Escape"
) {

closeMenu();

}

}
);


/* =========================================
MENU CUSTOM BUILDER LINK
========================================= */

const menuBuildRooflightLink =
document.getElementById(
"menuBuildRooflightLink"
);

if (
menuBuildRooflightLink
) {

menuBuildRooflightLink.addEventListener(
"click",
() => {

closeMenu();

}
);

}


/* =========================================
WHATSAPP HEADER ACTION
========================================= */

const whatsappButton =
document.getElementById(
"whatsappButton"
);

const whatsappAction =
document.getElementById(
"whatsappAction"
);

function closeWhatsappAction() {

if (
!whatsappButton ||
!whatsappAction
) {

return;

}

whatsappAction.classList.remove(
"is-open"
);

whatsappButton.classList.remove(
"is-selected"
);

whatsappButton.setAttribute(
"aria-expanded",
"false"
);

}

if (
whatsappButton &&
whatsappAction
) {

whatsappButton.addEventListener(
"click",
(event) => {

event.stopPropagation();

const willOpen =
!whatsappAction.classList.contains(
"is-open"
);

whatsappAction.classList.toggle(
"is-open",
willOpen
);

whatsappButton.classList.toggle(
"is-selected",
willOpen
);

whatsappButton.setAttribute(
"aria-expanded",
willOpen
? "true"
: "false"
);

}
);

document.addEventListener(
"click",
(event) => {

if (
event.target.closest(
"#whatsappButton"
) ||
event.target.closest(
"#whatsappAction"
)
) {

return;

}

closeWhatsappAction();

}
);

}


/* =========================================
GET IN TOUCH BUTTON
========================================= */

const homepageGetInTouch =
document.getElementById(
"homepageGetInTouch"
);

if (
homepageGetInTouch
) {

homepageGetInTouch.addEventListener(
"click",
() => {

const contact =
document.getElementById(
"contact"
);

if (
contact
) {

contact.scrollIntoView({
behavior:
prefersReducedMotion
? "auto"
: "smooth",
block:"start"
});

}

}
);

}


/* =========================================
DESKTOP ACCESS RESTRICTION
========================================= */

function applyDesktopAccessRestriction() {

const blocker =
document.getElementById(
"desktopAccessBlocker"
);

if (
!blocker
) {

return;

}

const desktopPointer =
window.matchMedia(
"(hover: hover) and (pointer: fine)"
);

if (
desktopPointer.matches
) {

blocker.setAttribute(
"aria-hidden",
"false"
);

try {

blocker.focus({
preventScroll:true
});

}
catch (error) {

blocker.focus();

}

}
else {

blocker.setAttribute(
"aria-hidden",
"true"
);

}

}

applyDesktopAccessRestriction();


/* =========================================
SCROLL REVEALS
========================================= */

const revealTargets =
Array.from(
document.querySelectorAll(
".reveal"
)
);

function showRevealTarget(
target
) {

if (
!target
) {

return;

}

target.classList.add(
"is-visible"
);

}

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

revealTargets.forEach(
showRevealTarget
);

}
else {

const revealObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

showRevealTarget(
entry.target
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.12,
rootMargin:
"0px 0px -5% 0px"
}
);

revealTargets.forEach(
(target) => {

revealObserver.observe(
target
);

}
);

}


/* =========================================
ORDER TRANSITION REVEALS
========================================= */

const transitionHeadingGroups =
Array.from(
document.querySelectorAll(
".order-transition-heading-group"
)
);

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

transitionHeadingGroups.forEach(
(target) => {

target.classList.add(
"is-visible"
);

}
);

}
else {

const transitionObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"is-visible"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.2
}
);

transitionHeadingGroups.forEach(
(target) => {

transitionObserver.observe(
target
);

}
);

}


/* =========================================
DIRECT IMAGE REVEAL
========================================= */

const directImageRevealTargets =
Array.from(
document.querySelectorAll(
".direct-image-reveal"
)
);

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

directImageRevealTargets.forEach(
(target) => {

target.classList.add(
"is-visible"
);

}
);

}
else {

const directImageRevealObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"is-visible"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.13
}
);

directImageRevealTargets.forEach(
(target) => {

directImageRevealObserver.observe(
target
);

}
);

}


/* =========================================
TRUST / ENGINEERED SHIMMER
========================================= */

function initializeShimmerCards(
selector
) {

const cards =
Array.from(
document.querySelectorAll(
selector
)
);

if (
!cards.length ||
prefersReducedMotion
) {

return;

}

if (
!("IntersectionObserver" in window)
) {

return;

}

const shimmerObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

const card =
entry.target;

setTimeout(
() => {

card.classList.add(
"shimmer-play"
);

},
120
);

observer.unobserve(
card
);

}
);

},
{
threshold:.35
}
);

cards.forEach(
(card) => {

shimmerObserver.observe(
card
);

}
);

}

initializeShimmerCards(
".trust-item"
);

initializeShimmerCards(
".engineered-card"
);


/* =========================================
MOBILE FEATURE SHIMMER
========================================= */

const mobileFeatureIcons =
document.getElementById(
"mobileFeatureIcons"
);

if (
mobileFeatureIcons &&
!prefersReducedMotion &&
"IntersectionObserver" in window
) {

const mobileFeatureObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"icon-shimmer-active"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.3
}
);

mobileFeatureObserver.observe(
mobileFeatureIcons
);

}


/* =========================================
PRODUCT CARD UTILITIES

PRODUCT PRICES ARE SUPPLIED BY IN-3.

THIS SECTION ONLY DEFINES THE HOMEPAGE CARD
BEHAVIOUR.

INITIALISATION IS DELIBERATELY DEFERRED UNTIL
AFTER IN-3 HAS INSTALLED ITS MASTER PRICING
FUNCTIONS.
========================================= */

function normalizeHomepageFinish(
finish
) {

const value =
String(
finish ||
"clear"
)
.trim()
.toLowerCase();

if (
value.includes(
"blue"
)
) {

return "blue";

}

if (
value.includes(
"grey"
) ||
value.includes(
"gray"
)
) {

return "grey";

}

if (
value.includes(
"satin"
)
) {

return "satin";

}

return "clear";

}

function getHomepageProductCardGlazing(
card
) {

if (
!card
) {

return "triple";

}

const activeGlazingButton =
card.querySelector(
".home-glazing-toggle button.active"
);

if (
activeGlazingButton &&
activeGlazingButton.dataset.glazing
) {

return activeGlazingButton.dataset.glazing;

}

if (
card.dataset.defaultGlazing
) {

return card.dataset.defaultGlazing;

}

return "triple";

}

function formatHomepageProductPrice(
card,
price
) {

if (
!card
) {

return;

}

const main =
card.querySelector(
".home-price-main"
);

const decimals =
card.querySelector(
".home-price-decimals"
);

if (
!main ||
!decimals
) {

return;

}

const numericPrice =
Number(
price
);

if (
!Number.isFinite(
numericPrice
)
) {

return;

}

const fixed =
numericPrice.toFixed(
2
);

const parts =
fixed.split(
"."
);

main.textContent =
`£${parts[0]}`;

decimals.textContent =
`.${parts[1]}`;

}

function buildHomepageProductOrderUrl(
card,
glazing
) {

if (
!card
) {

return "order-page.html";

}

const size =
String(
card.dataset.productSize ||
""
);

const finish =
normalizeHomepageFinish(
card.dataset.finish
);

const params =
new URLSearchParams();

params.set(
"source",
"homepage-product-card"
);

if (
size
) {

params.set(
"size",
size
);

}

params.set(
"glazing",
glazing
);

params.set(
"finish",
finish
);

return (
"order-page.html?" +
params.toString()
);

}

function updateHomepageProductCard(
card
) {

if (
!card
) {

return;

}

const glazing =
getHomepageProductCardGlazing(
card
);

const price =
getHomepageProductCardPrice(
card,
glazing
);

formatHomepageProductPrice(
card,
price
);

const glazedLabel =
card.querySelector(
".home-glazed-label"
);

if (
glazedLabel
) {

glazedLabel.classList.toggle(
"triple",
glazing ===
"triple"
);

}

const productLink =
card.querySelector(
".home-product-link"
);

if (
productLink
) {

productLink.href =
buildHomepageProductOrderUrl(
card,
glazing
);

}

}

function initializeHomepageProductPrices() {

const productCards =
Array.from(
document.querySelectorAll(
".home-product-card[data-product-size]"
)
);

productCards.forEach(
(card) => {

const glazingButtons =
Array.from(
card.querySelectorAll(
".home-glazing-toggle button[data-glazing]"
)
);

const defaultGlazing =
card.dataset.defaultGlazing ||
"triple";

let activeGlazingButton =
glazingButtons.find(
(button) =>
button.dataset.glazing ===
defaultGlazing
);

if (
!activeGlazingButton
) {

activeGlazingButton =
glazingButtons.find(
(button) =>
button.classList.contains(
"active"
)
) ||
glazingButtons.find(
(button) =>
button.dataset.glazing ===
"triple"
) ||
glazingButtons[0];

}

glazingButtons.forEach(
(button) => {

button.classList.toggle(
"active",
button ===
activeGlazingButton
);

button.addEventListener(
"click",
(event) => {

event.preventDefault();
event.stopPropagation();

glazingButtons.forEach(
(otherButton) => {

otherButton.classList.toggle(
"active",
otherButton ===
button
);

}
);

updateHomepageProductCard(
card
);

}
);

}
);

updateHomepageProductCard(
card
);

}
);

}


/* =========================================
IMPORTANT:
DO NOT INITIALISE PRODUCT PRICES HERE.

IN-3 MUST LOAD AND INSTALL THE MASTER PRICING
FUNCTIONS FIRST.

initializeHomepageProductPrices() IS CALLED
FROM FINAL INITIALISATION AFTER IN-3.
========================================= */


/* =========================================
INDEX CHANGE 1
PRODUCT CARD IMAGE / SIZE TWO-STAGE CLICK

First click:
- highlights/selects the card only

Once highlighted:
- clicking the product image or size text
opens the exact same configured URL as
the existing View Size link

The View Size link itself remains a normal
single-click link.
========================================= */

const homepageProductCardSelectionStyle =
document.createElement(
"style"
);

homepageProductCardSelectionStyle.textContent = `

.home-product-card.is-homepage-selected::before {
opacity:1;
transform:scaleY(1);
}

.home-product-card.is-homepage-selected {
transform:translateY(-3px);
border-color:rgba(232,120,23,.36);
background:#191b1b;
box-shadow:
0 20px 38px rgba(0,0,0,.28);
z-index:4;
}

.home-product-card.is-homepage-selected
.home-product-size {
color:var(--orange-bright);
}

.home-product-card.is-homepage-selected
.home-product-image img {
transform:var(--home-image-hover-transform);
filter:contrast(1.015);
}

.tinted-options-section
.home-product-card.is-homepage-selected {
border-color:rgba(111,157,200,.54);
background:
linear-gradient(
180deg,
#172230 0%,
#131c26 100%
);
box-shadow:
0 20px 38px rgba(0,0,0,.30),
0 0 0 1px rgba(41,77,115,.07);
}

.tinted-options-section
.home-product-card.is-homepage-selected
.home-product-size {
color:var(--tint-blue-light);
}

@media(max-width:560px) {

.home-product-card.is-homepage-selected {
transform:translateY(-2px);
}

}

`;

document.head.appendChild(
homepageProductCardSelectionStyle
);

const homepageSelectableProductCards =
Array.from(
document.querySelectorAll(
".home-product-card[data-product-size]"
)
);

function clearHomepageProductCardSelection(
exceptCard = null
) {

homepageSelectableProductCards.forEach(
(card) => {

if (
card ===
exceptCard
) {

return;

}

card.classList.remove(
"is-homepage-selected"
);

card.setAttribute(
"aria-selected",
"false"
);

}
);

}

function selectHomepageProductCard(
card
) {

if (
!card
) {

return;

}

clearHomepageProductCardSelection(
card
);

card.classList.add(
"is-homepage-selected"
);

card.setAttribute(
"aria-selected",
"true"
);

}

function navigateFromHomepageProductCard(
card
) {

if (
!card
) {

return;

}

const productLink =
card.querySelector(
".home-product-link"
);

if (
!productLink
) {

return;

}

const destination =
productLink.href;

if (
!destination
) {

return;

}

window.location.href =
destination;

}

function handleHomepageProductImageOrSizeClick(
event,
card
) {

if (
!card
) {

return;

}

event.preventDefault();

event.stopPropagation();

const alreadySelected =
card.classList.contains(
"is-homepage-selected"
);

if (
!alreadySelected
) {

selectHomepageProductCard(
card
);

try {

card.focus({
preventScroll:true
});

}
catch (error) {

card.focus();

}

return;

}

navigateFromHomepageProductCard(
card
);

}

homepageSelectableProductCards.forEach(
(card) => {

card.setAttribute(
"aria-selected",
"false"
);

const productImage =
card.querySelector(
".home-product-image"
);

const productSize =
card.querySelector(
".home-product-size"
);

if (
productImage
) {

productImage.addEventListener(
"click",
(event) => {

handleHomepageProductImageOrSizeClick(
event,
card
);

}
);

}

if (
productSize
) {

productSize.addEventListener(
"click",
(event) => {

handleHomepageProductImageOrSizeClick(
event,
card
);

}
);

}

/*
Clicking a non-interactive part of the card
continues to act as the first-stage highlight.

Buttons and the View Size link retain their
existing independent behaviour.
*/

card.addEventListener(
"click",
(event) => {

if (
event.target.closest(
"a, button, input, select, textarea, label"
)
) {

return;

}

if (
event.target.closest(
".home-product-image"
) ||
event.target.closest(
".home-product-size"
)
) {

return;

}

selectHomepageProductCard(
card
);

}
);

}
);


/* =========================================
AUTOMATIC VIEW SIZE ENCOURAGEMENT
========================================= */

const homepageProductLinks =
Array.from(
document.querySelectorAll(
".home-product-link"
)
);

homepageProductLinks.forEach(
(link) => {

link.classList.add(
"view-size-auto-animate"
);

}
);


/* =========================================
FITTING SLIDESHOW
========================================= */

const fittingSlideshow =
document.getElementById(
"fittingSlideshow"
);

const fittingSlideshowViewport =
document.getElementById(
"fittingSlideshowViewport"
);

if (
fittingSlideshow &&
fittingSlideshowViewport
) {

const fittingSlides =
Array.from(
fittingSlideshow.querySelectorAll(
".fitting-slide"
)
);

let fittingSlideIndex =
Math.max(
0,
fittingSlides.findIndex(
(slide) =>
slide.classList.contains(
"active"
)
)
);

let fittingTimer =
null;

let fittingTouchStartX =
null;

function showFittingSlide(
nextIndex
) {

if (
fittingSlides.length <
2
) {

return;

}

const normalizedIndex =
(
nextIndex +
fittingSlides.length
) %
fittingSlides.length;

if (
normalizedIndex ===
fittingSlideIndex
) {

return;

}

const currentSlide =
fittingSlides[
fittingSlideIndex
];

const nextSlide =
fittingSlides[
normalizedIndex
];

fittingSlides.forEach(
(slide) => {

slide.classList.remove(
"previous"
);

}
);

if (
currentSlide
) {

currentSlide.classList.remove(
"active"
);

currentSlide.classList.add(
"previous"
);

currentSlide.setAttribute(
"aria-hidden",
"true"
);

}

nextSlide.classList.add(
"active"
);

nextSlide.setAttribute(
"aria-hidden",
"false"
);

fittingSlideIndex =
normalizedIndex;

window.setTimeout(
() => {

if (
currentSlide
) {

currentSlide.classList.remove(
"previous"
);

}

},
700
);

}

function startFittingTimer() {

if (
prefersReducedMotion ||
fittingSlides.length <
2
) {

return;

}

window.clearInterval(
fittingTimer
);

fittingTimer =
window.setInterval(
() => {

showFittingSlide(
fittingSlideIndex +
1
);

},
6000
);

}

fittingSlideshowViewport.addEventListener(
"touchstart",
(event) => {

if (
!event.touches.length
) {

return;

}

fittingTouchStartX =
event.touches[0].clientX;

},
{
passive:true
}
);

fittingSlideshowViewport.addEventListener(
"touchend",
(event) => {

if (
fittingTouchStartX ===
null ||
!event.changedTouches.length
) {

return;

}

const difference =
event.changedTouches[0].clientX -
fittingTouchStartX;

fittingTouchStartX =
null;

if (
Math.abs(
difference
) <
42
) {

return;

}

showFittingSlide(
difference <
0
? fittingSlideIndex + 1
: fittingSlideIndex - 1
);

startFittingTimer();

},
{
passive:true
}
);

startFittingTimer();

}


/* =========================================
OVERSIZED ROOFLIGHT REVEAL
========================================= */

const oversizedRooflightVisual =
document.getElementById(
"oversizedRooflightVisual"
);

if (
oversizedRooflightVisual
) {

if (
prefersReducedMotion ||
!("IntersectionObserver" in window)
) {

oversizedRooflightVisual.classList.add(
"is-revealed"
);

}
else {

const oversizedRevealObserver =
new IntersectionObserver(
(entries,observer) => {

entries.forEach(
(entry) => {

if (
!entry.isIntersecting
) {

return;

}

entry.target.classList.add(
"is-revealed"
);

observer.unobserve(
entry.target
);

}
);

},
{
threshold:.14
}
);

oversizedRevealObserver.observe(
oversizedRooflightVisual
);

}

}


/* =========================================
EXISTING OPENING ASSISTANT
========================================= */

const openingInternalWidth =
document.getElementById(
"openingInternalWidth"
);

const openingInternalLength =
document.getElementById(
"openingInternalLength"
);

const openingInternalRecommendation =
document.getElementById(
"openingInternalRecommendation"
);

const recommendedInternalSize =
document.getElementById(
"recommendedInternalSize"
);

const existingOpeningRooflightVisual =
document.querySelector(
".existing-opening-rooflight-visual"
);

const homepageCalculator =
document.getElementById(
"homepageCalculator"
);

function hideOpeningRecommendation() {

if (
openingInternalRecommendation
) {

openingInternalRecommendation.classList.remove(
"is-visible"
);

openingInternalRecommendation.setAttribute(
"aria-hidden",
"true"
);

openingInternalRecommendation.hidden =
true;

}

/*
CHANGE 3:
Do not hide the custom rooflight visual
when the opening assistant has no result.

The visual is now independently revealed
with the calculator section.
*/

}

function updateExistingOpeningRecommendation() {

if (
!openingInternalWidth ||
!openingInternalLength ||
!openingInternalRecommendation ||
!recommendedInternalSize
) {

return;

}

const openingWidth =
Number(
openingInternalWidth.value
);

const openingLength =
Number(
openingInternalLength.value
);

if (
!Number.isFinite(
openingWidth
) ||
!Number.isFinite(
openingLength
)
) {

hideOpeningRecommendation();
return;

}

const rooflightWidth =
Math.round(
openingWidth -
10
);

const rooflightLength =
Math.round(
openingLength -
10
);

const valid =
rooflightWidth >=
300 &&

function validateCustomCalculatorDimensions(
width,
length
) {

const numericWidth =
Number(
width
);

const numericLength =
Number(
length
);

if (
!Number.isFinite(
numericWidth
) ||
!Number.isFinite(
numericLength
)
) {

return false;

}

if (
numericWidth <
CUSTOM_CALCULATOR_MIN_WIDTH ||
numericWidth >
CUSTOM_CALCULATOR_MAX_WIDTH
) {

return false;

}

if (
numericLength <
CUSTOM_CALCULATOR_MIN_LENGTH ||
numericLength >
CUSTOM_CALCULATOR_MAX_LENGTH
) {

return false;

}

/*
Exactly 2000mm length remains valid
below 500mm width.

Only lengths ABOVE 2000mm require
at least 500mm width.
*/

if (
numericLength >
CUSTOM_CALCULATOR_LONG_THRESHOLD &&
numericWidth <
CUSTOM_CALCULATOR_LONG_MIN_WIDTH
) {

return false;

}

return true;

}


/* =========================================
UK WORKING DAY / BANK HOLIDAY HELPERS
========================================= */

const UK_TIME_ZONE =
"Europe/London";

const UK_PRODUCTION_CUTOFF_HOUR =
12;

function makeCalendarDate(
year,
month,
day
) {

return new Date(
Date.UTC(
year,
month -
1,
day,
12,
0,
0
)
);

}

function getCalendarKey(
date
) {

return [
date.getUTCFullYear(),
String(
date.getUTCMonth() +
1
).padStart(
2,
"0"
),
String(
date.getUTCDate()
).padStart(
2,
"0"
)
].join(
"-"
);

}

function addCalendarDays(
date,
days
) {

const copy =
new Date(
date.getTime()
);

copy.setUTCDate(
copy.getUTCDate() +
Number(
days
)
);

return copy;

}

function getNthWeekdayOfMonth(
year,
month,
weekday,
occurrence
) {

const first =
makeCalendarDate(
year,
month,
1
);

const firstWeekday =
first.getUTCDay();

const offset =
(
weekday -
firstWeekday +
7
) %
7;

return makeCalendarDate(
year,
month,
1 +
offset +
(
occurrence -
1
) *
7
);

}

function getLastWeekdayOfMonth(
year,
month,
weekday
) {

const last =
makeCalendarDate(
year,
month +
1,
0
);

const difference =
(
last.getUTCDay() -
weekday +
7
) %
7;

return addCalendarDays(
last,
-difference
);

}

function getEasterSunday(
year
) {

const a =
year %
19;

const b =
Math.floor(
year /
100
);

const c =
year %
100;

const d =
Math.floor(
b /
4
);

const e =
b %
4;

const f =
Math.floor(
(
b +
8
) /
25
);

const g =
Math.floor(
(
b -
f +
1
) /
3
);

const h =
(
19 *
a +
b -
d -
g +
15
) %
30;

const i =
Math.floor(
c /
4
);

const k =
c %
4;

const l =
(
32 +
2 *
e +
2 *
i -
h -
k
) %
7;

const m =
Math.floor(
(
a +
11 *
h +
22 *
l
) /
451
);

const month =
Math.floor(
(
h +
l -
7 *
m +
114
) /
31
);

const day =
(
(
h +
l -
7 *
m +
114
) %
31
) +
1;

return makeCalendarDate(
year,
month,
day
);

}

function addObservedWeekendHoliday(
holidaySet,
date
) {

const weekday =
date.getUTCDay();

if (
weekday >=
1 &&
weekday <=
5
) {

holidaySet.add(
getCalendarKey(
date
)
);

return;

}

let substitute =
addCalendarDays(
date,
1
);

while (
substitute.getUTCDay() ===
0 ||
substitute.getUTCDay() ===
6 ||
holidaySet.has(
getCalendarKey(
substitute
)
)
) {

substitute =
addCalendarDays(
substitute,
1
);

}

holidaySet.add(
getCalendarKey(
substitute
)
);

}

function getEnglandWalesBankHolidayKeys(
year
) {

const holidays =
new Set();

const newYear =
makeCalendarDate(
year,
1,
1
);

addObservedWeekendHoliday(
holidays,
newYear
);

const easterSunday =
getEasterSunday(
year
);

holidays.add(
getCalendarKey(
addCalendarDays(
easterSunday,
-2
)
)
);

holidays.add(
getCalendarKey(
addCalendarDays(
easterSunday,
1
)
)
);

holidays.add(
getCalendarKey(
getNthWeekdayOfMonth(
year,
5,
1,
1
)
)
);

holidays.add(
getCalendarKey(
getLastWeekdayOfMonth(
year,
5,
1
)
)
);

holidays.add(
getCalendarKey(
getLastWeekdayOfMonth(
year,
8,
1
)
)
);

const christmas =
makeCalendarDate(
year,
12,
25
);

const boxingDay =
makeCalendarDate(
year,
12,
26
);

[
christmas,
boxingDay
].forEach(
(date) => {

const weekday =
date.getUTCDay();

if (
weekday >=
1 &&
weekday <=
5
) {

holidays.add(
getCalendarKey(
date
)
);

}

}
);

[
christmas,
boxingDay
].forEach(
(date) => {

const weekday =
date.getUTCDay();

if (
weekday !==
0 &&
weekday !==
6
) {

return;

}

let substitute =
addCalendarDays(
date,
1
);

while (
substitute.getUTCDay() ===
0 ||
substitute.getUTCDay() ===
6 ||
holidays.has(
getCalendarKey(
substitute
)
)
) {

substitute =
addCalendarDays(
substitute,
1
);

}

holidays.add(
getCalendarKey(
substitute
)
);

}
);

if (
year ===
2022
) {

holidays.delete(
"2022-05-30"
);

holidays.add(
"2022-06-02"
);

holidays.add(
"2022-06-03"
);

holidays.add(
"2022-09-19"
);

}

if (
year ===
2023
) {

holidays.add(
"2023-05-08"
);

}

return holidays;

}

const bankHolidayCache =
new Map();

function isEnglandWalesBankHoliday(
date
) {

const year =
date.getUTCFullYear();

if (
!bankHolidayCache.has(
year
)
) {

bankHolidayCache.set(
year,
getEnglandWalesBankHolidayKeys(
year
)
);

}

return bankHolidayCache
.get(
year
)
.has(
getCalendarKey(
date
)
);

}

function isWorkingCalendarDay(
date
) {

const weekday =
date.getUTCDay();

if (
weekday ===
0 ||
weekday ===
6
) {

return false;

}

return !isEnglandWalesBankHoliday(
date
);

}

function getUKNowParts() {

const formatter =
new Intl.DateTimeFormat(
"en-GB",
{
timeZone:
UK_TIME_ZONE,
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit",
second:"2-digit",
hourCycle:"h23"
}
);

const parts =
formatter.formatToParts(
new Date()
);

const output = {};

parts.forEach(
(part) => {

if (
part.type !==
"literal"
) {

output[
part.type
] =
part.value;

}

}
);

return {
year:
Number(
output.year
),
month:
Number(
output.month
),
day:
Number(
output.day
),
hour:
Number(
output.hour
),
minute:
Number(
output.minute
),
second:
Number(
output.second
)
};

}

function getCurrentUKCalendarDate() {

const parts =
getUKNowParts();

return makeCalendarDate(
parts.year,
parts.month,
parts.day
);

}

function getNextWorkingCalendarDay(
date
) {

let candidate =
addCalendarDays(
date,
1
);

while (
!isWorkingCalendarDay(
candidate
)
) {

candidate =
addCalendarDays(
candidate,
1
);

}

return candidate;

}

function getProductionWorkingDay(
workingDayNumber
) {

const requestedDay =
Math.max(
1,
Math.round(
Number(
workingDayNumber
)
)
);

const nowParts =
getUKNowParts();

let cursor =
makeCalendarDate(
nowParts.year,
nowParts.month,
nowParts.day
);

const todayCanCount =
isWorkingCalendarDay(
cursor
) &&
nowParts.hour <
UK_PRODUCTION_CUTOFF_HOUR;

if (
!todayCanCount
) {

while (
!isWorkingCalendarDay(
cursor
)
) {

cursor =
getNextWorkingCalendarDay(
cursor
);

}

if (
getCalendarKey(
cursor
) ===
getCalendarKey(
makeCalendarDate(
nowParts.year,
nowParts.month,
nowParts.day
)
)
) {

cursor =
getNextWorkingCalendarDay(
cursor
);

}

}

let countedDays =
1;

while (
countedDays <
requestedDay
) {

cursor =
getNextWorkingCalendarDay(
cursor
);

countedDays +=
1;

}

return cursor;

}

function getOrdinalSuffix(
day
) {

const numericDay =
Number(
day
);

if (
numericDay >=
11 &&
numericDay <=
13
) {

return "th";

}

switch (
numericDay %
10
) {

case 1:
return "st";

case 2:
return "nd";

case 3:
return "rd";

default:
return "th";

}

}

function getShortMonthName(
date
) {

return new Intl.DateTimeFormat(
"en-GB",
{
month:"short",
timeZone:"UTC"
}
).format(
date
);

}

function formatEstimatedDeliveryRange(
minimumWorkingDays,
maximumWorkingDays
) {

const minimumDate =
getProductionWorkingDay(
minimumWorkingDays
);

const maximumDate =
getProductionWorkingDay(
maximumWorkingDays
);

const minimumDay =
minimumDate.getUTCDate();

const maximumDay =
maximumDate.getUTCDate();

const minimumMonth =
getShortMonthName(
minimumDate
);

const maximumMonth =
getShortMonthName(
maximumDate
);

const minimumText =
`${minimumDay}${getOrdinalSuffix(minimumDay)}`;

const maximumText =
`${maximumDay}${getOrdinalSuffix(maximumDay)}`;

if (
minimumDate.getUTCFullYear() ===
maximumDate.getUTCFullYear() &&
minimumDate.getUTCMonth() ===
maximumDate.getUTCMonth()
) {

return (
`${minimumText} to ${maximumText} ${maximumMonth}`
);

}

return (
`${minimumText} ${minimumMonth} to ${maximumText} ${maximumMonth}`
);

}


/* =========================================
LATEST LEAD TIME LOGIC
========================================= */

function getLeadTimeForConfiguration(
glazing,
finish
) {

const glazingDetails =
getCustomGlazingDetails(
glazing
);

const finishKey =
getCustomFinishKey(
finish
);

if (
glazingDetails.isLaminated
) {

if (
finishKey ===
"clear"
) {

return {
minimum:6,
maximum:8
};

}

return {
minimum:8,
maximum:10
};

}

if (
finishKey ===
"blue"
) {

return {
minimum:8,
maximum:10
};

}

if (
finishKey ===
"grey" ||
finishKey ===
"satin"
) {

return {
minimum:6,
maximum:8
};

}

return {
minimum:4,
maximum:6
};

}

null;

function calculatePrice() {

if (
!customWidthInput ||
!customLengthInput ||
!customBorderSelect ||
!customGlazingSelect ||
!customFinishSelect
) {

return;

}

const width =
Number(
customWidthInput.value
);

const length =
Number(
customLengthInput.value
);

const border =
Number(
customBorderSelect.value
);

const glazing =
customGlazingSelect.value;

const finish =
customFinishSelect.value;

saveHomepageCalculatorState();

const dimensionsValid =
validateCustomCalculatorDimensions(
width,
length
);

if (
!dimensionsValid
) {

hideCustomCalculatorPrice();
return;

}

const calculatedPrice =
getCustomCalculatorPrice(
width,
length,
border,
glazing,
finish
);

if (
!Number.isFinite(
calculatedPrice
) ||
calculatedPrice <=
0
) {

hideCustomCalculatorPrice();
return;

}

const externalWidth =
width +
(
border *
2
);

const externalLength =
length +
(
border *
2
);

renderCustomCalculatorPrice(
calculatedPrice
);

updateCustomDimensionTextClass(
customPriceInternal,
`${width} × ${length}mm`
);

updateCustomDimensionTextClass(
customPriceExternal,
`${externalWidth} × ${externalLength}mm`
);

const leadTime =
getLeadTimeForConfiguration(
glazing,
finish
);

if (
estimatedDeliveryDate
) {

estimatedDeliveryDate.textContent =
formatEstimatedDeliveryRange(
leadTime.minimum,
leadTime.maximum
);

}

if (
customPriceBox
) {

customPriceBox.hidden =
false;

}

if (
calculatorSizeAlert
) {

calculatorSizeAlert.hidden =
true;

}

if (
addCustomRooflightToOrder
) {

addCustomRooflightToOrder.href =
buildCustomCalculatorOrderUrl(
width,
length,
border,
glazing,
finish
);

addCustomRooflightToOrder.removeAttribute(
"aria-disabled"
);

addCustomRooflightToOrder.style.pointerEvents =
"";

addCustomRooflightToOrder.style.opacity =
"";

}

}

[
customWidthInput,
customLengthInput
].forEach(
(input) => {

if (
!input
) {

return;

}

input.addEventListener(
"input",
calculatePrice
);

input.addEventListener(
"change",
calculatePrice
);

}
);

[
customBorderSelect,
customGlazingSelect,
customFinishSelect
].forEach(
(select) => {

if (
!select
) {

return;

}

select.addEventListener(
"change",
calculatePrice
);

}
);

latitude,
longitude
};

}

function degreesToRadians(
degrees
) {

return (
Number(
degrees
) *
Math.PI /
180
);

}

function calculateStraightLineMiles(
first,
second
) {

const earthRadiusMiles =
3958.7613;

const latitudeDifference =
degreesToRadians(
second.latitude -
first.latitude
);

const longitudeDifference =
degreesToRadians(
second.longitude -
first.longitude
);

const firstLatitude =
degreesToRadians(
first.latitude
);

const secondLatitude =
degreesToRadians(
second.latitude
);

const a =
Math.sin(
latitudeDifference /
2
) **
2 +
Math.cos(
firstLatitude
) *
Math.cos(
secondLatitude
) *
Math.sin(
longitudeDifference /
2
) **
2;

const c =
2 *
Math.atan2(
Math.sqrt(
a
),
Math.sqrt(
1 -
a
)
);

return (
earthRadiusMiles *
c
);

}

/* =========================================
ORDER PAGE MATCHED DELIVERY GROUP PRICING

Each physical unit is expanded separately.

For each delivery group:
- one unit receives the base charge
- every other unit uses ITS OWN category's
additional-unit charge
- every possible base unit is tested
- the most expensive valid combination wins

Extra Large and non-Extra-Large units are
split into separate delivery groups.
========================================= */

function expandHomepageDeliveryItemsIntoUnits(
items
) {

const units = [];

(
Array.isArray(
items
)
? items
: []
)
.forEach(
(item) => {

const category =
getItemDeliveryCategory(
item
);

if (
!category
) {

return;

}

const quantity =
Math.max(
1,
Math.min(
999,
Math.floor(
Number(
getItemQuantity(
item
)
) ||
1
)
)
);

for (
let index = 0;
index <
quantity;
index +=
1
) {

units.push({
item,
category
});

}

}
);

return units;

}

function calculateHomepageDeliveryCombinationForBaseUnit(
units,
baseIndex,
miles
) {

if (
!Array.isArray(
units
) ||
!units.length ||
!Number.isInteger(
baseIndex
) ||
baseIndex <
0 ||
baseIndex >=
units.length
) {

return null;

}

const baseUnit =
units[
baseIndex
];

const baseCategory =
baseUnit.category;

const basePrice =
getDeliveryBaseForDistance(
baseCategory,
miles
);

if (
!Number.isFinite(
basePrice
)
) {

return null;

}

const additionalUnitsTotal =
units.reduce(
(total,unit,index) => {

if (
index ===
baseIndex
) {

return total;

}

return (
total +
getDeliveryAdditionalUnitPrice(
unit.category
)
);

},
0
);

return {
baseIndex,
baseCategory,
basePrice,
additionalUnitsTotal,
price:
basePrice +
additionalUnitsTotal
};

}

function getMostExpensiveHomepageDeliveryCombination(
units,
miles
) {

if (
!Array.isArray(
units
) ||
!units.length
) {

return null;

}

let mostExpensive =
null;

units.forEach(
(unit,index) => {

const combination =
calculateHomepageDeliveryCombinationForBaseUnit(
units,
index,
miles
);

if (
!combination
) {

return;

}

if (
!mostExpensive ||
combination.price >
mostExpensive.price
) {

mostExpensive =
combination;

return;

}

if (
combination.price ===
mostExpensive.price &&
combination.basePrice >
mostExpensive.basePrice
) {

mostExpensive =
combination;

}

}
);

return mostExpensive;

}

function getHomepageDeliveryGroups(
units
) {

if (
!Array.isArray(
units
) ||
!units.length
) {

return [];

}

const extraLargeUnits =
units.filter(
(unit) =>
unit.category ===
"extraLarge"
);

const nonExtraLargeUnits =
units.filter(
(unit) =>
unit.category !==
"extraLarge"
);

if (
extraLargeUnits.length &&
nonExtraLargeUnits.length
) {

return [
{
name:"extraLarge",
units:extraLargeUnits
},
{
name:"nonExtraLarge",
units:nonExtraLargeUnits
}
];

}

return [
{
name:"combined",
units
}
];

}

function getHomepageDeliveryLimitFailure(
units,
miles
) {

const failingUnit =
units.find(
(unit) => {

const config =
DELIVERY_CATEGORY_CONFIG[
unit.category
];

return (
config &&
miles >
config.maxMiles
);

}
);

if (
!failingUnit
) {

return null;

}

if (
failingUnit.category ===
"extraLarge"
) {

return {
reason:
"Delivery quotation required for Extra Large rooflights over 200 adjusted miles."
};

}

return {
reason:
"Delivery quotation required for destinations over 400 adjusted miles."
};

}

function calculateHomepageDelivery(
items,
miles
) {

const chargeableMiles =
Math.max(
0,
Math.ceil(
Number(
miles
) ||
0
)
);

const units =
expandHomepageDeliveryItemsIntoUnits(
items
);

if (
!units.length
) {

return {
quote:false,
amount:0,
miles:chargeableMiles,
reason:""
};

}

const limitFailure =
getHomepageDeliveryLimitFailure(
units,
chargeableMiles
);

if (
limitFailure
) {

return {
quote:true,
amount:null,
miles:chargeableMiles,
reason:
limitFailure.reason
};

}

const groups =
getHomepageDeliveryGroups(
units
);

const groupResults =
groups.map(
(group) => {

const combination =
getMostExpensiveHomepageDeliveryCombination(
group.units,
chargeableMiles
);

if (
!combination
) {

return null;

}

return {
name:
group.name,
combination
};

}
);

if (
groupResults.some(
(result) =>
!result
)
) {

return {
quote:true,
amount:null,
miles:chargeableMiles,
reason:
"Delivery quotation required."
};

}

const amount =
groupResults.reduce(
(total,result) =>
total +
result.combination.price,
0
);

return {
quote:false,
amount,
miles:chargeableMiles,
reason:""
};

}

)
) {

);

const requiresQuote =
payload.deliveryRequiresQuote ===
true;

const resolved =
payload.deliveryResolved ===

)
? chargeableMiles

String(

};

) {

deliveryFee
),

chargeableMiles

function invalidateHomepageDeliveryLookup() {

1;

function changeBasketItemQuantity(
kind,
index,
difference
) {

const payload =
readHomepageOrderPayload();

const collection =
getMutableBasketCollection(
payload,
kind
);

const item =
collection[
index
];

if (
!item
) {

return;

}

const currentQuantity =
getItemQuantity(
item
);

const nextQuantity =
Math.max(
1,
Math.min(
999,
currentQuantity +
difference
)
);

if (
nextQuantity ===
currentQuantity
) {

return;

}

setItemQuantity(
item,
nextQuantity
);

writeHomepageOrderPayload(
payload
);

invalidateHomepageDeliveryLookup();

const storedPostcode =
readStoredDeliveryPostcode(
payload
);

setHomepageDeliveryPending(
storedPostcode
);

persistHomepageDeliveryState();

renderHomepageBasket();

if (
storedPostcode &&
isCompleteUKPostcode(
storedPostcode
)
) {

calculateBasketDeliveryForPostcode(

{

}
);

kind,
index
) {

const payload =
readHomepageOrderPayload();

const collection =
getMutableBasketCollection(
payload,
kind
);

if (
index <
0 ||
index >=
collection.length
) {

return;

}

const removedItem =
collection[
index
];

const removedKey =
getHomepageBasketItemKey(
removedItem,
kind,
index
);

basketDrawerExpandedItems.delete(
removedKey
);

collection.splice(
index,
1
);

writeHomepageOrderPayload(
payload
);

invalidateHomepageDeliveryLookup();

const storedPostcode =
readStoredDeliveryPostcode(
payload
);

setHomepageDeliveryPending(
storedPostcode
);

persistHomepageDeliveryState();

renderHomepageBasket();

const remainingPayload =
readHomepageOrderPayload();

const remainingItems =
getHomepageBasketItems(
remainingPayload
);

if (
remainingItems.length &&
storedPostcode &&
isCompleteUKPostcode(
storedPostcode
)
) {

calculateBasketDeliveryForPostcode(
storedPostcode,
{
animateLoading:false
}
);

}

}

/* =========================================
POSTCODE DELIVERY CALCULATION
========================================= */

async function calculateBasketDeliveryForPostcode(
postcode,
{
animateLoading = true
} = {}
) {

const cleaned =
normalizePostcode(
postcode
);

if (
!isCompleteUKPostcode(
cleaned
)
) {

return;

}

invalidateHomepageDeliveryLookup();

const requestId =
++basketDeliveryRequestId;

const formattedPostcode =
formatPostcode(
cleaned
);

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:true,
valid:false,
quote:false,
amount:null,
adjustedMiles:null,
miles:null,
reason:"",
error:""
};

persistHomepageDeliveryState();

if (
animateLoading
) {

updateHomepageBasketDeliverySummaryOnly();

}

try {

const payload =
readHomepageOrderPayload();

const items =
getHomepageBasketItems(
payload
);

const [
originCoordinates,
destinationCoordinates
] =
await Promise.all([
getDeliveryOriginCoordinates(),
fetchPostcodeCoordinates(
formattedPostcode
)
]);

if (
requestId !==
basketDeliveryRequestId
) {

return;

}

const straightLineMiles =
calculateStraightLineMiles(
originCoordinates,
destinationCoordinates
);

const adjustedMiles =
straightLineMiles *
ROAD_DISTANCE_ALLOWANCE;

const chargeableMiles =
Math.ceil(
adjustedMiles
);

const delivery =
calculateHomepageDelivery(
items,
chargeableMiles
);

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:false,
valid:true,
quote:
delivery.quote,
amount:
delivery.amount,
adjustedMiles,
miles:
delivery.miles,
reason:
delivery.reason ||
"",
error:""
};

persistHomepageDeliveryState();

renderHomepageBasket();

}
catch (error) {

if (
requestId !==
basketDeliveryRequestId
) {

return;

}

currentHomepageDelivery = {
postcode:formattedPostcode,
loading:false,
valid:false,
quote:false,
amount:null,
adjustedMiles:null,
miles:null,
reason:"",
error:
"Please check the postcode and try again."
};

persistHomepageDeliveryState();

renderHomepageBasket();

const invalidInput =
document.getElementById(
"basketDrawerPostcode"
);

if (
invalidInput
) {

invalidInput.classList.add(
"is-invalid"
);

}

}

}

) &&
!(
currentHomepageDelivery.valid &&
!currentHomepageDelivery.loading
)
) {

calculateBasketDeliveryForPostcode(
storedPostcode,
{
animateLoading:false
}
);

}

}

function closeBasketDrawer(
{
restoreFocus = true
} = {}
) {

if (
!basketDrawerLayer ||
!basketButton ||
!basketDrawerIsOpen
) {

return;

}

basketDrawerIsOpen =
false;

basketDrawerLayer.classList.remove(
"is-open"
);

basketDrawerLayer.setAttribute(
"aria-hidden",
"true"
);

basketButton.setAttribute(
"aria-expanded",
"false"
);

setHomepageBasketBackgroundInert(
false
);

unlockHomepageBasketPageScroll();

applyDesktopAccessRestriction();

if (
restoreFocus &&
lastBasketFocusedElement &&
typeof lastBasketFocusedElement.focus ===
"function"
) {

window.requestAnimationFrame(
() => {

if (
!document.contains(
lastBasketFocusedElement
)
) {

return;

}

try {

lastBasketFocusedElement.focus({
preventScroll:true
});

}
catch (error) {

lastBasketFocusedElement.focus();

}

}
);

}

lastBasketFocusedElement =
null;

}

if (
basketButton
) {

basketButton.addEventListener(
"click",
openBasketDrawer
);

}

if (
basketDrawerClose
) {

basketDrawerClose.addEventListener(
"click",
(event) => {

event.preventDefault();

event.stopPropagation();

closeBasketDrawer();

}
);

}

if (
basketDrawerBackdrop
) {

basketDrawerBackdrop.addEventListener(
"click",
(event) => {

event.preventDefault();

closeBasketDrawer();

}
);

}


/* =========================================
BASKET KEYBOARD FOCUS TRAP
========================================= */

document.addEventListener(
"keydown",
(event) => {

if (
!basketDrawerIsOpen
) {

return;

}

if (
event.key ===
"Escape"
) {

event.preventDefault();

closeBasketDrawer();

return;

}

if (
event.key !==
"Tab"
) {

return;

}

const focusableElements =
getHomepageBasketFocusableElements();

if (
!focusableElements.length
) {

event.preventDefault();

basketDrawerPanel?.focus({
preventScroll:true
});

return;

}

const first =
focusableElements[0];

const last =
focusableElements[
focusableElements.length -
1
];

if (
event.shiftKey &&
document.activeElement ===
first
) {

event.preventDefault();

last.focus();

return;

}

if (
!event.shiftKey &&
document.activeElement ===
last
) {

event.preventDefault();

first.focus();

}

}
);


/* =========================================
REFRESH BASKET ACROSS NAVIGATION
========================================= */

function refreshHomepageBasket() {

const payload =
readHomepageOrderPayload();

loadHomepageDeliveryStateFromPayload(
payload
);

const items =
getHomepageBasketItems(
payload
);

updateBasketHeaderTotal(
items
);

if (
basketDrawerLayer &&
basketDrawerLayer.classList.contains(
"is-open"
)
) {

renderHomepageBasket();

}

}

window.addEventListener(
"storage",
(event) => {

if (
event.key ===
HOMEPAGE_ORDER_STORAGE_KEY ||
event.key ===
HOMEPAGE_DELIVERY_POSTCODE_KEY
) {

refreshHomepageBasket();

}

}
);

window.addEventListener(
"pageshow",
() => {

refreshHomepageBasket();

restoreHomepageCalculatorState();

updateExistingOpeningRecommendation();

revealHomepageCustomBuildArea();

if (
typeof getCustomCalculatorPrice ===
"function"
) {

calculatePrice();

}
else {

hideCustomCalculatorPrice();

}

}
);

document.addEventListener(
"visibilitychange",
() => {

if (
document.visibilityState ===
"visible"
) {

refreshHomepageBasket();

}

}
);


/* =========================================
INITIAL BASKET RENDER IS DEFERRED

refreshHomepageBasket() IS CALLED FROM THE
FINAL INITIALISATION SECTION AFTER IN-3.

THIS PREVENTS ANY MASTER MAKE-UP DEPENDENCY
FROM BEING REACHED BEFORE IN-3 EXISTS.
========================================= */


/* =========================================
HEADER HOME LINK
========================================= */

const headerHomeLink =
document.getElementById(
"headerHomeLink"
);

if (
headerHomeLink
) {

headerHomeLink.addEventListener(
"click",
() => {

closeWhatsappAction();

if (
basketDrawerIsOpen
) {

closeBasketDrawer();

}

}
);

}


/* =========================================
IN-3 IS PASTED IMMEDIATELY ABOVE THE
FINAL INITIALISATION SECTION BELOW.

IN-3 MUST INSTALL:

- getHomepageProductCardPrice()
- getCustomCalculatorPrice()
- getItemTopGlassLabel()

BEFORE THE INITIALISATION BELOW EXECUTES.
========================================= */


/* =========================================
FINAL INITIALISATION

THIS IS NOW THE ONLY INITIAL START-UP POINT
FOR PRODUCT-CARD PRICING, CALCULATOR STATE /
PRICING AND THE HOMEPAGE BASKET.

IN-3 SITS DIRECTLY ABOVE THIS SECTION.
========================================= */

requestAnimationFrame(
() => {

if (
typeof getHomepageProductCardPrice ===
"function"
) {

initializeHomepageProductPrices();

}

restoreHomepageCalculatorState();

updateExistingOpeningRecommendation();

revealHomepageCustomBuildArea();

if (
typeof getCustomCalculatorPrice ===
"function"
) {

calculatePrice();

}
else {

hideCustomCalculatorPrice();

}

refreshHomepageBasket();

}
);

</script>
