/* =========================================
OP2 ESTIMATED DELIVERY MASTER
These function declarations intentionally
take control of the estimated-delivery
behaviour from this point onward.
They reuse the working-day/date helpers
already contained in OP1, so no date/time
constants are redeclared here.

LEAD TIMES:
TOUGHENED CLEAR
4–6 working days

TOUGHENED GREY / SATIN
6–8 working days

TOUGHENED BLUE
8–10 working days

LAMINATED CLEAR
6–8 working days

LAMINATED BLUE / GREY / SATIN
8–10 working days
========================================= */
function getLeadTimeForSelection(
selection
) {
const type =
selection?.type ===
"laminated"
?
"laminated"
:
"toughened";

const tint =
normalizeTint(
selection?.tint ??
selection?.finish
);

if (
type ===
"laminated"
) {
if (
tint ===
"clear"
) {
return {
min:6,
max:8
};
}

return {
min:8,
max:10
};
}

if (
tint ===
"clear"
) {
return {
min:4,
max:6
};
}

if (
tint ===
"blue"
) {
return {
min:8,
max:10
};
}

return {
min:6,
max:8
};
}

function getCurrentLeadTime() {
return getLeadTimeForSelection(
state
);
}

function getBasketLeadTime() {
const basketItems =
getAllBasketItems();

if (
!basketItems.length
) {
return getCurrentLeadTime();
}

return basketItems.reduce(
(
current,
item
) => {
const leadTime =
getLeadTimeForSelection(
item
);

return {
min:
Math.max(
current.min,
leadTime.min
),
max:
Math.max(
current.max,
leadTime.max
)
};
},
{
min:0,
max:0
}
);
}

function getBasketEstimatedDeliveryText() {
const deliveryText =
getEstimatedDeliveryTextForLeadTime(
getBasketLeadTime()
);

return (
deliveryText.replace(
" - ",
" to "
) +
"."
);
}

function updateEstimatedDelivery() {
if (
estimatedDeliveryRange
) {
const nextDeliveryText =
getEstimatedDeliveryTextForLeadTime(
getCurrentLeadTime()
);

const deliveryChanged =
estimatedDeliveryRange.textContent.trim() !==
nextDeliveryText;

estimatedDeliveryRange.textContent =
nextDeliveryText;

if (
!hasAnimatedEstimatedDelivery ||
deliveryChanged
) {
animateEstimatedDelivery();
hasAnimatedEstimatedDelivery =
true;
}
}

const basketEstimatedDeliveryRange =
document.querySelector(
"[data-basket-estimated-delivery-range]"
);

if (
basketEstimatedDeliveryRange
) {
basketEstimatedDeliveryRange.textContent =
getBasketEstimatedDeliveryText();
}
}

/* =========================================
PER-ITEM DELIVERY CONTRIBUTION

The contribution is calculated by the
shared master. OP2 does not reproduce the
base/additional/group algorithm.
========================================= */
function getResolvedDeliveryContributionForItem(
targetItem
) {
if (
!state.deliveryResolved ||
state.deliveryRequiresQuote
) {
return null;
}

const chargeableMiles =
Number(
state.deliveryChargeableMiles
);

if (
!Number.isFinite(
chargeableMiles
)
) {
return null;
}

const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (
!delivery ||
typeof delivery.getResolvedDeliveryContributionForItem !==
"function"
) {
return null;
}

try {
const contribution =
delivery.getResolvedDeliveryContributionForItem(
getAllBasketItems(),
targetItem,
chargeableMiles
);

const numericContribution =
Number(
contribution
);

return Number.isFinite(
numericContribution
)
?
Math.max(
0,
numericContribution
)
:
null;
}
catch (
error
) {
console.warn(
"Master per-item delivery contribution unavailable.",
error
);

return null;
}
}

/* =========================================
PRIMARY MASTER POSTCODE DELIVERY CALL

MasterDeliveryRates.calculateDelivery()
owns:
- postcode validation/lookup
- origin postcode
- geographical distance
- distance adjustment
- chargeable-mile rounding
- category classification
- delivery bands
- base/additional calculations
- most-expensive valid base
- Extra Large split
- maximum delivery distances
- final customer delivery charge
========================================= */
async function calculatePostcodeDelivery(
postcode
) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (
!delivery ||
typeof delivery.calculateDelivery !==
"function"
) {
return createUnavailableMasterDeliveryResult(
postcode
);
}

try {
const result =
await delivery.calculateDelivery(
{
postcode:
postcode,
items:
getAllBasketItems(),
currentSelection:
state,
normalizeTint:
normalizeTint,
getEstimatedDeliveryTextForLeadTime:
getEstimatedDeliveryTextForLeadTime
}
);

if (
!result ||
typeof result !==
"object"
) {
return createUnavailableMasterDeliveryResult(
postcode,
"INVALID_MASTER_DELIVERY_RESULT",
"Delivery pricing is temporarily unavailable. Please contact us for a delivery quotation."
);
}

return result;
}
catch (
error
) {
console.warn(
"Master delivery calculation unavailable.",
error
);

return createUnavailableMasterDeliveryResult(
postcode,
"MASTER_DELIVERY_ERROR",
"Delivery pricing is temporarily unavailable. Please contact us for a delivery quotation."
);
}
}

/* =========================================
MAP MASTER DELIVERY RESULT INTO EXISTING
ORDER PAGE DELIVERY STATE

MASTER RESULT FIELDS USED:
status
available
requiresQuote
reason
postcode
adjustedMiles
chargeableMiles
deliveryCharge
========================================= */
function updateAllDeliveryItems(
postcode,
masterResult
) {
const formattedPostcode =
formatPostcode(
postcode
);

const requiresQuote =
masterResult?.requiresQuote ===
true ||
masterResult?.status ===
"QUOTE_REQUIRED";

const available =
masterResult?.status ===
"AVAILABLE" &&
masterResult?.available ===
true &&
!requiresQuote;

const fee =
available
?
Number(
masterResult?.deliveryCharge
)
:
null;

const hasValidFee =
available &&
Number.isFinite(
fee
) &&
fee >=
0;

/*
FAIL-SAFE:
Any result which is neither a valid
available delivery nor an explicit quote
result becomes quotation-required rather
than silently becoming £0 delivery.
*/
const failSafeQuote =
!hasValidFee &&
!requiresQuote;

state.deliveryPostcode =
formattedPostcode;

state.deliveryFee =
hasValidFee
?
fee
:
null;

state.deliveryResolved =
hasValidFee;

state.deliveryRequiresQuote =
requiresQuote ||
failSafeQuote;

state.deliveryQuoteReason =
state.deliveryRequiresQuote
?
String(
masterResult?.reason ||
"Delivery quotation required."
)
:
"";

state.deliveryAdjustedMiles =
Number.isFinite(
Number(
masterResult?.adjustedMiles
)
)
?
Number(
masterResult.adjustedMiles
)
:
null;

state.deliveryChargeableMiles =
Number.isFinite(
Number(
masterResult?.chargeableMiles
)
)
?
Number(
masterResult.chargeableMiles
)
:
null;

state.orderItems.forEach(
item => {
item.deliveryCategory =
getDeliveryCategoryForSize(
item.size
);

item.deliveryPostcode =
formattedPostcode;

item.deliveryFee =
state.deliveryFee;

item.deliveryResolved =
state.deliveryResolved;

item.deliveryRequiresQuote =
state.deliveryRequiresQuote;
}
);

state.customOrderItems.forEach(
item => {
item.deliveryCategory =
getDeliveryCategoryForCustomDimensions(
item.width,
item.length
);

item.deliveryPostcode =
formattedPostcode;

item.deliveryFee =
state.deliveryFee;

item.deliveryResolved =
state.deliveryResolved;

item.deliveryRequiresQuote =
state.deliveryRequiresQuote;
}
);
}

/* =========================================
MASTER PRODUCT PRICING
OP2 does not choose Cheap / Normal /
Expensive itself.

FactoryRooflightsMasterPricing is the
authoritative pricing router.

If the master reports available:false,
or is not loaded, OP2 returns no price.

There is deliberately no fallback to an
old table, another strategy or £0.
========================================= */
function getFactoryRooflightsMasterPricing() {
const pricing =
globalThis
.FactoryRooflightsMasterPricing;

if (
!pricing ||
typeof pricing !==
"object"
) {
return null;
}

return pricing;
}

function createUnavailableMasterPriceResult(
source,
reasonCode =
"MASTER_PRICING_UNAVAILABLE"
) {
return {
available:false,
source:
source,
reasonCode:
reasonCode,
price:null
};
}

function normalizeMasterPricingResult(
result,
source
) {
if (
!result ||
result.available !==
true
) {
return {
...(
result &&
typeof result ===
"object"
?
result
:
{}
),
available:false,
source:
result?.source ||
source,
price:null
};
}

const price =
Number(
result.price
);

if (
!Number.isFinite(
price
) ||
price <=
0
) {
return {
...result,
available:false,
source:
result.source ||
source,
price:null
};
}

return {
...result,
available:true,
source:
result.source ||
source,
price:
price
};
}

function getMasterStandardPriceResult(
selection
) {
const pricing =
getFactoryRooflightsMasterPricing();

if (
!pricing ||
typeof pricing.getStandardPrice !==
"function"
) {
return createUnavailableMasterPriceResult(
"standard"
);
}

try {
const result =
pricing.getStandardPrice(
{
size:
normalizeSize(
selection?.size
),
glazing:
selection?.glazing,
type:
selection?.type,
finish:
normalizeTint(
selection?.tint ??
selection?.finish
),
border:
Number(
selection?.border
)
}
);

return normalizeMasterPricingResult(
result,
"standard"
);
}
catch (
error
) {
console.warn(
"Master standard price unavailable.",
error
);

return createUnavailableMasterPriceResult(
"standard"
);
}
}

function getMasterCustomPriceResult(
selection
) {

getFactoryRooflightsMasterPricing();

if (
!pricing ||
typeof pricing.getCustomPrice !==

) {

try {

state.orderItems.length >
0 ||
state.customOrderItems.length >
0;

const deliveryFullyPriced =
state.deliveryResolved &&
!state.deliveryRequiresQuote;

const hasUnpricedItem =
basketContainsUnpricedItem();

const shouldDisable =
!hasBasketItems ||
!deliveryFullyPriced ||
hasUnpricedItem;

document
.querySelectorAll(
".checkout-now"
)
.forEach(
checkout => {
checkout.classList.toggle(
"is-disabled",
shouldDisable
);

checkout.setAttribute(
"aria-disabled",
String(
shouldDisable
)
);

if (
checkout instanceof
HTMLButtonElement
) {
checkout.disabled =
shouldDisable;
}

if (
shouldDisable
) {
checkout.setAttribute(
"tabindex",
"-1"
);
}
else {
checkout.removeAttribute(
"tabindex"
);
}
}
);
}

document.addEventListener(
"click",
event => {
const checkout =
event.target.closest(
".checkout-now"
);

if (
!checkout
) {
return;
}

event.preventDefault();
}
);

/* =========================================
APPLY POSTCODE
========================================= */
async function applyDeliveryPostcode(
postcode,
{
animate = true
} = {}
) {
const cleaned =
normalizePostcode(
postcode
);

const deliveryMaster =
getFactoryRooflightsMasterDeliveryRates();

/*
FAIL-SAFE:
Do not classify the postcode as invalid just
because the shared delivery master failed to
load. Show the existing quotation-required
state and keep checkout disabled.
*/
if (
!deliveryMaster ||
typeof deliveryMaster.calculateDelivery !==
"function" ||
typeof deliveryMaster.isCompleteUKPostcode !==
"function"
) {
invalidateDeliveryLookup();

const unavailableResult =
createUnavailableMasterDeliveryResult(
cleaned
);

updateAllDeliveryItems(
unavailableResult.postcode ||
cleaned,
unavailableResult
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary(
{
animate:false
}
);

renderCustomOrderSummary(
{
animate:false
}
);

updateBasketDrawerSummaryOnly();

updateBasketTotal(
state.basketTotal,
{
animate:false
}
);

updateCheckoutAvailability();

showSummaryTotalsImmediately();

requestOrderSummaryDeliveryWidthSync();

return;
}

if (
!isCompleteUKPostcode(
cleaned
)
) {
invalidateDeliveryLookup();

setDeliveryPending(
cleaned
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals(
{
animateBasket:false
}
);

markDeliveryInputsInvalid();

return;
}

deliveryLookupToken +=
1;

const token =
deliveryLookupToken;

if (
deliveryLookupTimer !==
null
) {
clearTimeout(
deliveryLookupTimer
);

deliveryLookupTimer =
null;
}

setDeliveryPending(
cleaned
);

if (
animate
) {
hideSummaryTotalsForDelivery();
}

markDeliveryInputsChecking(
cleaned
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals(
{
animateBasket:false
}
);

try {
const result =
await calculatePostcodeDelivery(
cleaned
);

if (
token !==
deliveryLookupToken
) {
return;
}

/*
The shared master returns structured lookup
failures instead of throwing them.
Preserve the existing invalid-postcode UI
for an unrecognised postcode.
*/
if (
result?.status ===
"INVALID_POSTCODE" ||
result?.status ===
"POSTCODE_LOOKUP_FAILED"
) {
throw new Error(
String(
result?.reason ||
"Postcode not recognised"
)
);
}

updateAllDeliveryItems(
result?.postcode ||
cleaned,
result
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary(
{
animate:false
}
);

renderCustomOrderSummary(
{
animate:false
}
);

/*
Postcode resolution does not rebuild all
basket-item HTML.
The products themselves have not changed,
so retain their existing DOM and update only
the basket delivery / totals presentation.
*/
updateBasketDrawerSummaryOnly();

updateBasketTotal(
state.basketTotal
);

updateCheckoutAvailability();

requestOrderSummaryDeliveryWidthSync();

updateEstimatedDelivery();

if (
animate
) {
playDeliveryResolutionAnimation();
}
else {
showSummaryTotalsImmediately();
}
}
catch (
error
) {
if (
token !==
deliveryLookupToken
) {
return;
}

setDeliveryPending(
cleaned
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary(
{
animate:false
}
);

renderCustomOrderSummary(
{
animate:false
}
);

/*
Only the delivery presentation needs
to change here. The basket item cards are
left intact.
*/
updateBasketDrawerSummaryOnly();

updateBasketTotal(
state.basketTotal,
{
animate:false
}
);

updateCheckoutAvailability();

markDeliveryInputsInvalid();

showSummaryTotalsImmediately();

requestOrderSummaryDeliveryWidthSync();
}
}

/* =========================================
DEBOUNCED POSTCODE LOOKUP
========================================= */
function scheduleDeliveryPostcodeLookup(
postcode
) {
if (
deliveryLookupTimer !==
null
) {
clearTimeout(
deliveryLookupTimer
);

deliveryLookupTimer =
null;
}

const cleaned =
normalizePostcode(
postcode
);

if (
!isCompleteUKPostcode(
cleaned
)
) {
return;
}

const deliveryMaster =
getFactoryRooflightsMasterDeliveryRates();

const debounceMs =
Number(
deliveryMaster
?.DELIVERY_CONFIG
?.integrationTimings
?.postcodeLookupDebounceMs
);

deliveryLookupTimer =
setTimeout(
() => {
deliveryLookupTimer =
null;

applyDeliveryPostcode(
cleaned
);
},
Number.isFinite(
debounceMs
)
?
debounceMs
:
550
);
}

/* =========================================
RECALCULATE DELIVERY AFTER BASKET CHANGE
========================================= */
function recalculateResolvedDelivery(
{
animate = false
} = {}
) {
const postcode =
String(
state.deliveryPostcode ||
""
).trim();

if (
!postcode
) {
setDeliveryPending(
""
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals(
{
animateBasket:false
}
);

renderBasketDrawer();

updateEstimatedDelivery();

return Promise.resolve();
}

if (
!(
state.orderItems.length ||
state.customOrderItems.length
)
) {
setDeliveryPending(
postcode
);

state.basketTotal =
0;

saveOrderToStorage();

refreshDisplayedBasketTotals(
{
animateBasket:false
}
);

renderBasketDrawer();

updateEstimatedDelivery();

return Promise.resolve();
}

return applyDeliveryPostcode(
postcode,
{
animate:
animate
}
);
}

========================================= */
function homepageImportMatchesCurrentSelection() {
const imported =
state.homepageImport;

if (
!imported
) {
return false;
}

return (
imported.size ===
state.size &&
imported.glazing ===
state.glazing &&
imported.type ===
state.type &&
imported.border ===
state.border &&
imported.tint ===
state.tint
);
}

function homepageImageMatchesCurrentSelection() {
const imported =
state.homepageImport;

if (
!imported ||
!imported.image
) {
return false;
}

return (
imported.size ===
state.size &&
imported.tint ===
state.tint
);
}

function getTintedProductFilename(
baseFilename,
tint
) {
const normalizedTint =
normalizeTint(
tint
);

if (
normalizedTint ===
"clear"
) {
return baseFilename;
}

const usableBaseFilename =
TINT_IMAGE_BASE_FALLBACKS[
baseFilename
]
||
baseFilename;

const prefix =
TINT_IMAGE_PREFIX[
normalizedTint
]
||
"";

return `${prefix}${usableBaseFilename}`;
}

function selectedProductImage() {
if (
state.size !==
"400x800" &&
homepageImageMatchesCurrentSelection()
) {
return state.homepageImport.image;
}

const product =
PRODUCTS[
state.size
];

if (
!product
) {
return "";
}

const filename =
getTintedProductFilename(
product.image,
state.tint
);

return (
"images/product-cards/" +
filename
);
}

function getProductImageFinishAdjustment() {
const sizeAdjustments =
PRODUCT_IMAGE_FINISH_ADJUSTMENTS[
state.size
];

if (
!sizeAdjustments
) {
return {
scale:0,
left:0
};
}

const finishAdjustment =
sizeAdjustments[
state.tint
];

if (
!finishAdjustment
) {
return {
scale:0,
left:0
};
}

return {
scale:
Number(
finishAdjustment.scale
) || 0,
left:
Number(
finishAdjustment.left
) || 0
};
}

function getProductImageScale() {
const baseAdjustment =
Number(
PRODUCT_IMAGE_SCALE_ADJUSTMENTS[
state.size
]
||
0
);

const finishAdjustment =
getProductImageFinishAdjustment();

const totalAdjustment =
baseAdjustment +
finishAdjustment.scale;

return (
PRODUCT_IMAGE_BASE_SCALE *
(
1 +
totalAdjustment /
100
)
);
}

function getProductImageLeft() {
return getProductImageFinishAdjustment().left;
}

function getProductImageRotation() {
return Number(
PRODUCT_IMAGE_ROTATIONS[
state.size
]
||
0
);
}

function updateProductImageTransform() {
const scale =
getProductImageScale();

const hoverScale =
scale *
PRODUCT_IMAGE_HOVER_RATIO;

const rotation =
getProductImageRotation();

const left =
getProductImageLeft();

const objectFit =
PRODUCT_IMAGE_OBJECT_FIT[
state.size
]
||
"contain";

productImage.style.setProperty(
"--product-image-scale",
scale.toFixed(
4
)
);

productImage.style.setProperty(
"--product-image-hover-scale",
hoverScale.toFixed(
4
)
);

productImage.style.setProperty(
"--product-image-rotation",
`${rotation}deg`
);

productImage.style.setProperty(
"--product-image-left",
`${left}%`
);

productImage.style.objectFit =
objectFit;
}

function setProductImage(
imageSource,
altText,
animate = false
) {
if (
!imageSource
) {
return;
}

productImage.alt =
altText;

imageTransitionToken +=
1;

const token =
imageTransitionToken;

if (
imageFadeTimer !==
null
) {
clearTimeout(
imageFadeTimer
);

imageFadeTimer =
null;
}

if (
!animate ||
reducedMotionQuery.matches
) {
productImage.classList.remove(
"image-fade-out"
);

if (
productImage.getAttribute(
"src"
) !==
imageSource
) {
productImage.src =
imageSource;
}

return;
}

productImage.classList.add(
"image-fade-out"
);

imageFadeTimer =
setTimeout(
() => {
if (
token !==
imageTransitionToken
) {
return;
}

const currentSource =
productImage.getAttribute(
"src"
)
||
"";

if (
currentSource ===
imageSource
) {
requestAnimationFrame(
() => {
if (
token ===
imageTransitionToken
) {
productImage.classList.remove(
"image-fade-out"
);
}
}
);

return;
}

const preloader =
new Image();

const reveal =
() => {
if (
token !==
imageTransitionToken
) {
return;
}

productImage.src =
imageSource;

productImage.alt =
altText;

requestAnimationFrame(
() => {
requestAnimationFrame(
() => {
if (
token ===
imageTransitionToken
) {
productImage.classList.remove(
"image-fade-out"
);
}
}
);
}
);
};

preloader.onload =
reveal;

preloader.onerror =
reveal;

preloader.src =
imageSource;
},
140
);
}

);

numericPrice
);

totalVisibilityToken +=

if (
totalVisibilityTimer !==

) {

totalVisibilityTimer

totalPriceBlock.setAttribute(

totalPriceBlock.setAttribute(

numericTotal;

item

Number(

item?.price

if (

}

return total +

);
},
0
);
}

Math.random()

);

/* =========================================
SAVE / LOAD
========================================= */
function saveOrderToStorage() {
normaliseBasketItemsForStableRendering();

try {
localStorage.setItem(
ORDER_STORAGE_KEY,
JSON.stringify(
{
version:5,
items:
state.orderItems,
customItems:
state.customOrderItems,
deliveryPostcode:
state.deliveryPostcode,
deliveryFee:
state.deliveryFee,
deliveryResolved:
state.deliveryResolved,
deliveryRequiresQuote:
state.deliveryRequiresQuote,
deliveryQuoteReason:
state.deliveryQuoteReason,
deliveryAdjustedMiles:
state.deliveryAdjustedMiles,
deliveryChargeableMiles:
state.deliveryChargeableMiles
}
)
);
}
catch (
error
) {
console.warn(
"Unable to save order locally.",
error
);
}
}

function loadOrderFromStorage() {
try {
const stored =
localStorage.getItem(
ORDER_STORAGE_KEY
);

if (
!stored
) {
state.orderItems =
[];

state.customOrderItems =
[];

setDeliveryPending(
""
);

state.basketTotal =
0;

return;
}

const parsed =
JSON.parse(
stored
);

const rawItems =
Array.isArray(
parsed
)
?
parsed
:
(
Array.isArray(
parsed?.items
)
?
parsed.items
:
[]
);

const rawCustomItems =
Array.isArray(
parsed?.customItems
)
?
parsed.customItems
:
[];

state.orderItems =
rawItems
.map(
sanitizeStoredOrderItem
)
.filter(
Boolean
);

state.customOrderItems =
rawCustomItems
.map(
sanitizeStoredCustomOrderItem
)
.filter(
Boolean
);

normaliseBasketItemsForStableRendering();

const restoredPostcode =
String(
parsed?.deliveryPostcode ||
state.orderItems[0]?.deliveryPostcode ||
state.customOrderItems[0]?.deliveryPostcode ||
""
);

setDeliveryPending(
restoredPostcode
);

state.basketTotal =
calculateOrderTotal();

/*
Persist any newly-created stable IDs so
older version-5 baskets are migrated once
rather than receiving a new identity on
every page load.
*/
saveOrderToStorage();
}
catch (
error
) {
state.orderItems =
[];

state.customOrderItems =
[];

setDeliveryPending(
""
);

state.basketTotal =
0;

console.warn(
"Unable to restore saved order.",
error
);
}
}

function getBasketDrawerItemKey(
item,
kind,
index
) {
const itemId =
ensureBasketOrderItemId(
item,
kind
);

if (
itemId
) {
return (
kind +
":" +
itemId
);
}

/*
Emergency legacy fallback only.

return [
kind,
index,
item?.size,
item?.width,
item?.length
].join(
":"
);

value

return String(
value ||
"item"

);

/* =========================================
BASKET ITEM EXPAND / COLLAPSE
========================================= */
function toggleBasketDrawerItem(
toggleButton
) {
if (
!toggleButton
) {
return;
}

const item =
toggleButton.closest(
".basket-drawer-item"
);

if (
!item
) {
return;
}

const collapse =
item.querySelector(
"[data-basket-item-collapse]"
);

if (
!collapse
) {
return;
}

const itemKey =
String(
item.dataset.basketItemKey ||
""
);

const shouldExpand =
!item.classList.contains(
"is-expanded"
);

item.classList.toggle(
"is-expanded",
shouldExpand
);

item
.querySelectorAll(
"[data-basket-item-toggle]"
)
.forEach(
button => {
button.setAttribute(
"aria-expanded",
String(
shouldExpand
)
);

if (
button.classList.contains(
"basket-drawer-item-expand-strip"
)
) {
button.setAttribute(
"aria-label",
shouldExpand
?
"Collapse full unit summary"
:
"Expand full unit summary"
);
}
}
);

collapse.hidden =
!shouldExpand;

collapse.setAttribute(
"aria-hidden",
String(
!shouldExpand
)
);

if (
itemKey
) {
if (
shouldExpand
) {
basketDrawerExpandedItems.add(
itemKey
);
}
else {
basketDrawerExpandedItems.delete(
itemKey
);
}
}
}

if (

return Array.from(

).filter(

function cancelPendingOrderPageAutoScrolls() {
if (
addToOrderScrollTimer !==
null
) {
clearTimeout(

);

addToOrderScrollTimer =
null;
}

if (
customAddToOrderScrollTimer !==
null
) {
clearTimeout(
customAddToOrderScrollTimer
);

customAddToOrderScrollTimer =
null;
}

if (
activeScrollFrame !==
null
) {
cancelAnimationFrame(
activeScrollFrame
);

activeScrollFrame =
null;
}
}

function lockBasketPageScroll() {
cancelPendingOrderPageAutoScrolls();

basketDrawerScrollY =
window.scrollY ||
document.documentElement.scrollTop ||
0;

basketDrawerPreviousBodyStyles = {
position:
document.body.style.position,
top:
document.body.style.top,
left:
document.body.style.left,
right:
document.body.style.right,
width:
document.body.style.width,
overflow:
document.body.style.overflow
};

document.body.classList.add(
"basket-drawer-open"
);

document.body.style.position =
"fixed";

document.body.style.top =
`-${basketDrawerScrollY}px`;

document.body.style.left =
"0";

document.body.style.right =
"0";

document.body.style.width =
"100%";

document.body.style.overflow =
"hidden";
}

function unlockBasketPageScroll() {
const exactScrollY =
Math.max(
0,
Number(
basketDrawerScrollY
) || 0
);

document.body.classList.remove(
"basket-drawer-open"
);

if (
basketDrawerPreviousBodyStyles
) {
document.body.style.position =
basketDrawerPreviousBodyStyles.position;

document.body.style.top =
basketDrawerPreviousBodyStyles.top;

document.body.style.left =
basketDrawerPreviousBodyStyles.left;

document.body.style.right =
basketDrawerPreviousBodyStyles.right;

document.body.style.width =
basketDrawerPreviousBodyStyles.width;

document.body.style.overflow =
basketDrawerPreviousBodyStyles.overflow;
}
else {
document.body.style.position =
"";

document.body.style.top =
"";

document.body.style.left =
"";

document.body.style.right =
"";

document.body.style.width =
"";

document.body.style.overflow =
"";
}

/*
Restore the exact position captured before
the basket opened.
*/
window.scrollTo(
0,
exactScrollY
);

/*
Some mobile browsers complete the fixed-body
release on the next paint. Reassert the same
position once, without any animation.
*/
window.requestAnimationFrame(
() => {
if (
!basketDrawerIsOpen
) {
window.scrollTo(
0,
exactScrollY
);
}
}
);

basketDrawerPreviousBodyStyles =
null;
}

function getBasketDrawerFocusableElements() {
if (
!basketDrawerPanel

return Array.from(
basketDrawerPanel.querySelectorAll(

"input:not([disabled])",
"select:not([disabled])",
"textarea:not([disabled])",
"a[href]",
"[tabindex]:not([tabindex='-1'])"
].join(
","
)
)
).filter(
element => {
return !element.hasAttribute(
"hidden"
) &&
element.offsetParent !==
null;
}
);

restoreFocus = true

function adjustBasketDrawerItemQuantity(
kind,
itemId,
change,
fallbackIndex = null
) {
const collection =
getBasketCollection(
kind
);

const index =
getBasketItemIndexById(
kind,
itemId,
fallbackIndex
);

if (
index <
0 ||
index >=
collection.length
) {
return;
}

const item =
collection[
index
];

ensureBasketOrderItemId(
item,
kind
);

const currentQuantity =
Math.max(
1,
Math.min(
999,
Math.floor(
Number(
item?.quantity ??
item?.qty
) || 1
)
)
);

const nextQuantity =
Math.max(
1,
Math.min(
999,
currentQuantity +
change
)
);

if (
nextQuantity ===
currentQuantity
) {
return;
}

item.quantity =
nextQuantity;

item.qty =
nextQuantity;

commitBasketDrawerMutation();
}

function removeBasketDrawerItem(
kind,
itemId,
fallbackIndex = null
) {
const collection =
getBasketCollection(
kind
);

const index =
getBasketItemIndexById(
kind,
itemId,
fallbackIndex
);

if (
index <
0 ||
index >=
collection.length
) {
return;
}

const removedItem =
collection[
index
];

const removedItemKey =
getBasketDrawerItemKey(
removedItem,
kind,
index
);

basketDrawerExpandedItems.delete(
removedItemKey
);

collection.splice(
index,
1
);

commitBasketDrawerMutation();
}

const removeButton =

);

if (
removeButton
) {

removeBasketDrawerItem(

),
String(
removeButton.dataset.basketItemId ||
""
),
Number(
removeButton.dataset.basketIndex
)
);

return;
}

const quantityButton =
event.target.closest(
"[data-basket-quantity-action]"
);

if (
quantityButton
) {
event.preventDefault();

event.stopPropagation();

const action =
quantityButton.dataset.basketQuantityAction;

adjustBasketDrawerItemQuantity(
String(
quantityButton.dataset.basketKind ||
"standard"
),
String(
quantityButton.dataset.basketItemId ||
""
),
action ===
"increase"
?
1
:
-1,
Number(
quantityButton.dataset.basketIndex
)
);

return;
}
}
);

basketDrawerLayer.addEventListener(
"input",
event => {
const input =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
!input
) {
return;
}

input.value =
String(
input.value ||
""
)
.toUpperCase();

input.classList.remove(
"is-invalid"
);

invalidateDeliveryLookup();

document
.querySelectorAll(
"[data-delivery-postcode-input]"
)
.forEach(
otherInput => {
otherInput.value =
input.value;

otherInput.classList.remove(
"is-invalid"
);
}
);

setDeliveryPending(
input.value
);

state.basketTotal =
calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals(
{
animateBasket:false
}
);

clearDeliveryOutputVisuals();

updateBasketDrawerSummaryOnly();

scheduleDeliveryPostcodeLookup(
input.value
);
}
);

basketDrawerLayer.addEventListener(
"change",
event => {
const input =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
!input
) {
return;
}

applyDeliveryPostcode(
input.value
);
}
);

basketDrawerLayer.addEventListener(
"keydown",
event => {
const input =
event.target.closest(
"[data-basket-delivery-postcode-input]"
);

if (
input &&
event.key ===
"Enter"
) {
event.preventDefault();

applyDeliveryPostcode(
input.value
);
}
}
);
}

if (
basketDrawerClose
) {
basketDrawerClose.addEventListener(
"click",
event => {
event.preventDefault();

event.stopPropagation();

closeBasketDrawer();
}
);
}

document.addEventListener(
"keydown",
event => {
if (
!basketDrawerIsOpen
) {
return;
}

if (
event.key ===
"Escape"
) {
event.preventDefault();

closeBasketDrawer();

return;
}

if (
event.key !==
"Tab"
) {
return;
}

const focusableElements =
getBasketDrawerFocusableElements();

if (
!focusableElements.length
) {
event.preventDefault();

basketDrawerPanel?.focus(
{
preventScroll:true
}
);

return;
}

const first =
focusableElements[0];

const last =
focusableElements[
focusableElements.length -
1
];

if (
event.shiftKey &&
document.activeElement ===
first
) {
event.preventDefault();

last.focus();

return;
}

if (
!event.shiftKey &&
document.activeElement ===
last
) {
event.preventDefault();

first.focus();
}
}
);

function getElementViewportCentreTarget(
element
) {
const rect =
element.getBoundingClientRect();

return Math.max(
0,
window.scrollY +
rect.top +
(
rect.height /
2
) -
(
window.innerHeight /
2
)
);
}

function getElementViewportRatioTarget(
element,
ratio = .40
) {
if (
!element
) {
return window.scrollY;
}

const rect =
element.getBoundingClientRect();

return Math.max(
0,
window.scrollY +
rect.top -
(
window.innerHeight *
Number(
ratio
)
)
);
}

function scrollElementToViewportCentre(
element
) {
if (
!element
) {
return;
}

window.scrollTo(
{
top:
getElementViewportCentreTarget(
element
),
behavior:
reducedMotionQuery.matches
?
"auto"
:
"smooth"
}
);
}

function animateScrollToTarget(
target,
duration = 560
) {
if (
activeScrollFrame !==
null
) {
cancelAnimationFrame(
activeScrollFrame
);

activeScrollFrame =
null;
}

if (
reducedMotionQuery.matches
) {
window.scrollTo(
0,
target
);

return;
}

const start =
window.scrollY;

const distance =
target -
start;

if (
Math.abs(
distance
) <
2
) {
window.scrollTo(
0,
target
);

return;
}

const startTime =
performance.now();

function easeInOutCubic(
progress
) {
return progress <
.5
?
4 *
progress *
progress *
progress
:
1 -
Math.pow(
-2 *
progress +
2,
3
) /
2;
}

function step(
time
) {
const elapsed =
time -
startTime;

const progress =
Math.min(
1,
elapsed /
duration
);

const eased =
easeInOutCubic(
progress
);

window.scrollTo(
0,
start +
distance *
eased
);

if (
progress <
1
) {
activeScrollFrame =
requestAnimationFrame(
step
);
}
else {
activeScrollFrame =
null;
}
}

activeScrollFrame =
requestAnimationFrame(
step
);
}

function animateElementToViewportCentre(
element,
duration = 560
) {
if (
!element
) {
return;
}

animateScrollToTarget(
getElementViewportCentreTarget(
element
),
duration
);
}

function animateElementToViewportRatio(
element,
ratio = .40,
duration = 560
) {
if (
!element
) {
return;
}

animateScrollToTarget(
getElementViewportRatioTarget(
element,
ratio
),
duration
);
}

function loadStateFromQuery() {

if (

params.get(
"width"
)
);

Number(
params.get(
"length"
)
);

if (
Number.isFinite(
width
)
&&
Number.isFinite(
length
)
) {
size =
`${width}x${length}`;
}
}

const glazing =
String(
params.get(
"glazing"
)
||
""
)
.toLowerCase();

const type =
String(
params.get(
"type"
)
||
""
)
.toLowerCase();

const border =
Number(
params.get(
"border"
)
);

const tint =
normalizeTint(
params.get(
"finish"
)
??
params.get(
"tint"
)
);

const source =
String(
params.get(
"source"
)
||
""
)
.toLowerCase();

const importedPriceRaw =
String(
params.get(
"price"
)
??
""
)
.trim();

const importedPriceNumber =
Number(
importedPriceRaw
.replace(
/£|,/g,
""
)
);

const importedPrice =
importedPriceRaw !==
"" &&
Number.isFinite(
importedPriceNumber
) &&
importedPriceNumber >
0
?
importedPriceNumber
:
null;

const importedImage =
String(
params.get(
"image"
)
||
""
);

if (
size &&
PRODUCTS[
size
]
) {
state.size =
size;
}

if (
[
"double",
"triple"
]
.includes(
glazing
)
) {
state.glazing =
glazing;
}

if (
[
"toughened",
"laminated"
]
.includes(
type
)
) {
state.type =
type;
}
else if (
source ===
"homepage"
) {
state.type =
"toughened";
}

if (
[
100,
125,
150
]
.includes(
border
)
) {
state.border =
border;
}
else if (
source ===
"homepage"
) {
state.border =
100;

state.tint =
tint;

if (
source ===
"homepage"
) {

"homepage",

state.size,

state.glazing,
type:
state.type,

state.border,

}
}

/* =========================================
HOMEPAGE ARRIVAL FOCUS
========================================= */
function readHomepageOrderFocusRequest() {
const params =
new URLSearchParams(
location.search
);

let storedFocus =
null;

try {
const stored =
sessionStorage.getItem(
HOMEPAGE_ORDER_FOCUS_KEY
);

if (
stored
) {
const parsed =
JSON.parse(
stored
);

if (
parsed &&
typeof parsed ===
"object"
) {
storedFocus =
parsed;
}
}
}
catch (
error
) {
storedFocus =
null;
}

const source =
String(
storedFocus?.source ||
params.get(
"source"
) ||
""
)
.toLowerCase();

const type =
String(
storedFocus?.type ||
""
)
.toLowerCase();

const focus =
String(
params.get(
"focus"
) ||
""
)
.toLowerCase();

const id =
String(
storedFocus?.id ||
params.get(
"customId"
) ||
""
);

const viewportOffsetRaw =
Number(
storedFocus?.viewportOffset ??
params.get(
"viewportOffset"
)
);

const topRatioRaw =
Number(
storedFocus?.topRatio ??
(
Number(
params.get(
"top"
)
) /
100
)
);

const topRatio =
Number.isFinite(
viewportOffsetRaw
) &&
viewportOffsetRaw >
0 &&
viewportOffsetRaw <
1
?
viewportOffsetRaw
:
(
Number.isFinite(
topRatioRaw
) &&
topRatioRaw >
0 &&
topRatioRaw <
1
?
topRatioRaw
:
.40
);

return {
source:
source,
type:
type,
focus:
focus,
id:
id,
center:
storedFocus?.center !==
false,
animate:
storedFocus?.animate !==
false,
topRatio:
topRatio
};
}

function consumeHomepageOrderFocusRequest() {
try {
sessionStorage.removeItem(
HOMEPAGE_ORDER_FOCUS_KEY
);
}
catch (
error
) {
}

const currentUrl =
new URL(
window.location.href
);

currentUrl.searchParams.delete(
"focus"
);

currentUrl.searchParams.delete(
"customId"
);

currentUrl.searchParams.delete(
"top"
);

currentUrl.searchParams.delete(
"viewportOffset"
);

history.replaceState(
{},
"",
currentUrl.pathname +
(
currentUrl.searchParams.toString()
?
"?" +
currentUrl.searchParams.toString()
:
""
)
+
currentUrl.hash
);
}

const revealElements =

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {
revealElements.forEach(
element => {
element.classList.add(
"is-visible"
);
}
);
}
else {
const revealObserver =
new IntersectionObserver(
entries => {
entries.forEach(
entry => {
if (
!entry.isIntersecting
) {
return;
}

entry.target.classList.add(
"is-visible"
);

revealObserver.unobserve(
entry.target
);
}
);
},
{
threshold:.14,
rootMargin:"0px 0px -7% 0px"
}
);

revealElements.forEach(
element => {
revealObserver.observe(
element
);
}
);
}

/* =========================================
CUSTOM CALCULATOR LIMITS

These are configurator dimension rules only.

MAXIMUM LENGTH UPDATED:
2500mm → 3000mm

Existing width / long-length rules remain:
- width 290–1500
- length 290–3000
- lengths >2000 require width >=500
========================================= */
const CUSTOM_CALCULATOR_MIN_WIDTH =
290;

const CUSTOM_CALCULATOR_MAX_WIDTH =
1500;

const CUSTOM_CALCULATOR_MIN_LENGTH =
290;

const CUSTOM_CALCULATOR_MAX_LENGTH =
3000;

const CUSTOM_CALCULATOR_LONG_LENGTH =
2000;

const CUSTOM_CALCULATOR_LONG_MIN_WIDTH =
500;

/* =========================================
CUSTOM DIMENSION VALIDATION
========================================= */
function customDimensionsAreValid(
width,
length
) {
const safeWidth =
Number(
width
);

const safeLength =
Number(
length
);

if (
!Number.isFinite(
safeWidth
) ||
!Number.isFinite(
safeLength
)
) {
return false;
}

if (
safeWidth <
CUSTOM_CALCULATOR_MIN_WIDTH ||
safeWidth >
CUSTOM_CALCULATOR_MAX_WIDTH
) {
return false;
}

if (
safeLength <
CUSTOM_CALCULATOR_MIN_LENGTH ||
safeLength >
CUSTOM_CALCULATOR_MAX_LENGTH
) {
return false;
}

if (
safeLength >
CUSTOM_CALCULATOR_LONG_LENGTH &&
safeWidth <
CUSTOM_CALCULATOR_LONG_MIN_WIDTH
) {
return false;
}

return true;
}

function customInputsAreValid() {
return customDimensionsAreValid(
customState.width,
customState.length
);
}

/* =========================================
CALCULATE ANY CUSTOM SELECTION

FactoryRooflightsMasterPricing is now the
only selling-price source for custom units.
========================================= */
function calculateCustomPriceForSelection(
selection
) {
if (
!customDimensionsAreValid(
selection?.width,
selection?.length
)
) {
return null;
}

const result =
getMasterCustomPriceResult(
{
width:
selection.width,
length:
selection.length,
glazing:
selection.glazing,
type:
selection.type,
finish:
selection.tint ??
selection.finish,
border:
selection.border
}
);

if (
!result.available
) {
return null;
}

const price =
Number(
result.price
);

return (
Number.isFinite(
price
) &&
price >
0
)
?
price
:
null;
}

function selectedCustomPrice() {
return calculateCustomPriceForSelection(
{
width:
customState.width,
length:
customState.length,
glazing:
customState.glazing,
type:
customState.type,
tint:
customState.tint,
border:
customState.border
}
);
}

"1";

customAddToOrderText.textContent =
`Add ${customState.quantity} To Order`;

customAddToOrder.disabled =
!hasPrice;

if (
!hasPrice
) {
clearCustomPriceDisplay();

return;
}

customInternalSize.textContent =
formatCustomDimension(
customState.width,
customState.length
);

const external =
getExternalDimensionsFor(
`${customState.width}x${customState.length}`,
customState.border
);

customExternalSize.textContent =
formatCustomDimension(
external.width,
external.length
);

const unitPriceParts =
moneyParts(
unitPrice
);

customPriceWhole.textContent =
unitPriceParts.whole;

customPricePence.textContent =
unitPriceParts.pence;

const customUnitPriceLineElement =
document.getElementById(
"customUnitPriceLine"
);

if (
customUnitPriceLineElement
) {
customUnitPriceLineElement.style.visibility =
"visible";

customUnitPriceLineElement.setAttribute(
"aria-label",
`Custom unit price ${formatMoney(unitPrice)} including VAT`
);

const pound =
customUnitPriceLineElement.querySelector(
".price-pound"
);

const dot =
customUnitPriceLineElement.querySelector(
".price-dot"
);

if (
pound
) {
pound.textContent =
"£";
}

if (
dot
) {
dot.textContent =
".";
}
}

customVatLine.textContent =
"inc. vat";

customVatLine.style.visibility =
"visible";

if (
customState.quantity >
1
) {
const totalPrice =
unitPrice *
customState.quantity;

const totalPriceParts =
moneyParts(
totalPrice
);

customTotalPriceWhole.textContent =
totalPriceParts.whole;

customTotalPricePence.textContent =
totalPriceParts.pence;

const totalPound =
customTotalPriceBlock.querySelector(
".total-price-pound"
);

const totalDot =
customTotalPriceBlock.querySelector(
".price-dot"
);

if (
totalPound
) {
totalPound.textContent =
"£";
}

if (
totalDot
) {
totalDot.textContent =
".";
}

customTotalPriceBlock.style.visibility =
"visible";

customTotalPriceBlock.hidden =
false;

customTotalPriceBlock.setAttribute(
"aria-hidden",
"false"
);

customTotalPriceBlock.classList.add(
"is-visible"
);

if (
customVatLine.parentElement !==
customTotalPriceBlock
) {
customTotalPriceBlock.appendChild(
customVatLine
);
}
}
else {
customTotalPriceBlock.classList.remove(
"is-visible"
);

customTotalPriceBlock.hidden =
true;

customTotalPriceBlock.setAttribute(
"aria-hidden",
"true"
);

if (
customVatLine.parentElement !==
customUnitPriceBlock
) {
customUnitPriceBlock.appendChild(
customVatLine
);
}
}
}

Updated for the new 3000mm maximum length.

1500×3000 is explicitly verified as valid.
The >2000mm / minimum-500mm-width rule is
preserved.
========================================= */
function validateCustomCalculatorDimensions() {
const dimensionTests = [
{
width:290,
length:2000,
expected:true
},
{
width:499,
length:2000,
expected:true
},
{
width:499,
length:2001,
expected:false
},
{
width:500,
length:2001,
expected:true
},
{
width:1500,
length:3000,
expected:true
},
{
width:500,
length:3000,
expected:true
},
{
width:499,
length:3000,
expected:false
},
{
width:1501,
length:2000,
expected:false
},
{
width:500,
length:3001,
expected:false
}
];

dimensionTests.forEach(
test => {
const actual =
customDimensionsAreValid(
test.width,
test.length
);

if (
actual !==
test.expected
) {
console.warn(
"Custom calculator dimension check failed:",
test,
actual
);
}
}
);
}

},

type:"laminated",

min:6,
max:8
},
{
type:"laminated",
tint:"blue",
min:8,
max:10
}
];

checks.forEach(

getLeadTimeForSelection(

);

) {

);
