/* =========================================
ESTIMATED DELIVERY MASTER
========================================= */

function getLeadTimeForSelection(selection) {
const type = selection?.type === "laminated"
? "laminated"
: "toughened";

const tint = normalizeTint(
selection?.tint ?? selection?.finish
);

if (type === "laminated") {
return tint === "clear"
? { min: 6, max: 8 }
: { min: 8, max: 10 };
}

if (tint === "clear") {
return { min: 4, max: 6 };
}

if (tint === "blue") {
return { min: 8, max: 10 };
}

return { min: 6, max: 8 };
}

function getCurrentLeadTime() {
return getLeadTimeForSelection(state);
}

function getBasketLeadTime() {
const items = getAllBasketItems();

if (!items.length) {
return getCurrentLeadTime();
}

return items.reduce(
(current, item) => {
const leadTime = getLeadTimeForSelection(item);

return {
min: Math.max(current.min, leadTime.min),
max: Math.max(current.max, leadTime.max)
};
},
{ min: 0, max: 0 }
);
}

function getBasketEstimatedDeliveryText() {
return (
getEstimatedDeliveryTextForLeadTime(
getBasketLeadTime()
).replace(" - ", " to ") + "."
);
}

function updateEstimatedDelivery() {
if (estimatedDeliveryRange) {
const nextText =
getEstimatedDeliveryTextForLeadTime(
getCurrentLeadTime()
);

const changed =
estimatedDeliveryRange.textContent.trim() !==
nextText;

estimatedDeliveryRange.textContent = nextText;

if (!hasAnimatedEstimatedDelivery || changed) {
animateEstimatedDelivery();
hasAnimatedEstimatedDelivery = true;
}
}

const basketRange = document.querySelector(
"[data-basket-estimated-delivery-range]"
);

if (basketRange) {
basketRange.textContent =
getBasketEstimatedDeliveryText();
}
}

SHARED DELIVERY MASTER INTEGRATION

let deliveryLookupToken = 0;
let deliveryLookupTimer = null;

function getFactoryRooflightsMasterDeliveryRates() {
const delivery = globalThis.MasterDeliveryRates;

return delivery && typeof delivery === "object"
? delivery
: null;
}

function normalizePostcode(postcode) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (typeof delivery?.normalizePostcode === "function") {
try {
return delivery.normalizePostcode(postcode);
} catch (error) {
console.warn("Postcode normalisation unavailable.", error);
}
}

return String(postcode || "")
.trim()
.toUpperCase()
.replace(/\s+/g, "");
}

function formatPostcode(postcode) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (typeof delivery?.formatPostcode === "function") {
try {
return delivery.formatPostcode(postcode);
} catch (error) {
console.warn("Postcode formatting unavailable.", error);
}
}

return String(postcode || "")
.trim()
.toUpperCase();
}

function isCompleteUKPostcode(postcode) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (
!delivery ||
typeof delivery.isCompleteUKPostcode !== "function"
) {
return false;
}

try {
return delivery.isCompleteUKPostcode(postcode) === true;
} catch (error) {
return false;
}
}

function getDeliveryCategoryForSize(size) {

getFactoryRooflightsMasterDeliveryRates();

) {

}

function getDeliveryCategoryForCustomDimensions(width, length) {

);

function getAllBasketItems() {
return [
...state.orderItems,
...state.customOrderItems
];
}

function createUnavailableMasterDeliveryResult(
postcode,
reasonCode = "MASTER_DELIVERY_UNAVAILABLE",
reason =
"Delivery pricing is temporarily unavailable. Please contact us for a delivery quotation."
) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

return {
status: "MASTER_UNAVAILABLE",
available: false,
requiresQuote: true,
reasonCode,
reason,
originPostcode:
delivery?.DELIVERY_CONFIG?.originPostcode ?? null,
postcode: formatPostcode(postcode),
straightLineMiles: null,
adjustedMiles: null,
chargeableMiles: null,
categorySummary: [],
groups: [],
deliveryCharge: null,
pricing: null,
estimatedDelivery: null
};
}

function getResolvedDeliveryContributionForItem(targetItem) {
if (
!state.deliveryResolved ||
state.deliveryRequiresQuote
) {
return null;
}

const miles = Number(state.deliveryChargeableMiles);

if (!Number.isFinite(miles)) {
return null;
}

const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (
!delivery ||
typeof delivery.getResolvedDeliveryContributionForItem !==
"function"
) {
return null;
}

try {
const contribution =
delivery.getResolvedDeliveryContributionForItem(
getAllBasketItems(),
targetItem,
miles
);

const amount = Number(contribution);

return Number.isFinite(amount)
? Math.max(0, amount)
: null;
} catch (error) {
console.warn(
"Master per-item delivery contribution unavailable.",
error
);

return null;
}
}

function invalidateDeliveryLookup() {
deliveryLookupToken += 1;

if (deliveryLookupTimer !== null) {
clearTimeout(deliveryLookupTimer);
deliveryLookupTimer = null;
}
}

async function calculatePostcodeDelivery(postcode) {
const delivery =
getFactoryRooflightsMasterDeliveryRates();

if (
!delivery ||
typeof delivery.calculateDelivery !== "function"
) {
return createUnavailableMasterDeliveryResult(postcode);
}

try {
const result = await delivery.calculateDelivery({
postcode,
items: getAllBasketItems(),
currentSelection: state,
normalizeTint,
getEstimatedDeliveryTextForLeadTime
});

if (!result || typeof result !== "object") {
return createUnavailableMasterDeliveryResult(
postcode,
"INVALID_MASTER_DELIVERY_RESULT"
);
}

return result;
} catch (error) {
console.warn(
"Master delivery calculation unavailable.",
error
);

return createUnavailableMasterDeliveryResult(
postcode,
"MASTER_DELIVERY_ERROR"
);
}
}

function getCurrentDeliveryFee() {
if (
!state.deliveryResolved ||
state.deliveryRequiresQuote
) {
return 0;
}

const fee = Number(state.deliveryFee);

return Number.isFinite(fee) && fee >= 0
? fee
: 0;
}

function setDeliveryPending(postcode) {
const formatted = formatPostcode(postcode);

state.deliveryPostcode = formatted;
state.deliveryFee = null;
state.deliveryResolved = false;
state.deliveryRequiresQuote = false;
state.deliveryQuoteReason = "";
state.deliveryAdjustedMiles = null;
state.deliveryChargeableMiles = null;

getAllBasketItems().forEach(item => {
item.deliveryPostcode = formatted;
item.deliveryFee = null;
item.deliveryResolved = false;
item.deliveryRequiresQuote = false;
});
}

function updateAllDeliveryItems(postcode, masterResult) {
const formatted = formatPostcode(postcode);

const requiresQuote =
masterResult?.requiresQuote === true ||
masterResult?.status === "QUOTE_REQUIRED";

const available =
masterResult?.status === "AVAILABLE" &&
masterResult?.available === true &&
!requiresQuote;

const fee = available
? Number(masterResult?.deliveryCharge)
: null;

const validFee =
available &&
Number.isFinite(fee) &&
fee >= 0;

state.deliveryPostcode = formatted;
state.deliveryFee = validFee ? fee : null;
state.deliveryResolved = validFee;
state.deliveryRequiresQuote =
requiresQuote || !validFee;

state.deliveryQuoteReason =
state.deliveryRequiresQuote
? String(
masterResult?.reason ||
"Delivery quotation required."
)
: "";

const adjustedMiles = masterResult?.adjustedMiles;

state.deliveryAdjustedMiles =
adjustedMiles !== null &&
adjustedMiles !== undefined &&
Number.isFinite(Number(adjustedMiles))
? Number(adjustedMiles)
: null;

const chargeableMiles = masterResult?.chargeableMiles;

state.deliveryChargeableMiles =
chargeableMiles !== null &&
chargeableMiles !== undefined &&
Number.isFinite(Number(chargeableMiles))
? Number(chargeableMiles)
: null;

state.orderItems.forEach(item => {
const category = getDeliveryCategoryForSize(item.size);

if (category) {
item.deliveryCategory = category;
}

item.deliveryPostcode = formatted;
item.deliveryFee = state.deliveryFee;
item.deliveryResolved = state.deliveryResolved;
item.deliveryRequiresQuote =
state.deliveryRequiresQuote;
});

state.customOrderItems.forEach(item => {
const category =
getDeliveryCategoryForCustomDimensions(
item.width,
item.length
);

if (category) {
item.deliveryCategory = category;
}

item.deliveryPostcode = formatted;
item.deliveryFee = state.deliveryFee;
item.deliveryResolved = state.deliveryResolved;
item.deliveryRequiresQuote =
state.deliveryRequiresQuote;
});
}

function getDeliveryDisplayForItem(item) {
const postcode =
String(state.deliveryPostcode || "").trim();

if (!postcode) {
return {
resolved: false,
requiresQuote: false,
fee: null
};
}

if (state.deliveryRequiresQuote) {
return {
resolved: true,
requiresQuote: true,
fee: null
};
}

if (
state.deliveryResolved &&
state.deliveryFee !== null &&
Number.isFinite(Number(state.deliveryFee))
) {
const contribution =
getResolvedDeliveryContributionForItem(item);

return {
resolved: true,
requiresQuote: false,
fee:
contribution !== null &&
Number.isFinite(Number(contribution))
? Math.max(0, Number(contribution))
: Math.max(0, Number(state.deliveryFee))
};
}

return {
resolved: false,
requiresQuote: false,
fee: null
};
}

function playDeliveryResolutionAnimation() {
deliveryAnimationToken += 1;

const token = deliveryAnimationToken;

clearDeliveryAnimationTimers();

const blocks = getVisibleSummaryTotalBlocks();

if (reducedMotionQuery.matches) {
showSummaryTotalsImmediately();
return;
}

const results = Array.from(
document.querySelectorAll(
".order-summary-delivery-inline-price.is-resolved"
)
);

results.forEach(result => {

deliveryResultTimer = setTimeout(() => {
if (token !== deliveryAnimationToken) {
return;
}

blocks.forEach(block => {

"delivery-total-hidden",
"delivery-total-enter"
);

void block.offsetWidth;

block.classList.add("delivery-total-enter");
});

deliveryTotalTimer = setTimeout(() => {
if (token !== deliveryAnimationToken) {
return;
}

blocks.forEach(block => {
block.classList.remove("delivery-total-enter");
});

deliveryTotalTimer = null;
}, 1050);

deliveryResultTimer = null;
}, 620);
}

/* =========================================
MASTER PRODUCT PRICING
========================================= */

function getFactoryRooflightsMasterPricing() {
const pricing =
globalThis.FactoryRooflightsMasterPricing;

return pricing && typeof pricing === "object"
? pricing
: null;
}

function createUnavailableMasterPriceResult(
source,
reasonCode = "MASTER_PRICING_UNAVAILABLE"
) {
return {
available: false,
source,
reasonCode,
price: null
};
}

function normalizeMasterPricingResult(result, source) {
if (!result || result.available !== true) {
return {
...(result && typeof result === "object"
? result
: {}),
available: false,
source: result?.source || source,
price: null
};
}

const price = Number(result.price);

if (!Number.isFinite(price) || price <= 0) {
return {
...result,
available: false,
source: result.source || source,
price: null
};
}

return {
...result,
available: true,
source: result.source || source,
price
};
}

function normalizeSelfCleaningSelection(value) {
const normalized =
String(value ?? "").trim().toLowerCase();

return [
"yes",
"true",
"1",
"on"
].includes(normalized)
? "yes"
: "no";
}

function selfCleaningIsSelected(selection) {
return (
normalizeSelfCleaningSelection(
selection?.selfCleaning
) === "yes"
);
}

function normalizeSelfCleaningAddOnResult(result, source) {
if (
result !== null &&
result !== undefined &&
Number.isFinite(Number(result))
) {
const amount = Number(result);

return {
available: amount > 0,
source,
addOn: amount > 0 ? amount : null
};
}

if (!result || typeof result !== "object") {
return {
available: false,
source,
addOn: null
};
}

const candidates = [
result.addOn,
result.addon,
result.addOnPrice,
result.addonPrice,
result.selfCleaningAddOn,
result.selfCleaningAddon,
result.selfCleaningPrice,
result.surcharge,
result.amount,
result.price
];

const amount = candidates
.filter(
candidate =>
candidate !== null &&
candidate !== undefined &&
candidate !== ""
)
.map(Number)
.find(
candidate =>
Number.isFinite(candidate) &&
candidate > 0
);

if (!Number.isFinite(amount)) {
return {
...result,
available: false,
source: result.source || source,
addOn: null
};
}

return {
...result,
available: true,
source: result.source || source,
addOn: amount
};
}

function getStandardSelectionDimensions(selection) {
const size = normalizeSize(selection?.size);

const [width, length] =
size.split("x").map(Number);

return {
size,
width,
length
};
}

function buildMasterStandardPricingOptions(selection) {
const dimensions =
getStandardSelectionDimensions(selection);

return {
size: dimensions.size,
width: dimensions.width,
length: dimensions.length,
glazing:
selection?.glazing === "triple"
? "triple"
: "double",
type:
selection?.type === "laminated"
? "laminated"
: "toughened",
finish: normalizeTint(
selection?.tint ?? selection?.finish
),
border: Number(selection?.border)
};
}

function buildMasterCustomPricingOptions(selection) {
const width = Number(
selection?.width ?? selection?.internalWidth
);

const length = Number(
selection?.length ?? selection?.internalLength
);

return {
size: `${width}x${length}`,
width,
length,
internalWidth: width,
internalLength: length,
glazing:
selection?.glazing === "triple"
? "triple"
: "double",
type:
selection?.type === "laminated"
? "laminated"
: "toughened",
finish: normalizeTint(
selection?.tint ?? selection?.finish
),
border: Number(selection?.border)
};
}

function getMasterStandardBasePriceResult(selection) {
const pricing =
getFactoryRooflightsMasterPricing();

if (
!pricing ||
typeof pricing.getStandardPrice !== "function"
) {
return createUnavailableMasterPriceResult(
"standard"
);
}

try {
return normalizeMasterPricingResult(
pricing.getStandardPrice({
...buildMasterStandardPricingOptions(selection),
selfCleaning: false,
includeSelfCleaning: false,
selfCleaningSelected: false
}),
"standard"
);
} catch (error) {
console.warn(
"Master standard price unavailable.",
error
);

return createUnavailableMasterPriceResult(
"standard"
);
}
}

function getMasterCustomBasePriceResult(selection) {
const pricing =
getFactoryRooflightsMasterPricing();

if (
!pricing ||
typeof pricing.getCustomPrice !== "function"
) {
return createUnavailableMasterPriceResult(
"custom"
);
}

try {
return normalizeMasterPricingResult(
pricing.getCustomPrice({
...buildMasterCustomPricingOptions(selection),
selfCleaning: false,
includeSelfCleaning: false,
selfCleaningSelected: false
}),
"custom"
);
} catch (error) {
console.warn(
"Master custom price unavailable.",
error
);

return createUnavailableMasterPriceResult(
"custom"
);
}
}

function getDedicatedSelfCleaningMethod(pricing, source) {
if (!pricing) {
return null;
}

const names = source === "custom"
? [
"getCustomSelfCleaningPrice",
"getSelfCleaningPrice",
"getSelfCleaningAddOn",
"getSelfCleaningAddon"
]
: [
"getStandardSelfCleaningPrice",
"getSelfCleaningPrice",
"getSelfCleaningAddOn",
"getSelfCleaningAddon"
];

for (const name of names) {
if (typeof pricing[name] === "function") {
return {
name,
method: pricing[name]
};
}
}

return null;
}

function getMasterSelfCleaningAddOnResult(
selection,
source
) {
const pricing =
getFactoryRooflightsMasterPricing();

if (!pricing) {
return {
available: false,
source,
addOn: null,
reasonCode: "MASTER_PRICING_UNAVAILABLE"
};
}

const options = source === "custom"
? buildMasterCustomPricingOptions(selection)
: buildMasterStandardPricingOptions(selection);

const dedicated =
getDedicatedSelfCleaningMethod(pricing, source);

if (dedicated) {
try {
const result = dedicated.method.call(pricing, {
...options,
source,
custom: source === "custom",
selfCleaning: true,
includeSelfCleaning: true,
selfCleaningSelected: true
});

const normalized =
normalizeSelfCleaningAddOnResult(
result,
source
);

if (normalized.available) {
return normalized;
}
} catch (error) {
console.warn(
`Master ${source} Self Cleaning surcharge unavailable.`,
error
);
}
}

const productMethod = source === "custom"
? pricing.getCustomPrice
: pricing.getStandardPrice;

if (typeof productMethod !== "function") {
return {
available: false,
source,
addOn: null,
reasonCode:
"SELF_CLEANING_MASTER_METHOD_UNAVAILABLE"
};
}

try {
const without = normalizeMasterPricingResult(
productMethod.call(pricing, {
...options,
selfCleaning: false,
includeSelfCleaning: false,
selfCleaningSelected: false
}),
source
);

const withCleaning = normalizeMasterPricingResult(
productMethod.call(pricing, {
...options,
selfCleaning: true,
includeSelfCleaning: true,
selfCleaningSelected: true
}),
source
);

if (!without.available || !withCleaning.available) {
return {
available: false,
source,
addOn: null,
reasonCode: "SELF_CLEANING_PRICE_UNAVAILABLE"
};
}

const difference =
withCleaning.price - without.price;

if (
!Number.isFinite(difference) ||
difference <= 0
) {
return {
available: false,
source,
addOn: null,
reasonCode:
"SELF_CLEANING_SURCHARGE_NOT_RETURNED"
};
}

return {
available: true,
source,
addOn: difference
};
} catch (error) {
console.warn(
`Unable to obtain ${source} Self Cleaning surcharge.`,
error
);

return {
available: false,
source,
addOn: null,
reasonCode: "SELF_CLEANING_MASTER_ERROR"
};
}
}

function getMasterStandardPriceResult(selection) {
const base =
getMasterStandardBasePriceResult(selection);

if (!base.available) {
return base;
}

const basePrice = Number(base.price);

if (!selfCleaningIsSelected(selection)) {
return {
...base,
available: true,
basePrice,
selfCleaning: "no",
selfCleaningAddOn: 0,
price: basePrice
};
}

const surcharge =
getMasterSelfCleaningAddOnResult(
selection,
"standard"
);

if (!surcharge.available) {
return {
...base,
available: false,
price: null,
basePrice,
selfCleaning: "yes",
selfCleaningAddOn: null,
reasonCode:
surcharge.reasonCode ||
"SELF_CLEANING_PRICE_UNAVAILABLE"
};
}

const addOn = Number(surcharge.addOn);

return {
...base,
available: true,
basePrice,
selfCleaning: "yes",
selfCleaningAddOn: addOn,
price: basePrice + addOn
};
}

function getMasterCustomPriceResult(selection) {
const base =
getMasterCustomBasePriceResult(selection);

if (!base.available) {
return base;
}

const basePrice = Number(base.price);

if (!selfCleaningIsSelected(selection)) {
return {
...base,
available: true,
basePrice,
selfCleaning: "no",
selfCleaningAddOn: 0,
price: basePrice
};
}

const surcharge =
getMasterSelfCleaningAddOnResult(
selection,
"custom"
);

if (!surcharge.available) {
return {
...base,
available: false,
price: null,
basePrice,
selfCleaning: "yes",
selfCleaningAddOn: null,
reasonCode:
surcharge.reasonCode ||
"SELF_CLEANING_PRICE_UNAVAILABLE"
};
}

const addOn = Number(surcharge.addOn);

return {
...base,
available: true,
basePrice,
selfCleaning: "yes",
selfCleaningAddOn: addOn,
price: basePrice + addOn
};
}

price <= 0
);

}

state.customOrderItems.length > 0;

const deliveryFullyPriced =
state.deliveryResolved &&
!state.deliveryRequiresQuote &&
state.deliveryFee !== null &&

/* =========================================
APPLY POSTCODE
========================================= */

async function applyDeliveryPostcode(
postcode,
{ animate = true } = {}
) {
const cleaned = normalizePostcode(postcode);

const master =
getFactoryRooflightsMasterDeliveryRates();

if (
!master ||
typeof master.calculateDelivery !== "function" ||
typeof master.isCompleteUKPostcode !== "function"
) {
invalidateDeliveryLookup();

const unavailable =
createUnavailableMasterDeliveryResult(
cleaned
);

updateAllDeliveryItems(
unavailable.postcode || cleaned,
unavailable
);

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary({ animate: false });
renderCustomOrderSummary({ animate: false });

updateBasketDrawerSummaryOnly();

op2UpdateBasketHeaderTotal(
state.basketTotal
);

updateCheckoutAvailability();
showSummaryTotalsImmediately();
requestOrderSummaryDeliveryWidthSync();

return;
}

/*
Blank postcode is a normal pending state.

Do not remove any items, rebuild the basket,
or treat an empty postcode as permission to
clear saved basket data.
*/

if (!cleaned) {
invalidateDeliveryLookup();

setDeliveryPending("");

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals({
animateBasket: false
});

clearDeliveryOutputVisuals();
showSummaryTotalsImmediately();

return;
}

if (!isCompleteUKPostcode(cleaned)) {
invalidateDeliveryLookup();

setDeliveryPending(cleaned);

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals({
animateBasket: false
});

markDeliveryInputsInvalid();
showSummaryTotalsImmediately();

return;
}

deliveryLookupToken += 1;

const token = deliveryLookupToken;

if (deliveryLookupTimer !== null) {
clearTimeout(deliveryLookupTimer);
deliveryLookupTimer = null;
}

setDeliveryPending(cleaned);

if (animate) {
hideSummaryTotalsForDelivery();
}

markDeliveryInputsChecking(cleaned);

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals({
animateBasket: false
});

try {
const result =
await calculatePostcodeDelivery(cleaned);

if (token !== deliveryLookupToken) {
return;
}

if (
result?.status === "INVALID_POSTCODE" ||
result?.status === "POSTCODE_LOOKUP_FAILED"
) {
throw new Error(
String(
result?.reason ||
"Postcode not recognised"
)
);
}

updateAllDeliveryItems(
result?.postcode || cleaned,
result
);

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary({ animate: false });
renderCustomOrderSummary({ animate: false });

/*
Only update the basket delivery and total
fields here. Its product cards and expanded
summaries remain in place.
*/

updateBasketDrawerSummaryOnly();

op2UpdateBasketHeaderTotal(
state.basketTotal
);

updateCheckoutAvailability();
requestOrderSummaryDeliveryWidthSync();
updateEstimatedDelivery();

if (animate) {
playDeliveryResolutionAnimation();
} else {
showSummaryTotalsImmediately();
}
} catch (error) {
if (token !== deliveryLookupToken) {
return;
}

setDeliveryPending(cleaned);

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

renderOrderSummary({ animate: false });
renderCustomOrderSummary({ animate: false });

updateBasketDrawerSummaryOnly();

op2UpdateBasketHeaderTotal(
state.basketTotal
);

updateCheckoutAvailability();
markDeliveryInputsInvalid();
showSummaryTotalsImmediately();
requestOrderSummaryDeliveryWidthSync();
}
}

function scheduleDeliveryPostcodeLookup(postcode) {
if (deliveryLookupTimer !== null) {
clearTimeout(deliveryLookupTimer);
deliveryLookupTimer = null;
}

const cleaned = normalizePostcode(postcode);

if (!isCompleteUKPostcode(cleaned)) {
return;
}

const master =
getFactoryRooflightsMasterDeliveryRates();

const configuredDelay = Number(
master?.DELIVERY_CONFIG
?.integrationTimings
?.postcodeLookupDebounceMs
);

const delay =
Number.isFinite(configuredDelay)
? configuredDelay
: 550;

deliveryLookupTimer = setTimeout(() => {
deliveryLookupTimer = null;

applyDeliveryPostcode(cleaned);
}, delay);
}

function recalculateResolvedDelivery({
animate = false
} = {}) {
const postcode =
String(state.deliveryPostcode || "").trim();

if (!postcode) {
invalidateDeliveryLookup();

setDeliveryPending("");

state.basketTotal = calculateOrderTotal();

saveOrderToStorage();

refreshDisplayedBasketTotals({
animateBasket: false
});

updateBasketDrawerSummaryOnly();
updateEstimatedDelivery();

return Promise.resolve();
}

if (!getAllBasketItems().length) {
invalidateDeliveryLookup();

setDeliveryPending(postcode);

state.basketTotal = 0;

saveOrderToStorage();

refreshDisplayedBasketTotals({
animateBasket: false
});

renderBasketDrawer();
updateEstimatedDelivery();

return Promise.resolve();
}

return applyDeliveryPostcode(postcode, {
animate
});
}

imported.type === state.type &&
imported.border === state.border &&
imported.tint === state.tint &&
normalizeSelfCleaningSelection(

) === normalizeSelfCleaningSelection(

);

const imported = state.homepageImport;

imported &&
imported.image &&
imported.size === state.size &&
imported.tint === state.tint
);
}

function getTintedProductFilename(baseFilename, tint) {
const normalized = normalizeTint(tint);

if (normalized === "clear") {
return baseFilename;
}

const base =
TINT_IMAGE_BASE_FALLBACKS[baseFilename] ||
baseFilename;

const prefix =
TINT_IMAGE_PREFIX[normalized] || "";

return `${prefix}${base}`;
}

homepageImageMatchesCurrentSelection()
) {

)
);

/* =========================================
PRODUCT IMAGE FINISH ADJUSTMENTS
========================================= */

function getProductImageFinishAdjustment() {
const adjustment =
PRODUCT_IMAGE_FINISH_ADJUSTMENTS[
state.size
]?.[state.tint];

if (!adjustment) {
return {
scale: 0,
left: 0,
leftPx: 0,
topPx: 0
};
}

return {
scale: Number(adjustment.scale) || 0,
left: Number(adjustment.left) || 0,
leftPx: Number(adjustment.leftPx) || 0,
topPx: Number(adjustment.topPx) || 0
};
}

function getProductImageScale() {
const base =
Number(
PRODUCT_IMAGE_SCALE_ADJUSTMENTS[
state.size
] || 0
);

const finish =
getProductImageFinishAdjustment();

return (
PRODUCT_IMAGE_BASE_SCALE *
(1 + (base + finish.scale) / 100)
);
}

function getProductImageLeft() {
return getProductImageFinishAdjustment().left;
}

function getProductImageLeftPx() {
return getProductImageFinishAdjustment().leftPx;
}

function getProductImageTopPx() {
return getProductImageFinishAdjustment().topPx;
}

function getProductImageRotation() {
return Number(
PRODUCT_IMAGE_ROTATIONS[state.size] || 0
);
}

function updateProductImageTransform() {
const scale = getProductImageScale();

const hoverScale =
scale * PRODUCT_IMAGE_HOVER_RATIO;

productImage.style.setProperty(
"--product-image-scale",
scale.toFixed(4)
);

productImage.style.setProperty(
"--product-image-hover-scale",
hoverScale.toFixed(4)
);

productImage.style.setProperty(
"--product-image-rotation",
`${getProductImageRotation()}deg`
);

productImage.style.setProperty(
"--product-image-left",
`${getProductImageLeft()}%`
);

productImage.style.setProperty(
"--product-image-left-px",
`${getProductImageLeftPx()}px`
);

productImage.style.setProperty(
"--product-image-top",
`${getProductImageTopPx()}px`
);

productImage.style.objectFit =
PRODUCT_IMAGE_OBJECT_FIT[state.size] ||
"contain";
}

function setProductImage(
imageSource,
altText,
animate = false
) {
if (!imageSource) {
return;
}

productImage.alt = altText;

imageTransitionToken += 1;

const token = imageTransitionToken;

if (imageFadeTimer !== null) {
clearTimeout(imageFadeTimer);
imageFadeTimer = null;
}

if (!animate || reducedMotionQuery.matches) {
productImage.classList.remove(
"image-fade-out"
);

if (
productImage.getAttribute("src") !==
imageSource
) {
productImage.src = imageSource;
}

return;
}

productImage.classList.add("image-fade-out");

imageFadeTimer = setTimeout(() => {
if (token !== imageTransitionToken) {
return;
}

const current =
productImage.getAttribute("src") || "";

if (current === imageSource) {
requestAnimationFrame(() => {
if (token === imageTransitionToken) {
productImage.classList.remove(
"image-fade-out"
);
}
});

return;
}

const preloader = new Image();

const reveal = () => {
if (token !== imageTransitionToken) {
return;
}

productImage.src = imageSource;
productImage.alt = altText;

requestAnimationFrame(() => {
requestAnimationFrame(() => {
if (token === imageTransitionToken) {
productImage.classList.remove(
"image-fade-out"
);
}
});
});
};

preloader.onload = reveal;
preloader.onerror = reveal;
preloader.src = imageSource;
}, 140);
}

/* =========================================
STANDARD PRICE / MONEY DISPLAY
========================================= */

function selectedPrice() {
if (!PRODUCTS[state.size]) {
return null;
}

const result =
getMasterStandardPriceResult(state);

return result.available
? result.price
: null;
}

function moneyParts(value) {
const [whole, pence] =
Number(value).toFixed(2).split(".");

return {
whole: Number(whole).toLocaleString("en-GB"),
pence
};
}

function setUnitPriceText(value) {
const parts = moneyParts(value);

priceWhole.textContent = parts.whole;
pricePence.textContent = parts.pence;
}

function updateUnitPrice(value) {
const numeric = Number(value);

if (
!Number.isFinite(numeric) ||
numeric <= 0
) {
return;
}

if (displayedUnitPriceAmount === null) {
setUnitPriceText(numeric);
displayedUnitPriceAmount = numeric;
return;
}

if (displayedUnitPriceAmount === numeric) {
return;
}

unitPriceTransitionToken += 1;

const token = unitPriceTransitionToken;

if (unitPriceTransitionTimer !== null) {
clearTimeout(unitPriceTransitionTimer);
unitPriceTransitionTimer = null;
}

if (reducedMotionQuery.matches) {
setUnitPriceText(numeric);
displayedUnitPriceAmount = numeric;

unitPriceLine.classList.remove(
"is-changing"
);

return;
}

unitPriceLine.classList.add("is-changing");

unitPriceTransitionTimer = setTimeout(() => {
if (token !== unitPriceTransitionToken) {
return;
}

setUnitPriceText(numeric);
displayedUnitPriceAmount = numeric;

unitPriceLine.classList.remove(
"is-changing"
);
}, 160);
}

function setTotalPriceText(value) {
const parts = moneyParts(value);

totalPriceWhole.textContent = parts.whole;
totalPricePence.textContent = parts.pence;
}

function animateTotalPriceValue(value) {
const numeric = Number(value);

if (displayedTotalAmount === numeric) {
return;
}

totalPriceTransitionToken += 1;

const token = totalPriceTransitionToken;

if (totalPriceTransitionTimer !== null) {
clearTimeout(totalPriceTransitionTimer);
totalPriceTransitionTimer = null;
}

if (reducedMotionQuery.matches) {
setTotalPriceText(numeric);
displayedTotalAmount = numeric;

totalPriceLine.classList.remove(
"is-changing"
);

return;
}

totalPriceLine.classList.add("is-changing");

totalPriceTransitionTimer = setTimeout(() => {
if (token !== totalPriceTransitionToken) {
return;
}

setTotalPriceText(numeric);
displayedTotalAmount = numeric;

totalPriceLine.classList.remove(
"is-changing"
);
}, 160);
}

function updateTotalPrice(orderTotal, showTotal) {
const numeric = Number(orderTotal);

totalVisibilityToken += 1;

const token = totalVisibilityToken;

if (totalVisibilityTimer !== null) {
clearTimeout(totalVisibilityTimer);
totalVisibilityTimer = null;
}

if (!showTotal) {
displayedTotalAmount = null;
totalPriceTransitionToken += 1;

if (totalPriceTransitionTimer !== null) {
clearTimeout(totalPriceTransitionTimer);
totalPriceTransitionTimer = null;
}

totalPriceLine.classList.remove(
"is-changing"
);

totalPriceBlock.setAttribute(
"aria-hidden",
"true"
);

if (totalPriceBlock.hidden) {
setTotalPriceText(numeric);
return;
}

if (reducedMotionQuery.matches) {
totalPriceBlock.classList.remove(
"is-visible"
);

totalPriceBlock.hidden = true;

setTotalPriceText(numeric);
return;
}

totalPriceBlock.classList.remove(
"is-visible"
);

totalVisibilityTimer = setTimeout(() => {
if (token !== totalVisibilityToken) {
return;
}

totalPriceBlock.hidden = true;
setTotalPriceText(numeric);
}, 160);

return;
}

totalPriceBlock.setAttribute(
"aria-hidden",
"false"
);

if (totalPriceBlock.hidden) {
setTotalPriceText(numeric);

displayedTotalAmount = numeric;
totalPriceBlock.hidden = false;

totalPriceLine.classList.remove(
"is-changing"
);

if (reducedMotionQuery.matches) {
totalPriceBlock.classList.add(
"is-visible"
);

return;
}

requestAnimationFrame(() => {
if (token !== totalVisibilityToken) {
return;
}

requestAnimationFrame(() => {
if (token !== totalVisibilityToken) {
return;
}

totalPriceBlock.classList.add(
"is-visible"
);
});
});

return;
}

totalPriceBlock.classList.add("is-visible");

if (displayedTotalAmount === null) {
setTotalPriceText(numeric);
displayedTotalAmount = numeric;
return;
}

animateTotalPriceValue(numeric);
}

function updateVatPosition() {
if (
!vatLine ||
!unitPriceBlock ||
!totalPriceBlock
) {
return;
}

if (state.quantity > 1) {
if (vatLine.parentElement !== totalPriceBlock) {
totalPriceBlock.appendChild(vatLine);
}
} else if (
vatLine.parentElement !== unitPriceBlock
) {
unitPriceBlock.appendChild(vatLine);
}
}

function clearStandardPriceDisplay() {
displayedUnitPriceAmount = null;
displayedTotalAmount = null;

unitPriceTransitionToken += 1;
totalPriceTransitionToken += 1;
totalVisibilityToken += 1;

if (unitPriceTransitionTimer !== null) {
clearTimeout(unitPriceTransitionTimer);
unitPriceTransitionTimer = null;
}

if (totalPriceTransitionTimer !== null) {
clearTimeout(totalPriceTransitionTimer);
totalPriceTransitionTimer = null;
}

if (totalVisibilityTimer !== null) {
clearTimeout(totalVisibilityTimer);
totalVisibilityTimer = null;
}

if (priceWhole) {
priceWhole.textContent = "";
}

if (pricePence) {
pricePence.textContent = "";
}

if (unitPriceLine) {
unitPriceLine.classList.remove(
"is-changing"
);

unitPriceLine.style.visibility = "hidden";

unitPriceLine.setAttribute(
"aria-label",
"Unit price unavailable"
);
}

if (totalPriceWhole) {
totalPriceWhole.textContent = "";
}

if (totalPricePence) {
totalPricePence.textContent = "";
}

if (totalPriceLine) {
totalPriceLine.classList.remove(
"is-changing"
);
}

if (totalPriceBlock) {
totalPriceBlock.classList.remove(
"is-visible"
);

totalPriceBlock.hidden = true;

totalPriceBlock.setAttribute(
"aria-hidden",
"true"
);
}

if (vatLine) {
vatLine.style.visibility = "hidden";
}
}

function showStandardPriceDisplay() {
if (unitPriceLine) {
unitPriceLine.style.visibility = "visible";
}

if (vatLine) {
vatLine.style.visibility = "visible";
}
}

function clearCustomPriceDisplay() {
[
customPriceWhole,
customPricePence,
customTotalPriceWhole,
customTotalPricePence
].forEach(element => {
if (element) {
element.textContent = "";
}
});

const line =
document.getElementById(
"customUnitPriceLine"
);

if (line) {
line.style.visibility = "hidden";

line.setAttribute(
"aria-label",
"Custom unit price unavailable"
);
}

if (customVatLine) {
customVatLine.style.visibility = "hidden";
}

if (customTotalPriceBlock) {
customTotalPriceBlock.hidden = true;

customTotalPriceBlock.classList.remove(
"is-visible"
);

customTotalPriceBlock.setAttribute(
"aria-hidden",
"true"
);
}
}

tintCaption.classList.toggle(
"visible",
state.tint !== "clear"
);
}

/* =========================================
QUERY STRING
========================================= */

function updateQueryString() {
const existing =
new URLSearchParams(location.search);

const source =
String(existing.get("source") || "")
.toLowerCase();

const focus =
String(existing.get("focus") || "")
.toLowerCase();

const customItemId = String(
existing.get("customItemId") ||
existing.get("customId") ||
""
);

const viewportOffset = String(
existing.get("viewportOffset") || ""
);

const preserveCustomHandoff =
source === "homepage-custom-order" &&
(
focus === "custom-order-summary" ||
Boolean(customItemId)
);

const params = new URLSearchParams();

params.set("size", state.size);
params.set("glazing", state.glazing);
params.set("type", state.type);
params.set("border", String(state.border));
params.set("finish", state.tint);

params.set(
"selfCleaning",
normalizeSelfCleaningSelection(
state.selfCleaning
)
);

if (state.selfCleaning === "yes") {
const surcharge =
getMasterSelfCleaningAddOnResult(
state,
"standard"
);

if (surcharge.available) {
params.set(
"selfCleaningAddOn",
Number(surcharge.addOn).toFixed(2)
);
}
}

if (
state.homepageImport?.source === "homepage"
) {
params.set("source", "homepage");

if (
homepageImportMatchesCurrentSelection() &&
Number.isFinite(
state.homepageImport.price
) &&
state.homepageImport.price > 0
) {
params.set(
"price",
String(state.homepageImport.price)
);
}

if (homepageImageMatchesCurrentSelection()) {
params.set(
"image",
state.homepageImport.image
);
}
}

if (preserveCustomHandoff) {
params.set("source", "homepage-custom-order");
params.set("focus", "custom-order-summary");

if (customItemId) {
params.set("customItemId", customItemId);
}

if (viewportOffset) {
params.set(
"viewportOffset",
viewportOffset
);
}
}

history.replaceState(
{},
"",
`${location.pathname}?${params.toString()}${location.hash}`
);
}

/* =========================================
SIZE DROPDOWN
========================================= */

function getSizeOptionButtons() {
return Array.from(
sizeDropdownList.querySelectorAll(
".size-dropdown-option"
)
);
}

function getSelectedSizeOptionIndex() {
const options = getSizeOptionButtons();

const index = options.findIndex(
button => button.dataset.size === state.size
);

return index >= 0 ? index : 0;
}

function populateSizes() {
const sizes = SIZE_DROPDOWN_ORDER.filter(
size => Boolean(PRODUCTS[size])
);

sizeDropdownList.innerHTML = sizes
.map(size => `
<button
type="button"
class="size-dropdown-option"
data-size="${size}"
role="option"
aria-selected="false"
tabindex="-1"
>
${formatSizeDropdownValue(size)}
</button>
`)
.join("");

getSizeOptionButtons().forEach(button => {
button.addEventListener("click", event => {
event.stopPropagation();

selectSizeFromDropdown(
button.dataset.size
);
});
});
}

function updateSizeDropdownDisplay() {
sizeDropdownValue.textContent =
formatSizeDropdownValue(state.size);

getSizeOptionButtons().forEach(button => {
const selected =
button.dataset.size === state.size;

button.classList.toggle(
"is-selected",
selected
);

button.setAttribute(
"aria-selected",
String(selected)
);
});
}

function updateSizeDropdownAvailableHeight() {
if (
!sizeDropdownPanel ||
!sizeDropdownList ||
!unitSummarySection
) {
return;
}

const panelRect =
sizeDropdownPanel.getBoundingClientRect();

const summaryRect =
unitSummarySection.getBoundingClientRect();

const minimum =
window.innerWidth <= 720
? 218
: 286;

const available = Math.max(
minimum,
Math.floor(
summaryRect.bottom -
panelRect.top -
2
)
);

sizeDropdownList.style.maxHeight =
`${available}px`;
}

function positionCurrentSizeAtTop() {
if (!sizeDropdownList) {
return;
}

const options = getSizeOptionButtons();

if (!options.length) {
return;
}

const index =
getSelectedSizeOptionIndex();

const selected = options[index];

sizeDropdownKeyboardIndex = index;

sizeDropdownList.style.paddingBottom = "0px";

const maximum = Math.max(
0,
sizeDropdownList.scrollHeight -
sizeDropdownList.clientHeight
);

sizeDropdownList.scrollTop = Math.min(
selected.offsetTop,
maximum
);
}

function openSizeDropdown() {
if (
!sizeDropdown ||
!sizeDropdownList
) {
return;
}

closeEmailAction();
closeWhatsAppAction();
closeCustomBuildDropdowns();

sizeDropdown.classList.add("is-open");

sizeDropdownTrigger.setAttribute(
"aria-expanded",
"true"
);

void sizeDropdownPanel.offsetHeight;

updateSizeDropdownAvailableHeight();
positionCurrentSizeAtTop();
}

function closeSizeDropdown(returnFocus = false) {
if (
!sizeDropdown ||
!sizeDropdownTrigger
) {
return;
}

const wasOpen =
sizeDropdown.classList.contains("is-open");

sizeDropdown.classList.remove("is-open");

sizeDropdownTrigger.setAttribute(
"aria-expanded",
"false"
);

if (returnFocus && wasOpen) {
sizeDropdownTrigger.focus();
}
}

function toggleSizeDropdown() {
if (sizeDropdown.classList.contains("is-open")) {
closeSizeDropdown();
} else {
openSizeDropdown();
}
}

function selectSizeFromDropdown(size) {
const newSize = normalizeSize(size);

if (!PRODUCTS[newSize]) {
return;
}

const changed = newSize !== state.size;

state.size = newSize;

if (changed) {
state.quantity = 1;
}

closeSizeDropdown(true);

updateUI({
animateImage: changed
});
}

function focusSizeDropdownOption(index) {
const options = getSizeOptionButtons();

if (!options.length) {
return;
}

sizeDropdownKeyboardIndex = Math.max(
0,
Math.min(index, options.length - 1)
);

const target =
options[sizeDropdownKeyboardIndex];

target.focus({ preventScroll: true });

target.scrollIntoView({
block: "nearest"
});
}

sizeDropdownTrigger.addEventListener(
"click",
event => {
event.stopPropagation();
toggleSizeDropdown();
}
);

sizeDropdownTrigger.addEventListener(
"keydown",
event => {
if (
event.key === "ArrowDown" ||
event.key === "ArrowUp"
) {
event.preventDefault();

if (
!sizeDropdown.classList.contains(
"is-open"
)
) {
openSizeDropdown();
}

focusSizeDropdownOption(
getSelectedSizeOptionIndex()
);
}

if (event.key === "Escape") {
event.preventDefault();
closeSizeDropdown();
}
}
);

sizeDropdownList.addEventListener(
"keydown",
event => {
const options = getSizeOptionButtons();

if (!options.length) {
return;
}

const activeIndex = options.indexOf(
document.activeElement
);

if (activeIndex >= 0) {
sizeDropdownKeyboardIndex = activeIndex;
}

if (event.key === "ArrowDown") {
event.preventDefault();

focusSizeDropdownOption(
sizeDropdownKeyboardIndex + 1
);

return;
}

if (event.key === "ArrowUp") {
event.preventDefault();

focusSizeDropdownOption(
sizeDropdownKeyboardIndex - 1
);

return;
}

if (event.key === "Home") {
event.preventDefault();
focusSizeDropdownOption(0);
return;
}

if (event.key === "End") {
event.preventDefault();

focusSizeDropdownOption(
options.length - 1
);

return;
}

if (
event.key === "Enter" ||
event.key === " "
) {
const active = document.activeElement;

if (
active?.classList.contains(
"size-dropdown-option"
)
) {
event.preventDefault();

selectSizeFromDropdown(
active.dataset.size
);
}

return;
}

if (event.key === "Escape") {
event.preventDefault();
closeSizeDropdown(true);
}
}
);

window.addEventListener("resize", () => {
if (
sizeDropdown?.classList.contains("is-open")
) {
updateSizeDropdownAvailableHeight();
positionCurrentSizeAtTop();
}

requestCustomSummaryColumnSync();
requestOrderSummaryDeliveryWidthSync();
});

/* =========================================
ORDER TOTALS
========================================= */

function op2GetSafeItemQuantity(item) {
return Math.max(
1,
Math.min(
999,
Math.floor(
Number(
item?.quantity ?? item?.qty
) || 1
)
)
);
}

function op2GetSafeItemPrice(item) {
const value =
item?.unitPrice ?? item?.price;

const price = Number(value);

return Number.isFinite(price) && price > 0
? price
: 0;
}

function calculateStandardProductSubtotal() {
return state.orderItems.reduce(
(total, item) =>
total +
op2GetSafeItemPrice(item) *
op2GetSafeItemQuantity(item),
0
);
}

function calculateCustomProductSubtotal() {
return state.customOrderItems.reduce(
(total, item) =>
total +
op2GetSafeItemPrice(item) *
op2GetSafeItemQuantity(item),
0
);
}

function calculateStandardOrderTotal() {
return state.orderItems.length
? calculateOrderTotal()
: 0;
}

function calculateCustomOrderTotal() {
return state.customOrderItems.length
? calculateOrderTotal()
: 0;
}

function calculateOrderTotal() {
const hasItems =
getAllBasketItems().length > 0;

return (
calculateStandardProductSubtotal() +
calculateCustomProductSubtotal() +
(
hasItems
? getCurrentDeliveryFee()
: 0
)
);
}

/* =========================================
STABLE BASKET ITEM IDENTITIES
========================================= */

function createBasketOrderItemId(prefix = "item") {
const safePrefix =
String(prefix || "item")
.replace(/[^a-z0-9_-]/gi, "") ||
"item";

if (
window.crypto &&
typeof window.crypto.randomUUID ===
"function"
) {
return (
safePrefix +
"-" +
window.crypto.randomUUID()
);
}

return (
safePrefix +
"-" +
Date.now() +
"-" +
Math.random().toString(36).slice(2, 10) +
"-" +
Math.random().toString(36).slice(2, 8)
);
}

function createStandardOrderItemId() {
return createBasketOrderItemId("standard");
}

function createCustomOrderItemId() {
return createBasketOrderItemId("custom");
}

function ensureBasketOrderItemId(
item,
kind = "standard"
) {
if (!item || typeof item !== "object") {
return "";
}

let id =
String(item.id ?? item._id ?? "").trim();

if (!id) {
id = kind === "custom"
? createCustomOrderItemId()
: createStandardOrderItemId();
}

item.id = id;
item._id = id;

return id;
}

function getBasketCollection(kind) {
return kind === "custom"
? state.customOrderItems
: state.orderItems;
}

function getBasketItemIndexById(
kind,
itemId,
fallbackIndex = null
) {
const collection = getBasketCollection(kind);
const id = String(itemId || "");

if (id) {
const found = collection.findIndex(
item =>
String(item?.id ?? item?._id ?? "") ===
id
);

if (found >= 0) {
return found;
}

/*
A supplied ID that no longer exists must
not accidentally mutate another item using
a stale array index.
*/

return -1;
}

if (
Number.isInteger(fallbackIndex) &&
fallbackIndex >= 0 &&
fallbackIndex < collection.length
) {
return fallbackIndex;
}

return -1;
}

/* =========================================
NON-DESTRUCTIVE BASKET NORMALISATION

CRITICAL CHANGE:

An unavailable master price must NEVER
make a valid basket item disappear.

The saved unit price is retained if it
exists. If no price can be recovered,
the item remains visible at price 0 and
checkout stays disabled.

No replacement price is invented.
========================================= */

function op2ReadStoredUnitPrice(item) {
const candidates = [
item?.unitPrice,
item?.price,
item?.unitPriceIncVat,
item?.unitPriceIncVAT,
item?.priceIncVat,
item?.priceIncVAT,
item?.configuredPrice
];

for (const candidate of candidates) {
if (
candidate === null ||
candidate === undefined ||
candidate === ""
) {
continue;
}

const cleaned =
typeof candidate === "string"
? candidate.replace(/[£,\s]/g, "")
: candidate;

const price = Number(cleaned);

if (
Number.isFinite(price) &&
price > 0
) {
return price;
}
}

const quantity =
op2GetSafeItemQuantity(item);

const totals = [
item?.lineTotal,
item?.totalPrice,
item?.subtotal,
item?.total
];

for (const candidate of totals) {
if (
candidate === null ||
candidate === undefined ||
candidate === ""
) {
continue;
}

const cleaned =
typeof candidate === "string"
? candidate.replace(/[£,\s]/g, "")
: candidate;

const total = Number(cleaned);

if (
Number.isFinite(total) &&
total > 0
) {
return total / quantity;
}
}

return 0;
}

function op2GetStoredValue(item, keys) {
for (const key of keys) {
const value = item?.[key];

if (
value !== null &&
value !== undefined &&
String(value).trim() !== ""
) {
return value;
}
}

const configuration = item?.configuration;

if (
configuration &&
typeof configuration === "object"
) {
for (const key of keys) {
const value = configuration[key];

if (
value !== null &&
value !== undefined &&
String(value).trim() !== ""
) {
return value;
}
}
}

return "";
}

function getPossibleStandardSizeFromItem(item) {
const size = normalizeSize(
op2GetStoredValue(item, [
"size",
"productSize"
])
);

if (PRODUCTS[size]) {
return size;
}

const width = Math.floor(
Number(
op2GetStoredValue(item, [
"width",
"internalWidth"
])
)
);

const length = Math.floor(
Number(
op2GetStoredValue(item, [
"length",
"internalLength"
])
)
);

if (
Number.isFinite(width) &&
Number.isFinite(length)
) {
const candidate = normalizeSize(
`${width}x${length}`
);

if (PRODUCTS[candidate]) {
return candidate;
}
}

return "";
}

function op2GetCustomDimensionsFromItem(item) {
let width = Number(
op2GetStoredValue(item, [
"width",
"internalWidth"
])
);

let length = Number(
op2GetStoredValue(item, [
"length",
"internalLength"
])
);

if (
!Number.isFinite(width) ||
!Number.isFinite(length) ||
width <= 0 ||
length <= 0
) {
const sizeText = String(
op2GetStoredValue(item, [
"size",
"internalSize",
"dimensions"
])
);

const match = sizeText.match(
/(\d{3,4})\s*(?:mm)?\s*[x×]\s*(\d{3,4})/i
);

if (match) {
width = Number(match[1]);
length = Number(match[2]);
}
}

return {
width: Math.floor(width),
length: Math.floor(length)
};
}

function op2GetBasketConfiguration(item) {
const glazingInput = String(
op2GetStoredValue(item, [
"glazing",
"glazingConfiguration",
"glazingType",
"glazingValue"
])
).toLowerCase();

const glazing = glazingInput.includes("triple")
? "triple"
: "double";

const typeInput = String(
op2GetStoredValue(item, [
"type",
"glazingConstruction",
"glassType",
"construction",
"glazingValue"
])
).toLowerCase();

const type = typeInput.includes("laminated")
? "laminated"
: "toughened";

const borderInput = Number(
op2GetStoredValue(item, [
"border",
"borderSize",
"borderMm"
])
);

const border = [100, 125, 150].includes(
borderInput
)
? borderInput
: 100;

const tint = normalizeTint(
op2GetStoredValue(item, [
"tint",
"finish",
"glassFinish"
])
);

const selfCleaningValue =
op2GetStoredValue(item, [
"selfCleaning",
"selfCleaningSelected",
"includeSelfCleaning",
"selfCleaningOption"
]);

return {
glazing,
type,
border,
tint,
selfCleaning:
normalizeSelfCleaningSelection(
selfCleaningValue
)
};
}

function op2UpdateBasketItemFields(
item,
kind,
dimensions,
configuration,
priceResult
) {
const id = ensureBasketOrderItemId(
item,
kind
);

const quantity =
op2GetSafeItemQuantity(item);

/*
Read the previous price BEFORE overwriting
any fields.
*/

const retainedPrice =
op2ReadStoredUnitPrice(item);

const masterPrice =
priceResult?.available === true
? Number(priceResult.price)
: null;

const hasMasterPrice =
masterPrice !== null &&
Number.isFinite(masterPrice) &&
masterPrice > 0;

const unitPrice = hasMasterPrice
? masterPrice
: retainedPrice;

const {
glazing,
type,
border,
tint,
selfCleaning
} = configuration;

const size =
`${dimensions.width}x${dimensions.length}`;

item.id = id;
item._id = id;

item.size = size;
item.width = dimensions.width;
item.length = dimensions.length;
item.internalWidth = dimensions.width;
item.internalLength = dimensions.length;

item.glazing = glazing;
item.glazingConfiguration = glazing;
item.glazingType = glazing;

item.type = type;
item.glazingConstruction = type;
item.glassType = type;

item.border = border;
item.borderSize = border;
item.borderMm = border;

item.tint = tint;
item.finish = tint;
item.glassFinish = tint;

item.selfCleaning = selfCleaning;
item.selfCleaningSelected =
selfCleaning === "yes";

item.includeSelfCleaning =
selfCleaning === "yes";

item.quantity = quantity;
item.qty = quantity;

item.unitPrice = unitPrice;
item.price = unitPrice;

item.unitPriceIncVat = unitPrice;
item.unitPriceIncVAT = unitPrice;
item.priceIncVat = unitPrice;
item.priceIncVAT = unitPrice;
item.configuredPrice = unitPrice;

if (
hasMasterPrice &&
Number.isFinite(
Number(priceResult.selfCleaningAddOn)
)
) {
item.selfCleaningAddOn =
selfCleaning === "yes"
? Number(priceResult.selfCleaningAddOn)
: 0;
} else if (selfCleaning === "no") {
item.selfCleaningAddOn = 0;
}

delete item.priceCategory;

if (kind === "custom") {
item.source = String(
item.source || "custom"
).toLowerCase();

item.kind = "custom";
item.isCustom = true;
item.custom = true;

item.glazingValue = `${type}-${glazing}`;

item.internalSize =
`${dimensions.width}mm × ${dimensions.length}mm`;

item.externalWidth =
dimensions.width + border * 2;

item.externalLength =
dimensions.length + border * 2;

item.externalSize =
`${item.externalWidth}mm × ${item.externalLength}mm`;

item.externalDimensions =
item.externalSize;

const category =
getDeliveryCategoryForCustomDimensions(
dimensions.width,
dimensions.length
);

if (category) {
item.deliveryCategory = category;
}
} else {
const category =
getDeliveryCategoryForSize(size);

if (category) {
item.deliveryCategory = category;
}
}

/*
Mark unpriced items without deleting them.
Checkout validation will prevent payment
until their price can be resolved.
*/

item.priceRequiresRefresh = !(
Number.isFinite(unitPrice) &&
unitPrice > 0
);

return item;
}

function normaliseStandardBasketItemForRender(item) {
if (!item || typeof item !== "object") {
return null;
}

const size =
getPossibleStandardSizeFromItem(item);

if (!size) {
/*
Do not silently delete unknown stored
objects here. Storage preservation is
handled independently below.
*/
return null;
}

const [width, length] =
size.split("x").map(Number);

const configuration =
op2GetBasketConfiguration(item);

ensureBasketOrderItemId(
item,
"standard"
);

const selection = {
size,
...configuration
};

let priceResult = null;

try {
priceResult =
getMasterStandardPriceResult(selection);
} catch (error) {
console.warn(
"Master price refresh failed; saved standard item retained.",
error
);
}

return op2UpdateBasketItemFields(
item,
"standard",
{ width, length },
configuration,
priceResult
);
}

function normaliseCustomBasketItemForRender(item) {
if (!item || typeof item !== "object") {
return null;
}

const dimensions =
op2GetCustomDimensionsFromItem(item);

if (
!customDimensionsAreValid(
dimensions.width,
dimensions.length
)
) {
return null;
}

const configuration =
op2GetBasketConfiguration(item);

ensureBasketOrderItemId(
item,
"custom"
);

let priceResult = null;

try {
priceResult =
getMasterCustomPriceResult({
width: dimensions.width,
length: dimensions.length,
...configuration
});
} catch (error) {
console.warn(
"Master price refresh failed; saved custom item retained.",
error
);
}

return op2UpdateBasketItemFields(
item,
"custom",
dimensions,
configuration,
priceResult
);
}

function normaliseBasketItemsForStableRendering() {
/*
IMPORTANT:

Do not replace the arrays with
.map(...).filter(Boolean).

That was the destructive path.

Valid items are updated in place. A failure
to normalise one object must not remove it
or any other rooflight.
*/

[
["standard", state.orderItems],
["custom", state.customOrderItems]
].forEach(([kind, collection]) => {
collection.forEach(item => {
if (
!item ||
typeof item !== "object"
) {
return;
}

ensureBasketOrderItemId(item, kind);

try {
if (kind === "custom") {
normaliseCustomBasketItemForRender(item);
} else {
normaliseStandardBasketItemForRender(item);
}
} catch (error) {
console.warn(
"Basket item retained after normalisation error.",
error
);
}
});
});
}

/* =========================================
NON-DESTRUCTIVE STORAGE SANITISING
========================================= */

function sanitizeStoredOrderItem(item) {
if (!item || typeof item !== "object") {
return null;
}

ensureBasketOrderItemId(
item,
"standard"
);

/*
Keep a separate copy so an unsuccessful
normalisation does not damage the original
parsed object.
*/

const copy = { ...item };

try {
const result =
normaliseStandardBasketItemForRender(
copy
);

return result || item;
} catch (error) {
console.warn(
"Stored standard item retained after restoration error.",
error
);

return item;
}
}

function sanitizeStoredCustomOrderItem(item) {
if (!item || typeof item !== "object") {
return null;
}

ensureBasketOrderItemId(
item,
"custom"
);

const copy = { ...item };

try {
const result =
normaliseCustomBasketItemForRender(
copy
);

return result || item;
} catch (error) {
console.warn(
"Stored custom item retained after restoration error.",
error
);

return item;
}
}

/* =========================================
SAVE / LOAD

CRITICAL:
LOADING DOES NOT SAVE.

A PAGE LOAD, BACK NAVIGATION, STORAGE EVENT
OR BASKET OPEN MUST NEVER OVERWRITE THE
SHARED BASKET WITH AN INCOMPLETE COPY.
========================================= */

function saveOrderToStorage() {
normaliseBasketItemsForStableRendering();

const payload = {
version: 6,
items: state.orderItems,
customItems: state.customOrderItems,
deliveryPostcode: state.deliveryPostcode,
deliveryFee: state.deliveryFee,
deliveryResolved: state.deliveryResolved,
deliveryRequiresQuote:
state.deliveryRequiresQuote,
deliveryQuoteReason:
state.deliveryQuoteReason,
deliveryAdjustedMiles:
state.deliveryAdjustedMiles,
deliveryChargeableMiles:
state.deliveryChargeableMiles
};

try {
localStorage.setItem(
ORDER_STORAGE_KEY,
JSON.stringify(payload)
);
} catch (error) {
console.warn(
"Unable to save order locally.",
error
);
}
}

function loadOrderFromStorage() {
let stored;

try {
stored =
localStorage.getItem(ORDER_STORAGE_KEY);
} catch (error) {
console.warn(
"Unable to access saved basket.",
error
);

return;
}

if (!stored) {
state.orderItems = [];
state.customOrderItems = [];

setDeliveryPending("");

state.basketTotal = 0;

return;
}

let parsed;

try {
parsed = JSON.parse(stored);
} catch (error) {
/*
Preserve the current live basket.
Never overwrite malformed storage with
an empty basket.
*/

console.warn(
"Saved basket could not be parsed. Storage has not been overwritten.",
error
);

return;
}

if (
!parsed ||
(
typeof parsed !== "object" &&
!Array.isArray(parsed)
)
) {
console.warn(
"Saved basket has an unexpected format. Storage has not been overwritten."
);

return;
}

const rawItems = Array.isArray(parsed)
? parsed
: (
Array.isArray(parsed.items)
? parsed.items
: (
Array.isArray(parsed.orderItems)
? parsed.orderItems
: []
)
);

const rawCustomItems =
Array.isArray(parsed.customItems)
? parsed.customItems
: [];

const standardItems = [];
const customItems = [];

/*
Restore each item independently.

An exception affecting one rooflight cannot
wipe the rest of the basket.
*/

rawItems.forEach(item => {
if (
!item ||
typeof item !== "object"
) {
return;
}

try {
const restored =
sanitizeStoredOrderItem(item);

if (restored) {
standardItems.push(restored);
}
} catch (error) {
console.warn(
"Standard basket item retained after restoration error.",
error
);

standardItems.push(item);
}
});

rawCustomItems.forEach(item => {
if (
!item ||
typeof item !== "object"
) {
return;
}

try {
const restored =
sanitizeStoredCustomOrderItem(item);

if (restored) {
customItems.push(restored);
}
} catch (error) {
console.warn(
"Custom basket item retained after restoration error.",
error
);

customItems.push(item);
}
});

state.orderItems = standardItems;
state.customOrderItems = customItems;

/*
Respect an intentionally blank postcode.

Do not restore a stale postcode from one
item if the shared payload explicitly
contains deliveryPostcode: "".
*/

const hasStoredPostcode =
!Array.isArray(parsed) &&
Object.prototype.hasOwnProperty.call(
parsed,
"deliveryPostcode"
);

const postcode = hasStoredPostcode
? String(parsed.deliveryPostcode || "")
: String(
standardItems[0]?.deliveryPostcode ||
customItems[0]?.deliveryPostcode ||
""
);

setDeliveryPending(postcode);

state.basketTotal =
calculateOrderTotal();

/*
NO saveOrderToStorage() HERE.

This is the central fix preventing page
restoration from destroying basket data.
*/
}

/* =========================================
DISPLAY NAMES / MATCHING
========================================= */

function getGlazingDisplayName(glazing) {
return glazing === "triple"
? "Triple Glazed"
: "Double Glazed";
}

function getTypeDisplayName(type) {
return type === "laminated"
? "Laminated"
: "Toughened";
}

function getTintDisplayName(tint) {
switch (tint) {
case "blue":
return "Blue Tinted";

case "grey":
return "Grey Tinted";

case "satin":
return "Satin";

default:
return "Clear";
}
}

function getSelfCleaningDisplayName(value) {
return normalizeSelfCleaningSelection(value) ===
"yes"
? "Yes"
: "No";
}

function orderItemsMatch(first, second) {
return (
first.size === second.size &&
first.glazing === second.glazing &&
first.type === second.type &&
Number(first.border) ===
Number(second.border) &&
first.tint === second.tint &&
normalizeSelfCleaningSelection(
first.selfCleaning
) === normalizeSelfCleaningSelection(
second.selfCleaning
) &&
Number(first.unitPrice) ===
Number(second.unitPrice)
);
}

function customOrderItemsMatch(first, second) {
return (
Number(first.width) ===
Number(second.width) &&
Number(first.length) ===
Number(second.length) &&
first.glazing === second.glazing &&
first.type === second.type &&
Number(first.border) ===
Number(second.border) &&
first.tint === second.tint &&
normalizeSelfCleaningSelection(
first.selfCleaning
) === normalizeSelfCleaningSelection(
second.selfCleaning
) &&
Number(first.unitPrice ?? first.price) ===
Number(second.unitPrice ?? second.price)
);
}

function updateSummaryTotalDisplay(element, total) {
if (!element) {
return;
}

const amount = Number(total) || 0;

element.textContent = formatMoney(amount);

element.classList.toggle(
"is-four-figure",
amount >= 1000 && amount < 10000
);

element.classList.toggle(
"is-five-figure",
amount >= 10000
);
}

function updateOrderSummaryTotalDisplay(total) {
updateSummaryTotalDisplay(
orderSummaryTotal,
total
);
}

function updateCustomOrderSummaryTotalDisplay(total) {
updateSummaryTotalDisplay(
customOrderSummaryTotal,
total
);
}

function getDifferentOrderSizeCount() {
return new Set(
state.orderItems.map(item => item.size)
).size;
}

function getDifferentCustomOrderSizeCount() {
return new Set(
state.customOrderItems.map(
item => `${item.width}x${item.length}`
)
).size;
}

========================================= */

function getBasketDrawerUnitCount() {
return getAllBasketItems().reduce(
(total, item) =>
total + op2GetSafeItemQuantity(item),
0
);
}

function getBasketDrawerProductSubtotal() {
return (
calculateStandardProductSubtotal() +
calculateCustomProductSubtotal()
);
}

function getBasketDrawerDeliveryPresentation() {
const postcode =
String(state.deliveryPostcode || "").trim();

if (state.deliveryRequiresQuote) {
return {
status:
state.deliveryQuoteReason ||
"Delivery quotation required.",
charge: "Quotation Required",
chargeClass: "is-quote",
showDeliveryResult: true,
showEstimatedDelivery: false,
estimatedDelivery: ""
};
}

if (
state.deliveryResolved &&
state.deliveryFee !== null &&
state.deliveryFee !== undefined &&
Number.isFinite(Number(state.deliveryFee))
) {
const fee = Math.max(
0,
Number(state.deliveryFee)
);

return {
status: postcode
? `Delivery calculated for ${postcode}.`
: "Delivery calculated.",
charge:
fee === 0
? "FREE"
: formatMoney(fee),
chargeClass:
fee === 0 ? "is-free" : "",
showDeliveryResult: true,
showEstimatedDelivery: true,
estimatedDelivery:
getBasketEstimatedDeliveryText()
};
}

if (postcode) {

"Checking delivery for this postcode.",
charge: "Calculated by postcode",
chargeClass: "",
showDeliveryResult: true,
showEstimatedDelivery: false,
estimatedDelivery: ""
};

return {
status: "",
charge: "",
chargeClass: "",
showDeliveryResult: false,
showEstimatedDelivery: false,
estimatedDelivery: ""
};

function getBasketDrawerItemKey(item, kind, index) {
const id = ensureBasketOrderItemId(
item,
kind

return id
? `${kind}:${id}`

kind,
index,
item?.size,
item?.width,
item?.length

/* =========================================

USE THE EXISTING ITEM DIRECTLY.

NEVER REMOVE IT OR WRITE STORAGE WHILE

function buildBasketDrawerItemHTML(
item,
kind,

const isCustom = kind === "custom";

ensureBasketOrderItemId(item, kind);

op2GetSafeItemQuantity(item);

op2GetBasketConfiguration(item);

const dimensions = isCustom
? op2GetCustomDimensionsFromItem(item)
: (() => {
const size =
getPossibleStandardSizeFromItem(item);

const [width, length] =
size.split("x").map(Number);

return { width, length };
})();

const width = dimensions.width;
const length = dimensions.length;

const validDimensions =
Number.isFinite(width) &&
Number.isFinite(length) &&
width > 0 &&
length > 0;

const sizeKey = validDimensions
? `${width}x${length}`
: String(item.size || "");

const basketSize = validDimensions
? `${width} × ${length}mm`
: String(item.size || "Custom Size");

const description =
buildBasketDrawerDescriptionForSelection(
configuration
);

const internal = validDimensions
? formatCustomDimension(width, length)
: "—";

const externalDimensions = validDimensions
? getExternalDimensionsFor(
sizeKey,
configuration.border
)
: null;

const external = externalDimensions
? formatCustomDimension(
externalDimensions.width,
externalDimensions.length
)
: "—";

let topGlass = "";

try {
topGlass = getTopGlassLabelFor(
sizeKey,
configuration.border,
configuration.glazing,
configuration.type,
configuration.tint
);

topGlass = "";

getSelfCleaningDisplayName(
configuration.selfCleaning
);

op2GetSafeItemPrice(item);

getBasketDrawerItemKey(
item,
kind,
index
);

basketDrawerExpandedItems.has(itemKey);

${escapeHTML(basketSize)}
</span>

${escapeHTML(description)}
</span>
</span>
</button>

<button
type="button"
class="basket-drawer-item-expand-strip"
data-basket-item-toggle
aria-expanded="${expanded ? "true" : "false"}"

aria-label="${expanded ? "Collapse" : "Expand"} full unit summary"
>
<span
class="basket-drawer-item-expand-arrow"
aria-hidden="true"
></span>
</button>

<div
class="basket-drawer-item-collapse"
id="${escapeHTML(collapseId)}"
data-basket-item-collapse
aria-hidden="${expanded ? "false" : "true"}"
${expanded ? "" : "hidden"}
>

<div class="basket-drawer-item-specs">

<div class="basket-drawer-item-spec">
<span>Glazing</span>
<strong>${escapeHTML(getGlazingDisplayName(configuration.glazing))}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>Glass Construction</span>
<strong>${escapeHTML(getTypeDisplayName(configuration.type))}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>Top Glass</span>
<strong>${escapeHTML(topGlass)}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>Glass Finish</span>
<strong>${escapeHTML(getTintDisplayName(configuration.tint))}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>Internal</span>
<strong>${escapeHTML(internal)}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>External</span>
<strong>${escapeHTML(external)}</strong>
</div>

<div class="basket-drawer-item-spec">
<span>Self Cleaning</span>
<strong>${escapeHTML(selfCleaning)}</strong>
</div>

<span>Unit Price</span>
<strong>${unitPrice > 0 ? escapeHTML(formatMoney(unitPrice)) : ""}</strong>
</div>

</div>

<div class="basket-drawer-item-total">

<div>
<div class="basket-drawer-item-total-label">
Line Total
</div>

inc. vat
</div>
</div>

========================================= */

function renderBasketDrawer() {
if (
!basketDrawerBody ||
!basketDrawerFooter ||
!basketDrawerCount
) {

}

normaliseBasketItemsForStableRendering();

const count = getBasketDrawerUnitCount();

basketDrawerCount.textContent =
`${count} ${count === 1 ? "unit" : "units"}`;

const hasItems =
getAllBasketItems().length > 0;

if (!hasItems) {

basketDrawerBody.innerHTML = `

<p>
Configured rooflights will appear here
when you add them to your order.
</p>
</div>
`;

basketDrawerFooter.innerHTML =
buildBasketDrawerFooterHTML();

updateCheckoutAvailability();

return;
}

const standardMarkup =
state.orderItems
.map((item, index) =>
buildBasketDrawerItemHTML(
item,
"standard",
index
)
)
.join("");

const customMarkup =
state.customOrderItems
.map((item, index) =>
buildBasketDrawerItemHTML(
item,
"custom",
index
)
)
.join("");

basketDrawerBody.innerHTML = `
<div class="basket-drawer-items">
${standardMarkup}
${customMarkup}
</div>

basketDrawerFooter.innerHTML =

/* =========================================
EXPAND / COLLAPSE

NO NORMALISATION.
NO STORAGE WRITE.
NO POSTCODE CALCULATION.
NO BASKET RE-RENDER.

THIS IS AN EXCLUSIVELY VISUAL ACTION.
========================================= */

function toggleBasketDrawerItem(toggleButton) {
if (!toggleButton) {
return;
}

const item = toggleButton.closest(
".basket-drawer-item"
);

if (!item) {
return;
}

const collapse = item.querySelector(
"[data-basket-item-collapse]"
);

if (!collapse) {
return;
}

const key = String(
item.dataset.basketItemKey || ""
);

const expand =
!item.classList.contains("is-expanded");

item.classList.toggle(
"is-expanded",
expand
);

item
.querySelectorAll(
"[data-basket-item-toggle]"
)
.forEach(button => {
button.setAttribute(
"aria-expanded",
String(expand)
);

if (
button.classList.contains(
"basket-drawer-item-expand-strip"
)
) {
button.setAttribute(
"aria-label",
expand
? "Collapse full unit summary"
: "Expand full unit summary"
);
}
});

collapse.hidden = !expand;

collapse.setAttribute(
"aria-hidden",
String(!expand)
);

if (key) {
if (expand) {
basketDrawerExpandedItems.add(key);
} else {
basketDrawerExpandedItems.delete(key);
}
}
}

/* =========================================
BASKET MODAL / PAGE LOCK
========================================= */

function getBasketBackgroundElements() {
if (!basketDrawerLayer) {
return [];
}

return Array.from(
document.body.children
).filter(
element =>
element !== basketDrawerLayer &&
element !== desktopAccessBlocker &&
element.tagName !== "SCRIPT"
);
}

function setBasketBackgroundInert(shouldBeInert) {
getBasketBackgroundElements().forEach(
element => {
element.inert = shouldBeInert;
}
);
}

function cancelPendingOrderPageAutoScrolls() {
if (addToOrderScrollTimer !== null) {
clearTimeout(addToOrderScrollTimer);
addToOrderScrollTimer = null;
}

if (customAddToOrderScrollTimer !== null) {
clearTimeout(customAddToOrderScrollTimer);
customAddToOrderScrollTimer = null;
}

if (activeScrollFrame !== null) {
cancelAnimationFrame(activeScrollFrame);
activeScrollFrame = null;
}
}

function lockBasketPageScroll() {
cancelPendingOrderPageAutoScrolls();

basketDrawerScrollY =
window.scrollY ||
document.documentElement.scrollTop ||
0;

basketDrawerPreviousBodyStyles = {
position: document.body.style.position,
top: document.body.style.top,
left: document.body.style.left,
right: document.body.style.right,
width: document.body.style.width,
overflow: document.body.style.overflow
};

document.body.classList.add(
"basket-drawer-open"
);

document.body.style.position = "fixed";
document.body.style.top =
`-${basketDrawerScrollY}px`;

document.body.style.left = "0";
document.body.style.right = "0";
document.body.style.width = "100%";
document.body.style.overflow = "hidden";
}

function unlockBasketPageScroll() {
const exactY = Math.max(
0,
Number(basketDrawerScrollY) || 0
);

document.body.classList.remove(
"basket-drawer-open"
);

const previous =
basketDrawerPreviousBodyStyles;

document.body.style.position =
previous?.position ?? "";

document.body.style.top =
previous?.top ?? "";

document.body.style.left =
previous?.left ?? "";

document.body.style.right =
previous?.right ?? "";

document.body.style.width =
previous?.width ?? "";

document.body.style.overflow =
previous?.overflow ?? "";

window.scrollTo(0, exactY);

window.requestAnimationFrame(() => {
if (!basketDrawerIsOpen) {
window.scrollTo(0, exactY);
}
});

basketDrawerPreviousBodyStyles = null;
}

function getBasketDrawerFocusableElements() {
if (!basketDrawerPanel) {
return [];
}

return Array.from(
basketDrawerPanel.querySelectorAll(
[
"button:not([disabled])",
"input:not([disabled])",
"select:not([disabled])",
"textarea:not([disabled])",
"a[href]",
"[tabindex]:not([tabindex='-1'])"
].join(",")
)
).filter(
element =>
!element.hasAttribute("hidden") &&

document.activeElement;

basketDrawerIsOpen = true;

lockBasketPageScroll();
setBasketBackgroundInert(true);

);

basketDrawerLayer.setAttribute(
"aria-hidden",
"false"
);

"aria-expanded",
"true"
);

const target =
basketDrawerClose ||
basketDrawerPanel;

target.focus({

});
});

function closeBasketDrawer({
restoreFocus = true
} = {}) {
if (
!basketDrawerLayer ||
!basketButton ||
!basketDrawerIsOpen
) {
return;
}

cancelPendingOrderPageAutoScrolls();

basketDrawerIsOpen = false;

basketDrawerLayer.classList.remove(
"is-open"
);

basketDrawerLayer.setAttribute(
"aria-hidden",
"true"
);

basketButton.setAttribute(
"aria-expanded",
"false"
);

setBasketBackgroundInert(false);
unlockBasketPageScroll();

applyDesktopAccessRestriction();

if (
restoreFocus &&
!desktopAccessMediaQuery.matches
) {
window.requestAnimationFrame(() => {
const target =
basketDrawerLastFocusedElement instanceof
HTMLElement
? basketDrawerLastFocusedElement
: basketButton;

if (
target &&
document.contains(target)
) {
target.focus({
preventScroll: true
});
}
});
}

basketDrawerLastFocusedElement = null;
}

function adjustBasketDrawerItemQuantity(
kind,
itemId,
change,
fallbackIndex = null
) {
const collection =
getBasketCollection(kind);

const index =
getBasketItemIndexById(
kind,
itemId,
fallbackIndex
);

if (
index < 0 ||
index >= collection.length
) {
return;
}

const item = collection[index];

ensureBasketOrderItemId(item, kind);

const current =
op2GetSafeItemQuantity(item);

const next = Math.max(
1,
Math.min(999, current + change)
);

if (next === current) {
return;
}

item.quantity = next;
item.qty = next;

commitBasketDrawerMutation();
}

function removeBasketDrawerItem(
kind,
itemId,
fallbackIndex = null
) {
const collection =
getBasketCollection(kind);

const index =
getBasketItemIndexById(
kind,
itemId,
fallbackIndex
);

if (
index < 0 ||
index >= collection.length
) {
return;
}

const item = collection[index];

basketDrawerExpandedItems.delete(
getBasketDrawerItemKey(
item,
kind,
index
)
);

collection.splice(index, 1);

commitBasketDrawerMutation();
}

/* =========================================
SCROLL HELPERS
========================================= */

function getElementViewportCentreTarget(element) {
const rect = element.getBoundingClientRect();

return Math.max(
0,
window.scrollY +
rect.top +
rect.height / 2 -
window.innerHeight / 2
);
}

function getElementViewportRatioTarget(
element,
ratio = 0.40
) {
if (!element) {
return window.scrollY;
}

const rect = element.getBoundingClientRect();

return Math.max(
0,
window.scrollY +
rect.top -
window.innerHeight * Number(ratio)
);
}

function scrollElementToViewportCentre(element) {
if (!element) {
return;
}

window.scrollTo({
top: getElementViewportCentreTarget(element),
behavior:
reducedMotionQuery.matches
? "auto"
: "smooth"
});
}

function animateScrollToTarget(
target,
duration = 560
) {
if (activeScrollFrame !== null) {
cancelAnimationFrame(activeScrollFrame);
activeScrollFrame = null;
}

if (reducedMotionQuery.matches) {
window.scrollTo(0, target);
return;
}

const start = window.scrollY;
const distance = target - start;

if (Math.abs(distance) < 2) {
window.scrollTo(0, target);
return;
}

const startTime = performance.now();

function easeInOutCubic(progress) {
return progress < 0.5
? 4 * progress * progress * progress
: 1 -
Math.pow(-2 * progress + 2, 3) / 2;
}

function step(time) {
const progress = Math.min(
1,
(time - startTime) / duration
);

window.scrollTo(
0,
start +
distance * easeInOutCubic(progress)
);

if (progress < 1) {
activeScrollFrame =
requestAnimationFrame(step);
} else {
activeScrollFrame = null;
}
}

activeScrollFrame =
requestAnimationFrame(step);
}

function animateElementToViewportCentre(
element,
duration = 560
) {
if (!element) {
return;
}

animateScrollToTarget(
getElementViewportCentreTarget(element),
duration
);
}

function animateElementToViewportRatio(
element,
ratio = 0.40,
duration = 560
) {
if (!element) {
return;
}

animateScrollToTarget(
getElementViewportRatioTarget(
element,
ratio
),
duration
);
}

/* =========================================
LOAD CONFIGURATOR FROM QUERY
========================================= */

function loadStateFromQuery() {
const params =
new URLSearchParams(location.search);

const source =
String(params.get("source") || "")
.toLowerCase();

const focus =
String(params.get("focus") || "")
.toLowerCase();

const explicitCustomQuery = [
"homepage-custom-order",
"homepage-custom",
"custom-builder",
"custom-rooflight"
].includes(source) ||
[
"custom-builder",
"custom-rooflight",
"custom-order-summary"
].includes(focus);

const rawWidth = params.get("width");
const rawLength = params.get("length");

const hasWidth =
rawWidth !== null &&
String(rawWidth).trim() !== "";

const hasLength =
rawLength !== null &&
String(rawLength).trim() !== "";

const queryWidth = hasWidth
? Number(rawWidth)
: null;

const queryLength = hasLength
? Number(rawLength)
: null;

const usableDimensions =
hasWidth &&
hasLength &&
Number.isFinite(queryWidth) &&
Number.isFinite(queryLength);

let size = normalizeSize(
params.get("size")
);

if (
!size &&
!explicitCustomQuery &&
usableDimensions
) {
const candidate = normalizeSize(
`${queryWidth}x${queryLength}`
);

if (PRODUCTS[candidate]) {
size = candidate;
}
}

const glazing = String(
params.get("glazing") || ""
).toLowerCase();

const type = String(
params.get("type") || ""
).toLowerCase();

const border = Number(
params.get("border")
);

const tint = normalizeTint(
params.get("finish") ??
params.get("tint")
);

const selfCleaning =
normalizeSelfCleaningSelection(
params.get("selfCleaning")
);

const priceRaw = String(
params.get("price") ?? ""
).trim();

const priceNumber = Number(
priceRaw.replace(/£|,/g, "")
);

const importedPrice =
priceRaw &&
Number.isFinite(priceNumber) &&
priceNumber > 0
? priceNumber
: null;

const importedImage = String(
params.get("image") || ""
);

if (size && PRODUCTS[size]) {
state.size = size;
}

if (["double", "triple"].includes(glazing)) {
state.glazing = glazing;
}

if (
["toughened", "laminated"].includes(type)
) {
state.type = type;
} else if (source === "homepage") {
state.type = "toughened";
}

if ([100, 125, 150].includes(border)) {
state.border = border;
} else if (source === "homepage") {
state.border = 100;
}

state.tint = tint;
state.selfCleaning = selfCleaning;

if (source === "homepage") {
state.homepageImport = {
source: "homepage",
size: state.size,
glazing: state.glazing,
type: state.type,
border: state.border,
tint: state.tint,
selfCleaning: state.selfCleaning,
price: importedPrice,
image: importedImage
};
}

if (
explicitCustomQuery &&
usableDimensions
) {
customState.width = queryWidth;
customState.length = queryLength;

if (customInternalWidth) {
customInternalWidth.value =
String(queryWidth);
}

if (customInternalLength) {
customInternalLength.value =
String(queryLength);
}

if (["double", "triple"].includes(glazing)) {
customState.glazing = glazing;
}

if (
["toughened", "laminated"].includes(type)
) {
customState.type = type;
}

if ([100, 125, 150].includes(border)) {
customState.border = border;
}

customState.tint = tint;
customState.selfCleaning =
selfCleaning;
}
}

function getCustomBuildDropdownStateValue(dropdown) {

dropdown?.dataset.customSetting;

return String(customState.border);

return customState.glazing;

return customState.type;

default:
return null;
}
}

function syncCustomBuildDropdownDisplayFromState() {
customBuildDropdowns.forEach(dropdown => {

getCustomBuildDropdownStateValue(
dropdown
);

const valueElement =
dropdown.querySelector(
"[data-custom-build-dropdown-value]"
);

const options = Array.from(
dropdown.querySelectorAll(
"[data-custom-build-dropdown-option]"
)
);

const selected = options.find(
option =>
String(option.dataset.value || "") ===
String(stateValue)
);

if (!selected) {
return;
}

const value = String(
selected.dataset.value ||
stateValue
);

const label =
selected.dataset.label ||
selected.textContent.trim();

dropdown.dataset.value = value;

if (valueElement) {
valueElement.textContent = label;
}

options.forEach(option => {
const isSelected = option === selected;

option.classList.toggle(
"is-selected",
isSelected
);

option.setAttribute(
"aria-selected",
String(isSelected)
);
});
});
}
