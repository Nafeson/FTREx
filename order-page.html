========================================= */

const HOMEPAGE_CUSTOM_ORDER_HANDOFF_STORAGE_KEY =
"factoryToughenedRooflightsHomepageCustomOrderHandoffV1";

const HOMEPAGE_ARRIVAL_MAX_RETRIES = 18;
const HOMEPAGE_ARRIVAL_RETRY_DELAY = 70;
const HOMEPAGE_ARRIVAL_LAYOUT_DELAY = 90;

let homepageArrivalRetryTimer = null;
let homepageArrivalScrollTimer = null;

function clearHomepageArrivalTimers() {
if (homepageArrivalRetryTimer !== null) {
clearTimeout(homepageArrivalRetryTimer);
homepageArrivalRetryTimer = null;
}

if (homepageArrivalScrollTimer !== null) {
clearTimeout(homepageArrivalScrollTimer);
homepageArrivalScrollTimer = null;
}
}

function readHomepageCustomOrderHandoff() {
try {
const stored = sessionStorage.getItem(
HOMEPAGE_CUSTOM_ORDER_HANDOFF_STORAGE_KEY
);

if (!stored) {
return null;
}

const parsed = JSON.parse(stored);

return parsed && typeof parsed === "object"
? parsed
: null;
} catch (error) {
return null;
}
}

function readLegacyHomepageOrderFocus() {
try {
const stored = sessionStorage.getItem(
HOMEPAGE_ORDER_FOCUS_KEY
);

if (!stored) {
return null;
}

const parsed = JSON.parse(stored);

return parsed && typeof parsed === "object"
? parsed
: null;
} catch (error) {
return null;
}
}

function readHomepageOrderFocusRequest() {
const params =
new URLSearchParams(location.search);

const handoff =
readHomepageCustomOrderHandoff();

const storedFocus =
readLegacyHomepageOrderFocus();

const source = String(
handoff?.source ||
storedFocus?.source ||
params.get("source") ||
""
).toLowerCase();

const type = String(
handoff?.type ||
storedFocus?.type ||
""
).toLowerCase();

const focus = String(
handoff?.focus ||
storedFocus?.focus ||
params.get("focus") ||
""
).toLowerCase();

const id = String(
handoff?.customItemId ||
handoff?.itemId ||
handoff?.id ||
handoff?.item?.id ||
handoff?.item?._id ||
storedFocus?.customItemId ||
storedFocus?.itemId ||
storedFocus?.id ||
params.get("customItemId") ||
params.get("customId") ||
""
);

const viewportOffsetRaw = Number(
handoff?.viewportOffset ??
storedFocus?.viewportOffset ??
params.get("viewportOffset")
);

const topRatioRaw = Number(
handoff?.topRatio ??
storedFocus?.topRatio ??
(
Number(params.get("top")) / 100
)
);

const topRatio =
Number.isFinite(viewportOffsetRaw) &&
viewportOffsetRaw > 0 &&
viewportOffsetRaw < 1
? viewportOffsetRaw
: (
Number.isFinite(topRatioRaw) &&
topRatioRaw > 0 &&
topRatioRaw < 1
? topRatioRaw
: 0.30
);

return {
source,
type,
focus,
id,

storedFocus?.center ??

topRatio

function consumeHomepageOrderFocusRequest() {
try {
sessionStorage.removeItem(
HOMEPAGE_CUSTOM_ORDER_HANDOFF_STORAGE_KEY
);
} catch (error) {
}

try {
sessionStorage.removeItem(
HOMEPAGE_ORDER_FOCUS_KEY
);
} catch (error) {
}

const url = new URL(
window.location.href
);

const source = String(
url.searchParams.get("source") || ""
).toLowerCase();

[
"focus",
"customItemId",
"customId",
"top",
"viewportOffset"
].forEach(key => {
url.searchParams.delete(key);
});

if (
source === "homepage-custom-order" ||
source === "homepage-custom"
) {
url.searchParams.delete("source");
}

history.replaceState(
{},
"",
url.pathname +
(
url.searchParams.toString()
? "?" + url.searchParams.toString()
: ""
) +
url.hash
);
}

function findHomepageCustomOrderIndex(request) {
const requestedId =
String(request?.id || "");

if (requestedId) {
const found =
state.customOrderItems.findIndex(
item =>
String(
item?.id ?? item?._id ?? ""
) === requestedId
);

if (found >= 0) {
return found;
}
}

const handoff = request?.handoff;

const handoffItem =
handoff?.item &&
typeof handoff.item === "object"
? handoff.item
: handoff;

if (
handoffItem &&
typeof handoffItem === "object"
) {
const configuration =
handoffItem.configuration &&
typeof handoffItem.configuration === "object"
? handoffItem.configuration
: handoffItem;

const width = Number(
configuration.width ??
configuration.internalWidth
);

const length = Number(
configuration.length ??
configuration.internalLength
);

const glazing = String(
configuration.glazing ??
configuration.glazingConfiguration ??
""
).toLowerCase();

const type = String(
configuration.type ??
configuration.glazingConstruction ??
""
).toLowerCase();

const border = Number(
configuration.border
);

const tint = normalizeTint(
configuration.tint ??
configuration.finish
);

const selfCleaning =
normalizeSelfCleaningSelection(
configuration.selfCleaning
);

if (
Number.isFinite(width) &&
Number.isFinite(length)
) {
const found =
state.customOrderItems.findIndex(
item =>
Number(
item.width ?? item.internalWidth
) === width &&
Number(
item.length ?? item.internalLength
) === length &&
(
!glazing ||
item.glazing === glazing
) &&
(
!type ||
item.type === type
) &&
(
!Number.isFinite(border) ||
Number(item.border) === border
) &&
item.tint === tint &&
normalizeSelfCleaningSelection(
item.selfCleaning
) === selfCleaning
);

if (found >= 0) {
return found;
}
}
}

for (
let index = state.customOrderItems.length - 1;
index >= 0;
index -= 1
) {
const source = String(
state.customOrderItems[index]?.source ||
""
).toLowerCase();

if (
source === "homepage-custom-order" ||
source === "homepage-custom" ||
source === "homepage-custom-calculator" ||
source === "homepage"
) {
return index;
}
}

return -1;
}

function getHomepageCustomSummaryTarget(
targetIndex,
request
) {
if (!customOrderSummaryItems) {
return null;
}

const requestedId =
String(request?.id || "");

if (requestedId) {
const byId = Array.from(
customOrderSummaryItems.querySelectorAll(
"[data-custom-order-item-id]"
)
).find(
element =>
String(
element.dataset.customOrderItemId ||
""
) === requestedId
);

if (byId) {
return byId;
}
}

const byIndex =
customOrderSummaryItems.querySelector(
`[data-custom-order-summary-item-index="${targetIndex}"]`
);

if (byIndex) {
return byIndex;
}

return (
customOrderSummarySection &&
!customOrderSummarySection.hidden
)
? customOrderSummarySection
: null;
}

function homepageCustomSummaryIsReady(target) {
if (
!target ||
!document.documentElement.contains(target) ||
!customOrderSummarySection ||
customOrderSummarySection.hidden
) {
return false;
}

const rect =
target.getBoundingClientRect();

return (
Number.isFinite(rect.top) &&
Number.isFinite(rect.height) &&
rect.height > 0
);
}

function performHomepageArrivalScroll(
target,
request
) {
if (
!target ||
basketDrawerIsOpen
) {
return;
}

const animate =
request?.animate !== false &&
!reducedMotionQuery.matches;

const position =
request?.center === true
? getElementViewportCentreTarget(target)
: getElementViewportRatioTarget(
target,
request?.topRatio ?? 0.30
);

if (animate) {
animateScrollToTarget(
position,
560
);
} else {
window.scrollTo(0, position);
}
}

function waitForHomepageCustomSummaryAndScroll(
request,
targetIndex,
attempt = 0
) {
if (homepageArrivalRetryTimer !== null) {
clearTimeout(homepageArrivalRetryTimer);
homepageArrivalRetryTimer = null;
}

requestAnimationFrame(() => {
requestAnimationFrame(() => {
const target =
getHomepageCustomSummaryTarget(
targetIndex,
request
);

if (
!homepageCustomSummaryIsReady(target)
) {
if (
attempt <
HOMEPAGE_ARRIVAL_MAX_RETRIES
) {
homepageArrivalRetryTimer =
setTimeout(() => {
homepageArrivalRetryTimer = null;

waitForHomepageCustomSummaryAndScroll(
request,
targetIndex,
attempt + 1
);
}, HOMEPAGE_ARRIVAL_RETRY_DELAY);
}

return;
}

if (homepageArrivalScrollTimer !== null) {
clearTimeout(homepageArrivalScrollTimer);
}

homepageArrivalScrollTimer = setTimeout(
() => {
homepageArrivalScrollTimer = null;

if (basketDrawerIsOpen) {
return;
}

const settled =
getHomepageCustomSummaryTarget(
targetIndex,
request
);

if (
!homepageCustomSummaryIsReady(
settled
)
) {
if (
attempt <
HOMEPAGE_ARRIVAL_MAX_RETRIES
) {
waitForHomepageCustomSummaryAndScroll(
request,
targetIndex,
attempt + 1
);
}

return;
}

consumeHomepageOrderFocusRequest();

performHomepageArrivalScroll(
settled,
request
);
},
HOMEPAGE_ARRIVAL_LAYOUT_DELAY
);
});
});
}

function handleHomepageArrivalFocus(attempt = 0) {
const request =
readHomepageOrderFocusRequest();

const builderRequest =
request.type === "custom-builder" ||
request.focus === "custom-builder";

if (builderRequest) {
clearHomepageArrivalTimers();

consumeHomepageOrderFocusRequest();

requestAnimationFrame(() => {
requestAnimationFrame(() => {
animateElementToViewportRatio(
customRooflightBuilder,
request.topRatio,
560
);
});
});

return;
}

const customOrderRequest =
request.source === "homepage-custom-order" ||
request.source === "homepage-custom" ||
request.type === "custom" ||
request.focus === "custom-order-summary";

if (!customOrderRequest) {
return;
}

normaliseBasketItemsForStableRendering();

const index =
findHomepageCustomOrderIndex(request);

if (index < 0) {
if (
attempt <
HOMEPAGE_ARRIVAL_MAX_RETRIES
) {
if (homepageArrivalRetryTimer !== null) {
clearTimeout(homepageArrivalRetryTimer);
}

homepageArrivalRetryTimer = setTimeout(
() => {
homepageArrivalRetryTimer = null;

handleHomepageArrivalFocus(
attempt + 1
);
},
HOMEPAGE_ARRIVAL_RETRY_DELAY
);
}

return;
}

clearHomepageArrivalTimers();

renderCustomOrderSummary({
animate: request.animate,
focusOrderIndex: index
});

renderOrderSummary({
animate: false
});

renderBasketDrawer();

op2UpdateBasketHeaderTotal(
state.basketTotal
);

updateCheckoutAvailability();
updateEstimatedDelivery();
requestOrderSummaryDeliveryWidthSync();

playHomepageCustomAddedFeedback();

waitForHomepageCustomSummaryAndScroll(
request,
index
);
}

/* =========================================
SCROLL REVEAL
========================================= */

const revealElements = Array.from(
document.querySelectorAll(".reveal")
);

if (
reducedMotionQuery.matches ||
!("IntersectionObserver" in window)
) {
revealElements.forEach(element => {
element.classList.add("is-visible");
});
} else {
const revealObserver = new IntersectionObserver(
entries => {
entries.forEach(entry => {
if (!entry.isIntersecting) {
return;
}

entry.target.classList.add(
"is-visible"
);

revealObserver.unobserve(
entry.target
);
});
},
{
threshold: 0.14,
rootMargin: "0px 0px -7% 0px"
}
);

revealElements.forEach(element => {
revealObserver.observe(element);
});
}

/* =========================================
CUSTOM CALCULATOR LIMITS
========================================= */

const CUSTOM_CALCULATOR_MIN_WIDTH = 290;
const CUSTOM_CALCULATOR_MAX_WIDTH = 1500;

const CUSTOM_CALCULATOR_MIN_LENGTH = 290;
const CUSTOM_CALCULATOR_MAX_LENGTH = 3000;

const CUSTOM_CALCULATOR_LONG_LENGTH = 2000;
const CUSTOM_CALCULATOR_LONG_MIN_WIDTH = 500;

function customDimensionsAreValid(width, length) {
const safeWidth = Number(width);
const safeLength = Number(length);

if (
!Number.isFinite(safeWidth) ||
!Number.isFinite(safeLength)
) {
return false;
}

if (
safeWidth < CUSTOM_CALCULATOR_MIN_WIDTH ||
safeWidth > CUSTOM_CALCULATOR_MAX_WIDTH
) {
return false;
}

if (
safeLength < CUSTOM_CALCULATOR_MIN_LENGTH ||
safeLength > CUSTOM_CALCULATOR_MAX_LENGTH
) {
return false;
}

if (
safeLength > CUSTOM_CALCULATOR_LONG_LENGTH &&
safeWidth < CUSTOM_CALCULATOR_LONG_MIN_WIDTH
) {
return false;
}

return true;
}

function customInputsAreValid() {
return customDimensionsAreValid(
customState.width,
customState.length
);
}

function calculateCustomPriceForSelection(selection) {
if (
!customDimensionsAreValid(
selection?.width,
selection?.length
)
) {
return null;
}

const result = getMasterCustomPriceResult({
width: selection.width,
length: selection.length,
glazing: selection.glazing,
type: selection.type,
finish:
selection.tint ?? selection.finish,
border: selection.border,
selfCleaning: selection.selfCleaning
});

if (!result.available) {
return null;
}

const price = Number(result.price);

return Number.isFinite(price) && price > 0
? price
: null;
}

function selectedCustomPrice() {
return calculateCustomPriceForSelection({
width: customState.width,
length: customState.length,
glazing: customState.glazing,
type: customState.type,
tint: customState.tint,
border: customState.border,
selfCleaning: customState.selfCleaning
});
}

function validateCustomLeadTimes() {
const checks = [
{
type: "toughened",
tint: "clear",
min: 4,
max: 6
},
{
type: "toughened",
tint: "grey",
min: 6,
max: 8
},
{
type: "toughened",
tint: "satin",
min: 6,
max: 8
},
{
type: "toughened",
tint: "blue",
min: 8,
max: 10
},
{
type: "laminated",
tint: "clear",
min: 6,
max: 8
},
{
type: "laminated",
tint: "blue",
min: 8,
max: 10
}
];

checks.forEach(check => {
const result =
getLeadTimeForSelection(check);

if (
result.min !== check.min ||
result.max !== check.max
) {
console.warn(
"Custom lead-time validation failed:",
check,
result
);
}
});
}
